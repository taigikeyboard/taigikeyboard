# Windows input method — its own Cargo workspace, deliberately NOT a member of
# `engine/`: that workspace forbids `unsafe_code` (a TSF COM server cannot) and
# pins Apple/Android toolchain targets. The engine crates are consumed by path,
# so the TIP links the same `dispatch` / `protos` every other platform speaks to.
#
# Version is the single source of truth for the Windows release train and is
# written by the repo-root `make version x.y.z` alongside iOS / Android / macOS.
# Design record: docs/architecture/windows-roadmap.md.

[workspace]
resolver = "2"
members = [
    "crates/taigi-windows-core",
    "crates/taigi-windows-storage",
    "crates/taigi-windows-tsf",
    "crates/taigi-windows-platform",
    "crates/taigi-windows-settings",
]

[workspace.package]
version = "3.6.6"
edition = "2021"
rust-version = "1.86"
license = "MIT"
repository = "https://github.com/siansiansu/taigikeyboard"
publish = false

[workspace.dependencies]
# Engine crates, by path. `dispatch` is the one entry point the TIP calls;
# `protos` gives the prost types the envelope is built from.
dispatch = { path = "../engine/dispatch" }
protos = { path = "../engine/protos" }
prost = "0.14"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# `bundled` compiles SQLite in: no system library to find on a user's machine,
# one version everywhere, and the same WAL/UPSERT capability floor on every
# Windows the DLL loads on (contrast Android, `android-guidelines.md §8a`).
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
# The COM / TSF bindings. `#[implement]` (the COM-object macro) lives in
# `windows-core`, which is a direct dependency because the macro's expansion
# names it.
windows = "0.62"
windows-core = "0.62"
# `Vector2` for Direct2D draw origins (the `windows` crate takes it by this type).
windows-numerics = "0.3"

taigi-windows-core = { path = "crates/taigi-windows-core" }
taigi-windows-storage = { path = "crates/taigi-windows-storage" }
taigi-windows-tsf = { path = "crates/taigi-windows-tsf" }
taigi-windows-platform = { path = "crates/taigi-windows-platform" }
# The settings window's UI toolkit, pinned to the API this session authored
# against (roadmap W15); bump only with a Windows machine to run the result.
# `accesskit` ON: the settings window exposes a Windows accessibility tree
# (screen readers, keyboard navigation) — a product decision, not chrome.
eframe = { version = "=0.31.1", default-features = false, features = ["accesskit", "glow", "default_fonts", "persistence"] }
egui = "=0.31.1"
egui_extras = { version = "=0.31.1", default-features = false }
# Native file dialogs (Win32 common dialogs); no GTK / portal features.
rfd = { version = "0.17", default-features = false }

[workspace.lints.rust]
# Every crate opts in with `[lints] workspace = true`. The default is the
# strict one the pure crates must keep; a shell that needs `unsafe` (a COM
# server does) overrides it in its own manifest with a JUSTIFICATION, the way
# `engine/android-jni` does.
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Unwinding stays ON for the DLL: every COM entry point is a `catch_unwind`
# boundary (`docs/engine/ffi-safety.md` §2), and `panic = "abort"` would take
# the host process down with the input method. rakukan chose abort and spent
# a doc page auditing the consequences (`references/rakukan/docs/handoff.md`).
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"

[profile.dev]
debug = "line-tables-only"
