# Windows input method — its own Cargo workspace, deliberately NOT a member of
# `engine/`: that workspace forbids `unsafe_code` (a TSF COM server cannot) and
# pins Apple/Android toolchain targets. The engine crates are consumed by path,
# so the TIP links the same `dispatch` / `protos` every other platform speaks to.
#
# Version is the Windows source of truth for the desktop release train (macOS +
# Windows share one number; iOS + Android are the separately numbered mobile
# train) and is written by the repo-root `make version-desktop x.y.z` alongside
# macOS.
# Design record: docs/architecture/windows-roadmap.md.

[workspace]
resolver = "2"
members = [
    "crates/taigi-windows-core",
    "crates/taigi-windows-storage",
    "crates/taigi-windows-tsf",
    "crates/taigi-windows-platform",
    "crates/taigi-windows-settings",
    "crates/taigi-windows-update",
]

[workspace.package]
version = "3.6.7"
edition = "2021"
rust-version = "1.95"  # windows-reactor's floor (W17); the box runs 1.98
license = "Apache-2.0"
repository = "https://github.com/taigikeyboard/taigikeyboard"
publish = false

[workspace.dependencies]
# Engine crates, by path. `dispatch` is the one entry point the TIP calls;
# `protos` gives the prost types the envelope is built from.
dispatch = { path = "../engine/dispatch" }
protos = { path = "../engine/protos" }
prost = "0.14"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# `bundled` compiles SQLite in: no system library to find on a user's machine,
# one version everywhere, and the same WAL/UPSERT capability floor on every
# Windows the DLL loads on (contrast Android, `android-guidelines.md §8a`).
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
# The published package's SHA-256, checked on every downloaded update.
sha2 = "0.10"
# The COM / TSF bindings. `#[implement]` (the COM-object macro) lives in
# `windows-core`, which is a direct dependency because the macro's expansion
# names it.
windows = "0.62"
windows-core = "0.62"
# The RAW bindings, for the handful of Win32 calls that write into a buffer we
# then read: the `windows` crate's `&mut [T]` wrappers hand the OS a pointer
# derived from `as_ptr()`, which is UB and, optimized, folds the caller's reads
# back to the buffer's initializer (`taigi-windows-platform`'s `os_out_buffer`).
windows-sys = "0.61"
# `Vector2` for Direct2D draw origins (the `windows` crate takes it by this type).
windows-numerics = "0.100"

taigi-windows-core = { path = "crates/taigi-windows-core" }
taigi-windows-storage = { path = "crates/taigi-windows-storage" }
taigi-windows-tsf = { path = "crates/taigi-windows-tsf" }
taigi-windows-platform = { path = "crates/taigi-windows-platform" }
taigi-windows-update = { path = "crates/taigi-windows-update" }
# The window handle a file dialog is owned by. `rfd` asks for it through
# this trait; the HWND behind it is `taigi-windows-platform`'s to read,
# since Reactor hands none out.
raw-window-handle = "0.6"
# Native file dialogs (Win32 common dialogs); no GTK / portal features.
rfd = { version = "0.17", default-features = false }
# The settings window's UI — WinUI 3 through Microsoft's declarative Rust
# library (roadmap W17; it replaced eframe/egui at the W17-C cutover). crates.io carries only 0.0.0 placeholders, so this is a git
# dependency pinned to the commit the 2026-08-30 spike built and ran on the
# Windows box; bump only in its own round, built and smoke-run there. The
# setup crate stages the self-contained Windows App Runtime from build.rs
# (MSVC only — it refuses the gnu host check).
windows-reactor = { git = "https://github.com/microsoft/windows-rs", rev = "dc720b3674c46ceb82d758ed20959977b32e60a9" }
windows-reactor-setup = { git = "https://github.com/microsoft/windows-rs", rev = "dc720b3674c46ceb82d758ed20959977b32e60a9" }

[workspace.lints.rust]
# Every crate opts in with `[lints] workspace = true`. The default is the
# strict one the pure crates must keep; a shell that needs `unsafe` (a COM
# server does) overrides it in its own manifest with a JUSTIFICATION, the way
# `engine/android-jni` does.
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Unwinding stays ON for the DLL: every COM entry point is a `catch_unwind`
# boundary (`docs/engine/ffi-safety.md` §2), and `panic = "abort"` would take
# the host process down with the input method. rakukan chose abort and spent
# a doc page auditing the consequences (`references/rakukan/docs/handoff.md`).
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"

[profile.dev]
debug = "line-tables-only"
