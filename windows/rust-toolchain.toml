[toolchain]
# A version, not `stable`: the release build must not change compiler underneath
# a commit. `.github/workflows/windows-build.yml` builds from this file.
channel = "1.99.1"
components = ["rustfmt", "clippy"]
profile = "minimal"
# JUSTIFICATION: shipped ABIs + the host check target.
#   x86_64-pc-windows-msvc  — v1 release target (64-bit hosts).
#   i686-pc-windows-msvc    — the 32-bit TIP DLL for WOW64 hosts (32-bit
#                             Office), shipped beside the x64 one as
#                             TaigiKeyboard32.dll (docs/architecture/
#                             windows-release.md § The 32-bit service).
#   aarch64-pc-windows-msvc — the Arm64 TIP DLL + settings exe, behind the
#                             Arm64X forwarder (docs/architecture/
#                             windows-arm64-roadmap.md).
#   x86_64-pc-windows-gnu   — NOT shipped. The macOS host has no MSVC C
#                             toolchain, so this is the target `make
#                             windows-check` uses to check the whole workspace
#                             as it grows (a bundled SQLite compiles via
#                             mingw-w64 here, not via cl.exe); the MSVC targets
#                             can only be `cargo check`ed for crates with no C
#                             dependency (W13).
targets = [
    "x86_64-pc-windows-msvc",
    "i686-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-pc-windows-gnu",
]
