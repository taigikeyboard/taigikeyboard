[package]
name = "taigi-windows-platform"
description = "The few Win32 calls the DLL and the settings window both need, with host stubs so the callers stay testable on macOS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
log.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
# JUSTIFICATION: the three calls here are the raw Win32 API; each `unsafe`
# block is one call with a `// SAFETY:` line. Every other crate keeps the
# workspace's `forbid`.
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
