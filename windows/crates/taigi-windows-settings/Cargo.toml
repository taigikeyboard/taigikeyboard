[package]
name = "taigi-windows-settings"
description = "TaigiKeyboardSettings.exe — the settings window, a WinUI 3 port of the macOS settings window's panes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "TaigiKeyboardSettings"
path = "src/main.rs"

[dependencies]
taigi-windows-core.workspace = true
taigi-windows-storage.workspace = true
taigi-windows-platform.workspace = true
taigi-windows-update.workspace = true
rfd.workspace = true
# `rfd` takes the dialog's owner window through this trait; Reactor hands
# out no HWND, so the window is read from the thread (`winui::file_dialog`).
raw-window-handle.workspace = true
log.workspace = true

# WinUI 3 (roadmap W17). Windows-only — the crate's UI does not compile on
# the macOS host, so the host tests cover the non-UI modules and
# `make check-box` covers the rest on the box.
[target.'cfg(windows)'.dependencies]
windows-reactor.workspace = true

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
windows-reactor-setup.workspace = true

[lints]
workspace = true
