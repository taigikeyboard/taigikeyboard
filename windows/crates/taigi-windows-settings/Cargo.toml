[package]
name = "taigi-windows-settings"
description = "TaigiKeyboardSettings.exe — the settings window, an eframe/egui port of the macOS settings window's panes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "TaigiKeyboardSettings"
path = "src/main.rs"

[dependencies]
taigi-windows-core.workspace = true
taigi-windows-storage.workspace = true
taigi-windows-platform.workspace = true
taigi-windows-update.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
rfd.workspace = true
raw-window-handle.workspace = true
log.workspace = true

# W17: WinUI 3. Windows-only — the crate does not compile on the macOS host
# (its generated bindings are Windows types), so the host tests cover the
# non-UI modules and `make check-box` covers this one on the box.
[target.'cfg(windows)'.dependencies]
windows-reactor.workspace = true

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
windows-reactor-setup.workspace = true

[lints]
workspace = true
