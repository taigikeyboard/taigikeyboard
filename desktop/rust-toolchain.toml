[toolchain]
# The root rust-toolchain.toml's version (`tools/rust-toolchain.sh check`).
channel = "1.100.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
# No cross targets: these crates are checked for the Windows and Linux targets
# through the shell workspaces that link them (`make windows-check`,
# `make linux-check`); here they build and test natively on the host.
