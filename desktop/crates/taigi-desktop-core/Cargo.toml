[package]
name = "taigi-desktop-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Platform-independent core shared by the desktop input methods (Windows, Linux): settings model, engine bridge, composing orchestration, key classifier, candidate geometry, strings"

# Pure crate on purpose: no `windows`, no D-Bus, no GTK, no rusqlite, no
# networking. That is what lets it run its tests natively on the macOS host and
# be `cargo check`ed for every shipping target there
# (docs/architecture/windows-roadmap.md W1/W13, linux-roadmap.md L2).
[lints]
workspace = true

[dependencies]
dispatch = { workspace = true }
protos = { workspace = true }
prost = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
userdata = { workspace = true }
