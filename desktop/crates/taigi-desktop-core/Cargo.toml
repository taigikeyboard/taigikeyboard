[package]
name = "taigi-desktop-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Platform-independent core shared by the desktop input methods (Windows, Linux): settings model, engine bridge, composing orchestration, shared input session, key classifier, candidate geometry, strings"

# Pure crate on purpose: no `windows`, no D-Bus, no GTK, no rusqlite, no
# networking. That is what lets it run its tests natively on the macOS host and
# be `cargo check`ed for every shipping target there
# (docs/architecture/windows-roadmap.md W1/W13, linux-roadmap.md L2).
[lints]
workspace = true

[features]
# The engine-owned user-data stores (bundled SQLite), off by default so this
# crate stays pure; a shell that ships the stores turns it on here instead of
# taking its own `dispatch` edge, unless it calls `dispatch` directly as
# `taigi-linux-core` does (user-data-engine-roadmap U11).
user-data = ["dispatch/user-data"]

[dependencies]
dispatch = { workspace = true }
protos = { workspace = true }
prost = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
