# The desktop-shared crates — the pure Rust the Windows (`windows/`) and Linux
# (`linux/`) input methods both consume by path, the way every platform consumes
# `engine/`. Its own workspace because a path dependency must find its own
# root for `version.workspace` / `[lints] workspace = true`; deliberately NOT a
# member of `engine/` (that workspace pins Apple / Android targets and is the
# engine's dependency-direction boundary) nor of either shell workspace (each
# would then own crates the other links).
#
# Version = the desktop release train's (macOS + Windows + Linux share one
# number); `make version-desktop x.y.z` at the repo root writes it here
# alongside `windows/Cargo.toml`, the source of truth.
# Design record: docs/architecture/linux-roadmap.md L2 (the move),
# docs/architecture/windows-roadmap.md W1 (the split by dependency class).

[workspace]
resolver = "2"
members = [
    "crates/taigi-desktop-core",
    "crates/taigi-desktop-storage",
    "crates/taigi-desktop-update",
]

[workspace.package]
version = "3.6.10"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/taigikeyboard/taigikeyboard"
publish = false

[workspace.dependencies]
# Engine crates, by path. `dispatch` is the one entry point a desktop shell
# calls; `protos` gives the prost types the envelope is built from.
# `default-features = false`: no user-data stores (SQLite) through dispatch until
# this platform switches (user-data-engine-roadmap U11).
dispatch = { path = "../engine/dispatch", default-features = false }
protos = { path = "../engine/protos" }
# The user-data stores, engine-owned (rust-migration-policy §6).
userdata = { path = "../engine/userdata", default-features = false }
prost = "0.14"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
# HTTPS through the system TLS stack (schannel on Windows; the macOS host's
# Security framework for the native tests). `transport.rs` selects
# `TlsProvider::NativeTls`, and ureq gates that on `cfg!(feature =
# "native-tls")` (`ureq-3/src/tls/mod.rs`) — a compile-time check against the
# umbrella feature, not the `native-tls-no-default` subset it is built from.
# Naming the subset alone builds fine and then panics on the first https
# request. No bundled root store reaches the connector regardless: the roots
# the umbrella adds are only read by the `RootCerts::WebPki` arm, and
# `transport.rs` asks for `RootCerts::PlatformVerifier` (the OS store).
ureq = { version = "3", default-features = false, features = ["native-tls"] }

taigi-desktop-core = { path = "crates/taigi-desktop-core" }
taigi-desktop-update = { path = "crates/taigi-desktop-update" }

[workspace.lints.rust]
# Every crate is safe Rust by contract; the shells that need `unsafe` live in
# their own workspaces and override it there with a JUSTIFICATION.
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
