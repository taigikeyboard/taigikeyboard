[package]
name = "taigi-macos-ffi"
description = "The static library the macOS input method links: the desktop-shell swift-bridge seam over taigi-desktop-core and the engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "taigi_macos_ffi"
crate-type = ["staticlib"]

[features]
# Release archives build with neither; build-macos-xcframework.sh asserts the
# trace is absent.
e2e-trace = ["dispatch/e2e-trace"]
panic-injector = []

[dependencies]
# macOS always ships the engine-owned user-data stores (bundled SQLite;
# docs/architecture/user-data-engine-roadmap.md P7b).
dispatch = { workspace = true, features = ["user-data"] }
taigi-desktop-core = { workspace = true, features = ["user-data"] }
log = { workspace = true }
prost = { workspace = true }
swift-bridge = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[build-dependencies]
prost-build = { workspace = true }
swift-bridge-build = { workspace = true }

# JUSTIFICATION: FFI logger sink (`src/logger.rs` `SinkCell`) overrides workspace
# `unsafe_code = "forbid"` per `docs/contributing/rust-ffi-safety.md` §3. Every
# `unsafe` impl in this crate carries a `// SAFETY:` comment per the same rule.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
