syntax = "proto3";

// The macOS desktop-shell seam: what Swift sends through
// `desktop_request_bytes` (macos/crates/taigi-macos-ffi/src/lib.rs) and what
// it gets back. Design: docs/architecture/macos-desktop-core-roadmap.md D2 / D3.
// One request in, one response out; the engine's own requests keep going
// through `process_request_bytes` and `taigi.engine.Request`.
package taigi.desktop_shell;

// For `taigi.engine.ErrorCode` — one error vocabulary for both seams
// (docs/contributing/rust-ffi-safety.md §1.5).
import "envelope.proto";

message DesktopRequest {
  // The whole-snapshot settings request of P6, now `settings` below.
  reserved 3;

  // A request with no variant set — including one from a newer Swift side
  // whose variant this library does not know — is refused with FAIL_INVARIANT.
  oneof request {
    VersionRequest version = 1;
    ConfigureRequest configure = 2;
    PrepareRequest prepare = 4;
    ActivateRequest activate = 5;
    KeyRequest key = 6;
    CommitCompositionRequest commit_composition = 7;
    CancelRequest cancel = 8;
    ReleaseRequest release = 9;
    CommitForSymbolPickerRequest commit_for_symbol_picker = 11;
    InsertSymbolRequest insert_symbol = 12;
    RepresentRequest represent = 13;
    PressRequest press = 14;
    ChordRequest chord = 15;
    ComposingShortcutsRequest composing_shortcuts = 16;
    SymbolPickerKeyRequest symbol_picker_key = 17;
    SwitchInputModeRequest switch_input_mode = 18;
    TpsKeyboardRowsRequest tps_keyboard_rows = 19;
    TpsKeyboardPressRequest tps_keyboard_press = 20;
  }

  // The key-path settings as they stand for this request, applied before it
  // runs, so a request and the settings it is read under cross the seam
  // together. Unset = the last snapshot stays. A snapshot that is refused
  // refuses the whole request with FAIL_INVARIANT; a request that is
  // refused for any reason, or answered `ignored`, leaves the previous
  // snapshot in force. The key rules (P14, below) read the snapshot they
  // carry for their one answer and never apply it.
  SettingsSnapshot settings = 10;
}

// Asks the library which version it was built as.
message VersionRequest {}

// Builds the process's one desktop runtime. Once per process: a second
// Configure is refused with FAIL_INVARIANT and changes nothing.
message ConfigureRequest {
  // Where the engine keeps the user's data. Unset = nothing is learned
  // (Prepare opens no stores).
  optional string data_directory = 1;
  // The directory holding the four dictionary files. Unset = Prepare
  // installs no lexicon.
  optional string dictionaries_directory = 2;
  // The stamp the lexicon is installed under (`CFBundleVersion`).
  uint32 dictionary_stamp = 3;
  // The machine's UI language as a BCP-47 tag, as of Configure.
  string system_locale = 4;
}

// The settings the key path reads — the only names a SettingsSnapshot may
// carry — with the default each one reads as when absent.
message ConfigureReply {
  repeated SettingDescriptor settings = 1;
}

message SettingDescriptor {
  string name = 1;
  SettingKind kind = 2;
  // Unset for a composing chord: absent means the action's own chord, and
  // the stored empty string means the user cleared the row.
  SettingValue default_value = 3;
}

enum SettingKind {
  SETTING_KIND_UNSPECIFIED = 0;
  SETTING_KIND_BOOLEAN = 1;
  SETTING_KIND_TEXT = 2;
}

message SettingValue {
  oneof value {
    bool boolean = 1;
    string text = 2;
  }
}

// The whole snapshot of the whitelisted settings, replacing the last one: a
// name that is not here reads as its default. An unknown or repeated name,
// an entry without a value, or a value of the wrong kind refuses the whole
// request with FAIL_INVARIANT and keeps the previous snapshot.
message SettingsSnapshot {
  repeated SettingEntry entries = 1;
}

message SettingEntry {
  string name = 1;
  SettingValue value = 2;
}

// Brings the engine up: installs the lexicon and opens the user data, once
// per process; a repeat answers the first one's result. Refused with
// FAIL_INVARIANT before Configure.
message PrepareRequest {}

message PrepareReply {
  // Unset when no lexicon is installed.
  LexiconStats lexicon = 1;
}

message LexiconStats {
  uint64 dictionary_record_count = 1;
  uint64 prefix_index_entry_count = 2;
}

message DesktopResponse {
  // The P6 settings reply.
  reserved 4;

  // OK, or why there is no reply.
  taigi.engine.ErrorCode error = 1;
  oneof reply {
    VersionReply version = 2;
    ConfigureReply configure = 3;
    PrepareReply prepare = 5;
    SessionReply session = 6;
    PressReply press = 7;
    ChordReply chord = 8;
    ComposingShortcutsReply composing_shortcuts = 9;
    SymbolPickerReply symbol_picker = 10;
    SwitchInputModeReply switch_input_mode = 11;
    TpsKeyboardRowsReply tps_keyboard_rows = 12;
  }
}

message VersionReply {
  // The `taigi-macos-ffi` crate version (`macos/Cargo.toml`).
  string version = 1;
}

// ---- The composing session (roadmap D3) ----
//
// One session drives the process's one engine at a time; a session is the
// token Swift mints per input controller and never reuses. Every request
// of this section is refused with FAIL_INVARIANT before Configure, and
// answered with a SessionReply. A request whose token does not own the
// engine — released, or superseded by another Activate — is answered
// `ignored` and does nothing; except Activate, which takes the engine.

// The session takes the engine (`activateServer`): a session that already
// holds it keeps its composition, any other one's is dropped. The list is
// dropped either way — the window went down with the handover.
message ActivateRequest {
  uint64 token = 1;
}

// One key. Refused with FAIL_INVARIANT without an event or a panel.
message KeyRequest {
  uint64 token = 1;
  KeyEvent event = 2;
  PanelState panel = 3;
}

// The lifecycle commit (`commitComposition`, deactivation, close): the
// composition as typed, no auto space, no list effect. Refused with
// FAIL_INVARIANT without a panel.
message CommitCompositionRequest {
  uint64 token = 1;
  PanelState panel = 2;
}

// Drops the composition and the list — what Swift sends after a request
// answered FAIL_INTERNAL (roadmap D4). Refused with FAIL_INVARIANT without
// a panel.
message CancelRequest {
  uint64 token = 1;
  PanelState panel = 2;
}

// The session gives the engine up (`deactivateServer`,
// `inputControllerWillClose`). Its token stays valid: the next Activate
// with it takes the engine again.
message ReleaseRequest {
  uint64 token = 1;
}

// The commit the symbol-picker chord runs before the picker opens. With a
// `selected_index`, that cell — none when no list is on screen, which
// commits nothing and keeps the composition; without one, the composition
// as typed with its auto space. Refused with FAIL_INVARIANT without a
// panel.
message CommitForSymbolPickerRequest {
  uint64 token = 1;
  PanelState panel = 2;
}

// A symbol the picker wrote: at the caret as one string, or swapped with
// the auto space a commit left. Refused with FAIL_INVARIANT without a
// symbol or a panel.
message InsertSymbolRequest {
  uint64 token = 1;
  string symbol = 2;
  PanelState panel = 3;
}

// A click on a cap of the on-screen TPS key panel: `glyph` typed through
// the same engine intent a layout key reaches (`TpsKey`), whatever the
// window or the slot keys would make of the physical key (desktop TPS
// roadmap D6). Answered `handled` false, with no effects, outside TPS or
// for a glyph the layout does not type. Refused with FAIL_INVARIANT
// without a glyph or a panel.
message TpsKeyboardPressRequest {
  uint64 token = 1;
  string glyph = 2;
  PanelState panel = 3;
}

// The list on screen again under the settings this request carries, after
// a switch outside the key path changed them: fetched again (`refetch`) or
// the same list presented again. The reply's effects say what became of
// it: none — no list, nothing to do; one CandidatesChanged — repaint the
// window in place, not anchored again; one CandidatesClosed — the list is
// gone. Refused with FAIL_INVARIANT without a panel.
message RepresentRequest {
  uint64 token = 1;
  bool refetch = 2;
  PanelState panel = 3;
}

// The `NSEvent` fields a key is classified from, as AppKit reports them;
// `key_translation.rs` turns them into the core's key event.
message KeyEvent {
  // `keyCode` — Carbon's virtual key code.
  optional uint32 key_code = 1;
  optional string characters = 2;
  optional string characters_ignoring_modifiers = 3;
  // `modifierFlags.rawValue`.
  uint64 modifier_flags = 4;
  // `specialKey?.rawValue`; unset for a key AppKit has no name for.
  optional uint32 special_key = 5;
}

// What only the candidate window and the client know, asked before the
// request is sent.
message PanelState {
  // The window shows a list. When it does not, the session drops any list
  // it still holds before the request reads it.
  bool is_list_on_screen = 1;
  // The highlighted cell, if the window shows one.
  optional uint32 selected_index = 2;
  // Slot → the cell the slot's key addresses on the page shown; a slot not
  // here addresses none.
  map<uint32, uint32> slot_indices = 3;
  // The auto space the last commit left can be swapped now (armed, caret
  // where the space left it, the space still before it).
  bool swap_available = 4;
}

message SessionReply {
  // The token does not own the engine: nothing was done, `handled` and
  // `is_composing` are false and there are no effects.
  bool ignored = 1;
  // Key only: the key was consumed; false hands it to the client.
  bool handled = 2;
  // What Swift does to the client and the window, in order.
  repeated Effect effects = 3;
  // The session owns the engine and a composition is running.
  bool is_composing = 4;
}

message Effect {
  oneof effect {
    SetMarkedText set_marked_text = 1;
    ClearMarkedText clear_marked_text = 2;
    InsertText insert_text = 3;
    SwapPrecedingSpace swap_preceding_space = 4;
    ArmSwap arm_swap = 5;
    CandidatesChanged candidates_changed = 6;
    CandidatesClosed candidates_closed = 7;
    Navigate navigate = 8;
    TpsKeyboardKeyTyped tps_keyboard_key_typed = 9;
  }
}

// The composition, underlined, with the caret at `caret_utf16`.
message SetMarkedText {
  string text = 1;
  uint32 caret_utf16 = 2;
}

// The composition ended without writing anything.
message ClearMarkedText {}

// Written at the insertion point, over the marked region if there is one.
message InsertText {
  string text = 1;
}

// The armed auto space replaced by `replacement`.
message SwapPrecedingSpace {
  string replacement = 1;
}

// Arm the auto-space swap at the caret the writes before it left.
message ArmSwap {}

// A list to show, anchored at the caret.
message CandidatesChanged {
  repeated CandidateCell cells = 1;
  // The first cell is the literal romanization, which takes no slot key.
  bool leads_with_literal_roman = 2;
  // The window sits under the character of the marked text that ends at this
  // UTF-16 offset — the caret walk starts there and goes left. The end of the
  // marked text, except under TPS, where it is the caret: the list there is
  // usually the word before it.
  uint32 anchor_end_utf16 = 3;
}

message CandidateCell {
  // The script the cell leads with.
  string text = 1;
  // The other script, smaller beside it; unset when there is none.
  optional string annotation = 2;
}

message CandidatesClosed {}

// Move the window's selection; the window reads the direction for its
// layout.
message Navigate {
  CandidateNavigation direction = 1;
}

enum CandidateNavigation {
  CANDIDATE_NAVIGATION_UNSPECIFIED = 0;
  CANDIDATE_NAVIGATION_LEFT = 1;
  CANDIDATE_NAVIGATION_RIGHT = 2;
  CANDIDATE_NAVIGATION_UP = 3;
  CANDIDATE_NAVIGATION_DOWN = 4;
  CANDIDATE_NAVIGATION_PAGE_UP = 5;
  CANDIDATE_NAVIGATION_PAGE_DOWN = 6;
  CANDIDATE_NAVIGATION_NEXT_CANDIDATE = 7;
  CANDIDATE_NAVIGATION_PREVIOUS_CANDIDATE = 8;
}

// The engine took a TPS key: the on-screen key panel flashes the cap that
// types it (desktop TPS roadmap D6). Both counted from 0, as
// `TpsKeyboardRowsReply` lists the rows and their caps.
message TpsKeyboardKeyTyped {
  uint32 row = 1;
  uint32 cap = 2;
}

// ---- The key rules of the Shortcuts pane and the symbol picker (P14) ----
//
// desktop-core's chord gate, recorder decision, resolved bindings, fixed-row
// labels and picker reading, under the Mac's grammar
// (`DesktopPlatform::MacOS`). Pure: no token, no session, answered before
// Configure too, and nothing is kept — the key path's settings stay what
// the last session request carried.

// One key press in a shortcut-recording field (`ShortcutKeyRecorder`).
// The field's own keys — a repeat, a click — and the global tier's
// refusals stay Swift's. A press with no event is refused.
message PressRequest {
  KeyEvent event = 1;
}

message PressReply {
  oneof outcome {
    // Bound; recording ends.
    Chord recorded = 1;
    // Turned down; recording goes on, the reason in place of the prompt.
    ChordRejection refused = 2;
    // What the field itself does with the key.
    RecorderAction action = 3;
  }
}

enum RecorderAction {
  RECORDER_ACTION_UNSPECIFIED = 0;
  // A bare Escape key (`kVK_Escape`, whatever it types): the field gives up
  // focus, the row keeps what it had.
  RECORDER_ACTION_BLUR = 1;
  // A bare Backspace, Delete or forward Delete: the field blanks, nothing
  // is recorded (the row's own clear button clears it).
  RECORDER_ACTION_BLANK = 2;
}

// The chord a key and modifiers make, through the gate a recorded chord
// passes (`ComposingKeyChord::make`) — the Carbon bridge's question
// (`ShortcutConflicts.translation(of:)`). Reads no settings.
message ChordRequest {
  // What the key types with no modifier held; unset or empty = no key.
  optional string key = 1;
  // `NSEvent.ModifierFlags` raw value; only ⌘ ⌃ ⌥ ⇧ are read.
  uint64 modifier_flags = 2;
}

message ChordReply {
  oneof answer {
    Chord chord = 1;
    ChordRejection rejection = 2;
  }
}

// A composing chord as desktop-core hands it out.
message Chord {
  // The stored form, `<modifiers>|<scalars>` (`raw_value`): what Swift
  // writes to `UserDefaults`, and the chord's identity — two chords are one
  // exactly when their raws are.
  string raw = 1;
  // How it reads on screen (`display`): `⇧↩`, `⌃]`, `Space`.
  string display = 2;
}

// Why a key could not be a chord (`ChordRejection`). The last three are
// the global tier's, which Swift decides; these requests never answer them.
enum ChordRejection {
  CHORD_REJECTION_UNSPECIFIED = 0;
  CHORD_REJECTION_TYPES_ROMANIZATION = 1;
  CHORD_REJECTION_RESERVED_KEY = 2;
  CHORD_REJECTION_NO_KEY = 3;
  CHORD_REJECTION_TAKEN_BY_SYSTEM = 4;
  CHORD_REJECTION_NOT_A_GLOBAL_KEY = 5;
  CHORD_REJECTION_BELONGS_TO_HOST = 6;
}

// The Shortcuts pane's composing rows, resolved from the settings snapshot
// this request must carry (`ComposingKeyBindings::from_document`), and its
// fixed rows. Refused without a snapshot.
message ComposingShortcutsRequest {}

message ComposingShortcutsReply {
  // Every composing action, in the roster's order (`ComposingAction::ALL`):
  // the order a block of the pane draws them in and conflicts list them in.
  repeated ComposingShortcut actions = 1;
  // The fixed rows, as the pane prints them (`shortcut_labels`): the live
  // slot keys bare and behind ⇧, the navigation keys, the caret chords.
  string slot_keys = 2;
  string shifted_slot_keys = 3;
  string navigation_keys = 4;
  string caret_chords = 5;
  // The width-flip chords row, removed 2026-10-07.
  reserved 6;
  reserved "width_flip_chords";
  // The cancel key row, removed 2026-10-16.
  reserved 7;
  reserved "cancel_key";
}

message ComposingShortcut {
  // `ComposingAction::raw`: `nextCandidate`.
  string name = 1;
  // The row's one chord, before each row had two fields (2026-10-15).
  reserved 2, 5, 6;
  reserved "settings_key", "chord", "default_chord";
  // Its label, as an i18n key (`i18n_desktop_actionNextCandidate`).
  string label_key = 3;
  // Its block on the pane (`ComposingAction::GROUPS`): 0 through the
  // candidates, 1 out of the composition.
  uint32 group = 4;
  // Its two fields (`ChordField::ALL`), first then second; either fires
  // the action.
  repeated ComposingShortcutField fields = 7;
}

message ComposingShortcutField {
  // Where its chord is stored: `composingShortcut.<name>`, or
  // `composingShortcut.<name>.second` for the second field.
  string settings_key = 1;
  // The resolved chord; unset = the field is empty.
  Chord chord = 2;
  // What a fresh install has on it; unset on the second field, which ships
  // empty.
  Chord shipped_chord = 3;
  // What the store holds, parsed; unset when absent, cleared or unparsable.
  // A chord stored here that the resolver hid behind another field is still
  // a holder a recording must clear
  // (`ShortcutConflicts::composing_fields_holding`).
  Chord stored_chord = 4;
}

// The core's one input-mode writer (`SettingsDocument::switch_input_mode`,
// desktop TPS roadmap D5) for the Swift settings, which keep the mode in
// `UserDefaults`: where a pick or a switch chord moves the stored mode. Pure,
// like the key rules above, and reads no snapshot — the two stored values it
// needs travel in it. Refused without a request, or with a `pick` that names
// no mode.
message SwitchInputModeRequest {
  // The stored `inputMode` and `lastRomanizationMode`; "" when absent. A
  // value the core does not know reads as its default, as on every reader.
  string input_mode = 1;
  string last_romanization_mode = 2;
  oneof request {
    // The Input Script picker's choice: `tl`, `poj` or `tps`.
    string pick = 3;
    bool toggle_romanization = 4;
    bool toggle_tps = 5;
  }
}

message SwitchInputModeReply {
  // The mode now in force, to store as `inputMode`.
  string input_mode = 1;
  // Set when the switch stored a new romanization to come back to — one left
  // for TPS — to store as `lastRomanizationMode`.
  optional string last_romanization_mode = 2;
}

// The on-screen TPS key panel's rows (desktop TPS roadmap D6), built in the
// core from the TPS layout table so the Swift panel cannot drift from what
// the keys type. Pure, no snapshot; never refused.
message TpsKeyboardRowsRequest {}

message TpsKeyboardRowsReply {
  // Top to bottom.
  repeated TpsKeyboardRow rows = 1;
}

message TpsKeyboardRow {
  // How far the row starts from the left edge, in key widths (the stagger).
  float indent = 1;
  // Left to right.
  repeated TpsKeyCap caps = 2;
}

message TpsKeyCap {
  // The key as its cap is printed (`Q`, `1`, `;`).
  string label = 1;
  // What the key types under TPS.
  string glyph = 2;
  // What it types with Shift; unset where that layer is not a TPS key.
  optional string shift_glyph = 3;
}

// One key while the symbol picker is up, read under the settings snapshot
// this request must carry (`SymbolPickerIntent::intent`). Refused without
// an event or a snapshot.
message SymbolPickerKeyRequest {
  KeyEvent event = 1;
}

message SymbolPickerReply {
  oneof intent {
    SymbolPickerAction action = 1;
    // Move the selection the way the window reads the direction.
    CandidateNavigation navigate = 2;
    // Pick the cell the slot-th selection key addresses on the visible page.
    uint32 pick_slot = 3;
  }
}

enum SymbolPickerAction {
  SYMBOL_PICKER_ACTION_UNSPECIFIED = 0;
  // Take the picker down and swallow the key.
  SYMBOL_PICKER_ACTION_CLOSE = 1;
  // Pick the highlighted cell.
  SYMBOL_PICKER_ACTION_CONFIRM = 2;
  // Take the picker down and let the key go on.
  SYMBOL_PICKER_ACTION_CLOSE_AND_PASS_THROUGH = 3;
}
