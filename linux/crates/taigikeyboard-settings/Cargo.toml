[package]
name = "taigikeyboard-settings"
description = "The settings window of the Linux input method: GTK 4 + libadwaita over the shared desktop settings model and stores"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "taigikeyboard_settings"
path = "src/lib.rs"

[[bin]]
name = "taigikeyboard-settings"
path = "src/main.rs"

[dependencies]
# The window's pages reach the user-data stores through the engine's ops
# (`taigi_desktop_core::engine::user_data`), with the stores compiled in.
taigi-desktop-core = { workspace = true, features = ["user-data"] }
taigi-desktop-storage.workspace = true
taigi-linux-platform.workspace = true
gtk.workspace = true
adw.workspace = true
gio.workspace = true
log.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

# GTK on macOS must be initialised on the main thread, which the default
# test harness never runs a test on: the pane-mount test brings its own
# `main`.
[[test]]
name = "panes"
harness = false
