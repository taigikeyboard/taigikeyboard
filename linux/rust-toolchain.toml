[toolchain]
# The root rust-toolchain.toml's version (`tools/rust-toolchain.sh check`).
channel = "1.100.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
# The shipping targets (x86_64 and aarch64); `make linux-check` on the macOS
# host cross-builds the engine + platform crates for each through
# `cargo zigbuild`. The settings crate (GTK) is checked natively on the host instead
# (docs/architecture/linux-roadmap.md L12).
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
