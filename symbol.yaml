page1:
  halfwidth:
    - [ "1","2","3","4","5","6","7","8","9","0" ]
    - ["-", "/", ":", ";", "(", ")", "$", "&", "@", "\""]
    - ["#+=", ".", ",", "?", "!", "backspace"]
    - [ "ABC","😀","space","translate","↵",]
  fullwidth:
    - ["１","２","３","４","５","６","７","８","９","０"]
    - ["-", "／", "：", "；", "（", "）", "＄", "＠", "「", "」"]
    - ["#+=", "。","，","、","？","！",".", "backspace"]
    - ["ABC","😀","space","translate","↵"]
page2:
  halfwidth:
    - ["[", "]", "{", "}", "#", "%", "^", "*", "+", "="]
    - ["_", "\"", "|", "~", "<", ">", "€", "£", "¥", "•"]
    - ["123", ".", ",", "?", "!", "’", "backspace"]
    - ["ABC","😀","space","translate","↵"]
  fullwidth:
    - ["[", "]", "{", "}", "#", "%", "^", "*", "+", "="]
    - ["_", "\"", "|", "~", "<", ">", "€", "£", "¥", "•"]
    - ["123", ".", ",", "?", "!", "’", "backspace"]
    - ["ABC","😀","space","translate","↵"]
