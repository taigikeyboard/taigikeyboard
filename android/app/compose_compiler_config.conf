// hot-path Composable that takes an unstable param is `CandidateCell(word:
// TaigiWord)`, and declaring `TaigiWord` stable lets strong skipping use
// `Object.equals()` instead of instance equality (`===`) for that param.
// See `docs/perf/android-compose-stability.md` § "Step 2 outcome" for the
// per-class rationale.
//
// CONTRACT — `TaigiWord` is declared stable on the strength of its current
// shape: a `data class` with `val` fields plus an `additionalInfo:
// Map<String, String>` whose producers (`TaigiAutocompleteService`,
// `NextWordHandler`, `CandidateUpdateCoordinator`, `LexiconBridge`) all
// build the map via `mapOf(…)` or default `emptyMap()` and never mutate it
// after construction. If a future contributor adds a `var` field, swaps in
// a mutable collection, or introduces a non-stable property, this entry
// MUST be revisited — otherwise Compose will skip recompositions that
// should have fired. See the same contract comment on `TaigiWord.kt`.

