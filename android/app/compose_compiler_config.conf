// Compose compiler stability configuration.
//
// Declares types that the Compose compiler must treat as @Stable / @Immutable
// even when their structural form (e.g. holding a Map, List, or third-party
// type) would otherwise be inferred as unstable. One fully-qualified name per
// line. `//` comments and blank lines are ignored. `*` matches a single
// package segment; `**` matches any depth. See:
//
//   - https://developer.android.com/develop/ui/compose/performance/stability/fix
//   - https://kotlinlang.org/api/kotlin-gradle-plugin/compose-compiler-gradle-plugin/
//
// Step 2 outcome: only `TaigiWord` is declared stable here. The B10 step 1
// release-with-reports build showed `CandidateStripState`, `CandidateMode`
// (sealed parent), `CandidateMode.Empty`, and `CandidateDisplayParams` were
// already inferred stable by the Compose compiler (strong-skipping on,
