name: Sign, notarize and attach the macOS package
description: >-
  Re-signs the `macos-bundle` artifact with Developer ID, notarizes and staples
  the package, and attaches it to the desktop draft. Used by the `release` job
  of macos-build.yml (hotfix path) and the `sign-and-beta` job of
  desktop-train.yml. The caller checks out the staged commit, has checked that
  it is on main, and runs this on a machine that compiled nothing.

# Composite actions cannot read `secrets`, so the caller passes them in. Each
# reaches only the step that needs it, through `env`, never into a script.
inputs:
  source-sha:
    description: The staged commit (the draft's target)
    required: true
  github-token:
    description: contents:write token — the draft read and the upload
    required: true
  application-p12:
    description: MACOS_DEVELOPER_ID_APPLICATION_P12 (base64)
    required: true
  installer-p12:
    description: MACOS_DEVELOPER_ID_INSTALLER_P12 (base64)
    required: true
  p12-password:
    description: MACOS_P12_PASSWORD
    required: true
  api-key-p8:
    description: APPLE_API_KEY_P8 (PEM text)
    required: true
  api-key-id:
    description: APPLE_API_KEY_ID
    required: true
  api-issuer-id:
    description: APPLE_API_ISSUER_ID
    required: true

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: macos-bundle
        path: ${{ runner.temp }}

    - name: Unpack the bundle
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p macos/.build/bundle
        tar -C macos/.build/bundle -xf "$RUNNER_TEMP/bundle.tar"
        rm -f "$RUNNER_TEMP/bundle.tar"

    # Before any credential: the token publish-release.sh will use, and the
    # draft it will join (`join_desktop_draft` joins again — never moves — at
    # attach time).
    - name: Check the draft
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        SOURCE_SHA: ${{ inputs.source-sha }}
      run: |
        set -euo pipefail
        gh auth status
        source macos/scripts/lib/bundle-identity.sh
        source tools/release/lib/desktop-release.sh
        DESKTOP_SOURCE_COMMIT="$SOURCE_SHA"
        join_desktop_draft

    # A keychain of its own, holding only the two Developer ID identities and
    # Apple's intermediates, first in the search list so `security
    # find-identity -v` (release-app.sh) sees exactly one of each. Keys are
    # imported non-exportable (-x); the partition list lets codesign /
    # productbuild use them without a prompt. GitHub docs: "Installing an
    # Apple certificate on macOS runners".
    - name: Import the Developer ID certificates
      shell: bash
      env:
        APPLICATION_P12: ${{ inputs.application-p12 }}
        INSTALLER_P12: ${{ inputs.installer-p12 }}
        P12_PASSWORD: ${{ inputs.p12-password }}
      run: |
        set -euo pipefail
        umask 077
        keychain="$RUNNER_TEMP/release.keychain-db"
        keychain_password="$(openssl rand -base64 32)"
        echo "::add-mask::$keychain_password"
        security create-keychain -p "$keychain_password" "$keychain"
        security set-keychain-settings -lut 21600 "$keychain"
        security unlock-keychain -p "$keychain_password" "$keychain"
        for name in APPLICATION INSTALLER; do
          p12="$RUNNER_TEMP/$name.p12"
          variable="${name}_P12"
          printf '%s' "${!variable}" | base64 --decode > "$p12"
          security import "$p12" -k "$keychain" -P "$P12_PASSWORD" -f pkcs12 -x \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/pkgbuild
          rm -f "$p12"
        done
        # Both Developer ID intermediates: which one issued the certificates
        # depends on when they were created (G2 from 2021-09-17).
        for ca in DeveloperIDCA DeveloperIDG2CA; do
          curl -sSfL --retry 5 -o "$RUNNER_TEMP/$ca.cer" "https://www.apple.com/certificateauthority/$ca.cer"
          security import "$RUNNER_TEMP/$ca.cer" -k "$keychain"
        done
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
        # shellcheck disable=SC2046
        security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
        security find-identity -v | grep "Developer ID"

    # The .p8 exactly as App Store Connect downloads it (PEM).
    - name: Write the App Store Connect API key
      shell: bash
      env:
        API_KEY_P8: ${{ inputs.api-key-p8 }}
        API_KEY_ID: ${{ inputs.api-key-id }}
      run: |
        set -euo pipefail
        key="$RUNNER_TEMP/AuthKey_$API_KEY_ID.p8"
        (umask 077; printf '%s\n' "$API_KEY_P8" > "$key")
        grep -q 'BEGIN PRIVATE KEY' "$key" || {
            echo "::error::APPLE_API_KEY_P8 is not the .p8 file's PEM text — set it with: gh secret set APPLE_API_KEY_P8 --env release < AuthKey_<id>.p8"
            exit 1
        }
        echo "NOTARY_API_KEY=$key" >> "$GITHUB_ENV"

    # Re-sign with Developer ID, verify, package, notarize, staple. No GitHub
    # token here.
    - name: release-app.sh
      shell: bash
      env:
        NOTARY_API_KEY_ID: ${{ inputs.api-key-id }}
        NOTARY_API_ISSUER: ${{ inputs.api-issuer-id }}
      run: bash macos/scripts/release-app.sh

    # Credentials go before the token arrives.
    - name: Remove the keychain and the API key
      if: always()
      shell: bash
      run: |
        security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2> /dev/null || true
        rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP"/*.p12

    # Stapled, Gatekeeper, declared identity and version, then join the draft
    # (refused if a newer staging run re-created it meanwhile), attach and read
    # back (desktop-release.md § What staging checks).
    - name: publish-release.sh
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: bash macos/scripts/publish-release.sh

    # A rejection's notary log, for a person to read.
    - name: Keep the notarization log
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: macos-notarization
        path: macos/.build/distribution/staging/notarization-*
        if-no-files-found: ignore
        retention-days: 14
