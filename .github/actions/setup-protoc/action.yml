name: Install protoc
description: >-
  Installs the protoc that mise.toml pins, verified against the digest below,
  and puts it on PATH — for engine/protos/build.rs (prost-build) and the Java
  binding check; the runner images ship none. web.yml and chromeos-build.yml
  take the same pin through mise-action instead.

# The version is mise.toml's `protoc` (the libprotoc matching the pinned
# protobuf-javalite runtime). Moving it means moving the digests here in the
# same change: protobuf publishes no checksum files, so mise's aqua backend
# verifies nothing, and these digests are what pins the bytes. Take them from
# the release's own asset digests:
#   gh api repos/protocolbuffers/protobuf/releases/tags/v<version> \
#     --jq '.assets[] | "\(.name) \(.digest)"'
runs:
  using: composite
  steps:
    - name: Install protoc (Linux / macOS)
      if: runner.os != 'Windows'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        version="$(sed -n 's/^protoc = "\(.*\)"$/\1/p' mise.toml)"
        case "$version/$RUNNER_OS/$RUNNER_ARCH" in
          36.2/Linux/X64)   asset=linux-x86_64; sha=121f6c7afe1d4d0e3ea6aab9432038599250134cbf4474cb1167d2c7decd4278 ;;
          36.2/macOS/ARM64) asset=osx-aarch_64; sha=9cd98a532c5c5e0c4161314de0225de27e4c8a323917b6ea7b1b714d3ae23466 ;;
          *) echo "::error::no protoc digest for '$version' on $RUNNER_OS/$RUNNER_ARCH — add it to .github/actions/setup-protoc"; exit 1 ;;
        esac
        curl -sSfL --retry 5 --retry-all-errors --retry-delay 10 -H "Authorization: Bearer $GH_TOKEN" \
          -o "$RUNNER_TEMP/protoc.zip" \
          "https://github.com/protocolbuffers/protobuf/releases/download/v$version/protoc-$version-$asset.zip"
        # sha256sum on Linux (the distribution containers carry no shasum), shasum on macOS.
        if command -v sha256sum > /dev/null; then check=(sha256sum -c -); else check=(shasum -a 256 -c -); fi
        echo "$sha  $RUNNER_TEMP/protoc.zip" | "${check[@]}"
        unzip -q -o "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
        echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/protoc/bin/protoc" --version

    - name: Install protoc (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $version = (Select-String -Path mise.toml -Pattern '^protoc = "(.*)"$').Matches[0].Groups[1].Value
        $sha = @{ '36.2' = 'f0c128dc0d8492eceece83bb459a4c0e316764b929ffbf1aa416357fd644edd3' }[$version]
        if (-not $sha) { throw "no protoc digest for '$version' on Windows — add it to .github/actions/setup-protoc" }
        $zip = "$env:RUNNER_TEMP\protoc.zip"
        $dir = "$env:RUNNER_TEMP\protoc"
        Invoke-WebRequest -UseBasicParsing -MaximumRetryCount 5 -RetryIntervalSec 10 -OutFile $zip -Uri `
          "https://github.com/protocolbuffers/protobuf/releases/download/v$version/protoc-$version-win64.zip"
        $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLower()
        if ($actual -ne $sha) { throw "protoc digest $actual, expected $sha" }
        Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
        "$dir\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        & "$dir\bin\protoc.exe" --version
