name: Security

# cargo audit + cargo deny over the engine workspace. Neither tool builds
# anything (both read Cargo.lock / `cargo metadata`), so the job needs no
# protoc, no target cache, and no toolchain install — the runner image's
# stable cargo is enough. Tools come as prebuilt binaries: `cargo install`
# used to compile both from source on every run, 6–13 min of an 8.6 min
# average (measured 2026-09-06, 82 of the repo's 102 Actions minutes in the
# trailing 30 days).
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'engine/Cargo.lock'
      - 'engine/**/Cargo.toml'
      - 'engine/deny.toml'
      - '.github/workflows/security.yml'

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: cargo audit + cargo deny
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Pinned by commit, not by tag: a moved tag would silently change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: engine

      - name: Install cargo-audit + cargo-deny (prebuilt)
        uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: cargo-audit,cargo-deny

      - name: cargo audit
        working-directory: engine
        run: cargo audit

      - name: cargo deny check
        working-directory: engine
        run: cargo deny check
