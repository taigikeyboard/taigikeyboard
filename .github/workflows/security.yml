name: Security

# cargo audit over all five Cargo workspaces, cargo deny over the engine and
# macOS. Neither tool builds anything (both read Cargo.lock / `cargo
# metadata`), so the job needs no protoc, no target cache, and no toolchain
# install — the runner image's stable cargo is enough. Tools come as prebuilt
# binaries: `cargo install` used to compile both from source on every run,
# 6–13 min of an 8.6 min average (measured 2026-09-06). Prebuilt: 37 s.
#
# `cargo deny` runs on the engine and macOS — `engine/deny.toml` carries the
# licence allowlist and the wildcard-path exemption; macOS borrows it, as its
# archive is the engine plus one shell crate. The Windows, desktop and
# Linux workspaces have no deny.toml, so they get the advisory check alone;
# their engine crates are path dependencies and are already covered by the
# engine's run, but each lockfile pins its own third-party versions.
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'engine/Cargo.lock'
      - 'engine/**/Cargo.toml'
      - 'engine/deny.toml'
      - 'windows/Cargo.lock'
      - 'windows/**/Cargo.toml'
      - 'desktop/Cargo.lock'
      - 'desktop/**/Cargo.toml'
      - 'linux/Cargo.lock'
      - 'linux/**/Cargo.toml'
      - 'macos/Cargo.lock'
      - 'macos/**/Cargo.toml'
      - '.github/workflows/security.yml'
  push:
    branches: [main]
    paths:
      - 'engine/Cargo.lock'
      - 'engine/**/Cargo.toml'
      - 'engine/deny.toml'
      - 'windows/Cargo.lock'
      - 'windows/**/Cargo.toml'
      - 'desktop/Cargo.lock'
      - 'desktop/**/Cargo.toml'
      - 'linux/Cargo.lock'
      - 'linux/**/Cargo.toml'
      - 'macos/Cargo.lock'
      - 'macos/**/Cargo.toml'
      - '.github/workflows/security.yml'

permissions:
  contents: read

concurrency:
  group: security-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: cargo audit + cargo deny
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Both workspaces carry a rust-toolchain.toml listing the Apple and
      # Android targets; without this, the first `cargo` call would make
      # rustup download all of them for a job that compiles nothing.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            engine
            windows
            desktop
            linux
            macos

      - name: Install cargo-audit + cargo-deny (prebuilt)
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-audit,cargo-deny

      - name: cargo audit (engine)
        working-directory: engine
        run: cargo audit

      - name: cargo audit (windows)
        working-directory: windows
        run: cargo audit

      - name: cargo audit (desktop)
        working-directory: desktop
        run: cargo audit

      - name: cargo audit (linux)
        working-directory: linux
        run: cargo audit

      - name: cargo audit (macos)
        working-directory: macos
        run: cargo audit

      - name: cargo deny check (engine)
        working-directory: engine
        run: cargo deny check

      - name: cargo deny check (macos)
        working-directory: macos
        run: cargo deny --config ../engine/deny.toml check
