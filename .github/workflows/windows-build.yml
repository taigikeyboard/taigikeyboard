name: Windows build

# Builds the Windows installer the way a release does, on a GitHub-hosted runner.
#
# The point is provenance, not convenience. SignPath Foundation signs only "a
# valid, automated build resulting from the source code at the noted source code
# repository", and for open-source projects it requires that every job leading up
# to the signing request ran on a GitHub-hosted agent, with the artifact handed to
# its action from inside the workflow that produced it. A build cut by hand with
# `make windows-release` can never satisfy that, so releases are built here. The
# signing step is a later, small addition once a certificate exists.
#
# It does NOT publish. A run dispatched on `main` attaches the installer to the draft, a
# person publishes that draft, and `tools/release/announce-release.sh` announces it.
on:
  # How a release stages the Windows installer: `tools/release/stage-desktop.sh`
  # dispatches this after staging the macOS package, and the run attaches its
  # installer to the same draft. The maintainer's own box is not in the release
  # path — it is a development machine, with a dev install registered in its
  # build tree and an App Control policy that blocks freshly built binaries,
  # and fighting both over ssh is what this replaces.
  workflow_dispatch:
  # Release-only. A desktop release is staged as a draft and published by hand;
  # publishing is what creates the `desktop-<version>` tag, and this fires on
  # that publish rather than on the tag push — a release published from a draft
  # whose tag was pushed earlier creates no new tag, and a tag-push trigger
  # would miss it. Everyday pushes to `main` and pull requests do not build
  # Windows: `make windows-check` stays the host-side gate the maintainer runs
  # by hand.
  #
  # The run rebuilds the installer on a GitHub-hosted agent for provenance and
  # publishes nothing; the installer users download is the dispatched run's. When
  # SignPath signing lands it goes into that dispatched run, before the attach
  # step (docs/architecture/windows-release.md § Building on a GitHub-hosted
  # runner).
  release:
    types: [published]

permissions:
  # Read-only by default: the build and smoke jobs run whatever ref was
  # dispatched. Only the `attach` job, which runs for `main` alone, writes.
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every external input is pinned by version AND digest: what gets signed later
  # is only as trustworthy as what built it. `windows/scripts/release-app.sh`
  # requires Inno Setup 6.5 or newer, so this stays on the 6.x line rather than
  # following Inno Setup 7 — the installer script is written against 6.x, and the
  # release script probes the "Inno Setup 6" directory.
  INNO_SETUP_VERSION: 6.7.3
  INNO_SETUP_SHA256: 9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732
  # engine/protos/build.rs runs prost-build, which shells out to protoc. It is not
  # on the runner image, and without it the very first engine crate fails to build.
  PROTOC_VERSION: 36.1
  PROTOC_SHA256: 390e515cb456e6a978553bdb57baf087b054885077fd6da7f7ff0160279c07d6
  # The packages windows-reactor-setup stages beside the settings exe. Versions
  # equal RUNTIME_VER / WEBVIEW2_VER at the windows-rs rev windows/Cargo.toml pins;
  # move them together with that pin.
  WINDOWS_APP_RUNTIME_VERSION: 2.4.0
  WINDOWS_APP_RUNTIME_SHA256: 93f48b096416ab7b908ea30690bba47de8264cd2f22dd7b0ad97187a86d00120
  WEBVIEW2_VERSION: 1.0.4078.44
  WEBVIEW2_SHA256: dc4d1d9168df26b830398303e50210b6e1729f6ce5a7ac69d2c766852f489962

jobs:
  build:
    name: installer (unsigned)
    # Named rather than `windows-latest`: the label moves between Windows versions
    # on GitHub's schedule, and a release build should not change underneath a
    # release because a label was repointed.
    runs-on: windows-2025
    # Only this repository builds, and only for the desktop train. A Windows
    # runner is the most expensive gate this project has: a fork has nothing to
    # sign with, and a mobile release — should one ever be published here — has
    # no Windows installer in it. Any ref may be dispatched, so a branch that
    # changes the release path can be built before it merges; only a `main`
    # run attaches anything (the `attach` job), and this job holds a read-only
    # token with no credential left in the checkout.
    if: >-
      github.repository == 'taigikeyboard/taigikeyboard' &&
      (github.event_name != 'release' ||
       startsWith(github.event.release.tag_name, 'desktop-'))
    timeout-minutes: 60
    steps:
      # core.autocrlf must be off BEFORE the checkout. Everything here is
      # committed with LF, and `windows/scripts/lib/identity.sh` parses
      # `windows/Cargo.toml` and `build-support/resource.rs` with awk patterns
      # anchored at end of line — a CR would make the version and the string-table
      # id unreadable. It also keeps the tree clean for the release script's
      # preflight.
      - name: Check out with LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rc.exe (Windows SDK) and dumpbin (MSVC) are what the release script uses
      # to embed VERSIONINFO and to prove the binaries import no C runtime and
      # export the four regsvr32 entry points. Neither is on PATH until the
      # Visual Studio developer environment is applied.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: amd64

      # `shell: bash` on Windows is Git Bash, which puts its own /usr/bin ahead of
      # the MSVC tools — and GNU coreutils ships a `link.exe` (the hardlink
      # utility). rustc invoked THAT, and every build script failed with
      # "linking with `link.exe` failed: exit code: 1" naming
      # C:\Program Files\Git\usr\bin\link.exe. Naming the linker outright is
      # narrower than reordering PATH and says which one is meant.
      - name: Point cargo at the MSVC linker, not Git Bash's
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $linker = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64\link.exe'
          if (-not (Test-Path -LiteralPath $linker)) { throw "no MSVC link.exe at $linker" }
          Write-Host "linker: $linker"
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # The 32-bit text service (release-app.sh builds it second): the
          # x64-hosted linker that targets x86.
          $linker32 = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x86\link.exe'
          if (-not (Test-Path -LiteralPath $linker32)) { throw "no MSVC x86 link.exe at $linker32" }
          Write-Host "linker (x86): $linker32"
          "CARGO_TARGET_I686_PC_WINDOWS_MSVC_LINKER=$linker32" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # The Arm64 text service and settings exe (built third): the
          # x64-hosted linker that targets Arm64. The bundled SQLite's cl.exe
          # for Arm64 is found by the cc crate itself, as the x86 one is.
          $linkerArm64 = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\arm64\link.exe'
          if (-not (Test-Path -LiteralPath $linkerArm64)) { throw "no MSVC Arm64 link.exe at $linkerArm64" }
          Write-Host "linker (Arm64): $linkerArm64"
          "CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER=$linkerArm64" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install protoc ${{ env.PROTOC_VERSION }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = "$env:RUNNER_TEMP\protoc.zip"
          $dir = "$env:RUNNER_TEMP\protoc"
          Invoke-WebRequest -UseBasicParsing -MaximumRetryCount 5 -RetryIntervalSec 10 -Uri `
            "https://github.com/protocolbuffers/protobuf/releases/download/v$env:PROTOC_VERSION/protoc-$env:PROTOC_VERSION-win64.zip" `
            -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLower()
          if ($actual -ne $env:PROTOC_SHA256) { throw "protoc digest $actual, expected $env:PROTOC_SHA256" }
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          "$dir\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # release-app.sh resolves ISCC from PATH first and only then from $ISCC, so
      # the pinned installation has to be on PATH rather than named by variable.
      - name: Install Inno Setup ${{ env.INNO_SETUP_VERSION }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "$env:RUNNER_TEMP\innosetup.exe"
          $tag = "is-" + $env:INNO_SETUP_VERSION.Replace('.', '_')
          Invoke-WebRequest -UseBasicParsing -MaximumRetryCount 5 -RetryIntervalSec 10 -Uri `
            "https://github.com/jrsoftware/issrc/releases/download/$tag/innosetup-$env:INNO_SETUP_VERSION.exe" `
            -OutFile $exe
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLower()
          if ($actual -ne $env:INNO_SETUP_SHA256) { throw "Inno Setup digest $actual, expected $env:INNO_SETUP_SHA256" }
          $process = Start-Process -FilePath $exe -Wait -PassThru `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-'
          if ($process.ExitCode -ne 0) { throw "Inno Setup installer exited $($process.ExitCode)" }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) { throw "no ISCC.exe at $iscc" }
          Split-Path -Parent $iscc | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # The 32-bit and Arm64 text services' targets, added explicitly rather
      # than trusted to rustup's handling of `windows/rust-toolchain.toml` on a
      # runner whose image already carries a stable toolchain without them. Run
      # from windows/ so they land on the toolchain that file pins.
      - name: Add the i686 and aarch64 targets
        shell: bash
        working-directory: windows
        run: rustup target add i686-pc-windows-msvc aarch64-pc-windows-msvc

      # What actually built this, recorded in the log. A provenance claim that
      # cannot name its compiler is worth less than one that can.
      - name: Record the toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup show active-toolchain
          cargo --version
          rustc --version
          protoc --version
          iscc /? 2>&1 | head -1 || true
          command -v rc.exe rc dumpbin || true
          echo "linker: $CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER"
          echo "linker (x86): $CARGO_TARGET_I686_PC_WINDOWS_MSVC_LINKER"
          echo "linker (Arm64): $CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER"

      # windows-reactor-setup's build script fetches these from NuGet with no
      # digest check, and skips the fetch when the package is already in its cache
      # directory. Seeding that directory is what puts the check in front of it.
      - name: Seed the Windows App Runtime packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cache = "$env:LOCALAPPDATA\windows-reactor-setup\temp"
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          $packages = @(
            @('Microsoft.WindowsAppSDK.Runtime', $env:WINDOWS_APP_RUNTIME_VERSION, $env:WINDOWS_APP_RUNTIME_SHA256),
            @('Microsoft.Web.WebView2', $env:WEBVIEW2_VERSION, $env:WEBVIEW2_SHA256)
          )
          foreach ($package in $packages) {
            $name, $version, $expected = $package
            $file = "$cache\$name.$version.nupkg"
            Invoke-WebRequest -UseBasicParsing -MaximumRetryCount 5 -RetryIntervalSec 10 -OutFile $file -Uri `
              "https://www.nuget.org/api/v2/package/$name/$version"
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLower()
            if ($actual -ne $expected) { throw "$name digest $actual, expected $expected" }
          }

      # The same entry point a release uses. --skip-sign is the current release
      # channel (docs/architecture/windows-release.md § Signing status); omitting
      # --publish is what makes this a build rather than a release.
      - name: Build the installer
        shell: bash
        run: bash windows/scripts/release-app.sh --skip-sign

      # A windows-rs bump that moved a package version would miss the seeded file
      # and fetch the new one unchecked, leaving a second .nupkg in the cache.
      - name: Verify the build used only the seeded packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $found = (Get-ChildItem -Path "$env:LOCALAPPDATA\windows-reactor-setup\temp" -Filter *.nupkg).Name | Sort-Object
          $seeded = @(
            "Microsoft.Web.WebView2.$env:WEBVIEW2_VERSION.nupkg",
            "Microsoft.WindowsAppSDK.Runtime.$env:WINDOWS_APP_RUNTIME_VERSION.nupkg"
          ) | Sort-Object
          if (($found -join ',') -ne ($seeded -join ',')) { throw "cache holds $($found -join ', ')" }

      # release-app.sh only re-checks the tree when it is publishing, so a build
      # step that rewrote a tracked file would otherwise pass unnoticed — and the
      # artifact would no longer correspond to the commit it claims.
      - name: Verify the build changed nothing tracked
        shell: bash
        run: |
          set -euo pipefail
          status="$(git status --porcelain --ignore-submodules=none)"
          if [ -n "$status" ]; then
            echo "$status" >&2
            echo "::error::the build modified tracked files — the artifact no longer matches ${{ github.sha }}"
            exit 1
          fi

      # The release script prints the SHA-256 but writes no file, and the digest of
      # the zip an artifact upload produces is not the installer's own. Publishing
      # the installer's digest beside it is what lets a reader check the download.
      - name: Write the checksum
        shell: bash
        run: |
          set -euo pipefail
          cd windows/.build/distribution
          sha256sum ./*.exe | tee SHA256SUMS

      # `id` is set so a later signing step can hand SignPath's action this
      # artifact by id without restructuring the job. include-hidden-files is
      # required because the output lives under the hidden `windows/.build`.
      - name: Upload the installer
        id: installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer-unsigned
          path: |
            windows/.build/distribution/*.exe
            windows/.build/distribution/SHA256SUMS
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  # The installer on x64 Windows, as an UPGRADE from the last published
  # release (windows/scripts/smoke-installer.ps1).
  installer-x64:
    name: Installer smoke (x64 upgrade)
    needs: build
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: windows/scripts/smoke-installer.ps1
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-installer-unsigned
          path: distribution

      # The previous release is the newest published (not draft, not
      # prerelease) `desktop-*` release carrying an installer — except, on a
      # `release: published` run, the release being rebuilt (its own tag). A
      # dispatched run keeps the newest even when it builds the same version
      # (main before a bump): that is the upgrade users are on. Its digest is
      # GitHub's own `digest` field on the asset,
      # so nothing here moves by hand at each release. One page of 100 releases
      # reaches back far further than any desktop release gap.
      - name: Install over the previous release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem distribution\TaigiKeyboard-*.exe | Select-Object -First 1
          $releases = Invoke-RestMethod -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/releases?per_page=100" -Headers @{
            Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $rebuilt = if ($env:GITHUB_EVENT_NAME -eq 'release') { $env:GITHUB_REF_NAME } else { '' }
          $asset = $releases |
            Where-Object { -not $_.draft -and -not $_.prerelease -and $_.tag_name -like 'desktop-*' -and $_.tag_name -ne $rebuilt } |
            Sort-Object { [DateTime] $_.published_at } -Descending |
            ForEach-Object { $_.assets } |
            Where-Object { $_.name -match '^TaigiKeyboard-[0-9.]+\.exe$' } |
            Select-Object -First 1
          if (-not $asset) { throw 'no published desktop release carries a TaigiKeyboard-*.exe' }
          if ($asset.digest -cnotmatch '^sha256:([0-9a-f]{64})$') { throw "$($asset.name) has no sha256 digest: '$($asset.digest)'" }
          $expected = $Matches[1]
          Write-Host "previous release: $($asset.name) ($expected)"
          $previous = Join-Path $env:RUNNER_TEMP $asset.name
          Invoke-WebRequest -UseBasicParsing -OutFile $previous -Uri $asset.browser_download_url
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $previous).Hash.ToLower()
          if ($actual -ne $expected) { throw "previous installer digest $actual, expected $expected" }
          & windows/scripts/smoke-installer.ps1 -Action Install -Installer $installer.FullName -Previous $previous

      - name: Uninstall
        shell: powershell
        run: '& windows/scripts/smoke-installer.ps1 -Action Uninstall'

  # The installer on Arm64 Windows 11, fresh: install, then ask COM for the
  # class object from an Arm64 process and from an x64-emulated one — each must
  # load its own architecture's service through the Arm64X forwarder
  # (docs/architecture/windows-arm64-roadmap.md § Forwarder) — then uninstall.
  # Activation, not typing: typing is the VM dogfood.
  installer-arm64:
    name: Installer smoke (Arm64, activation)
    needs: build
    runs-on: windows-11-arm
    timeout-minutes: 20
    env:
      # An x64 process to activate from: Windows 11 on Arm ships no x64
      # PowerShell (SysWOW64's is x86, which reads the 32-bit registry view).
      PWSH_X64_VERSION: 7.6.9
      PWSH_X64_SHA256: ce7484804c0f0ad4dda10c958e71acdaf7eebfb22505c1b480f89e0e9f1da94d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            windows/scripts/smoke-installer.ps1
            windows/scripts/smoke-activation.ps1
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-installer-unsigned
          path: distribution

      - name: Install
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Get-ChildItem distribution\TaigiKeyboard-*.exe | Select-Object -First 1).FullName
          & windows/scripts/smoke-installer.ps1 -Action Install -Installer $installer

      - name: Activate from an Arm64 process
        shell: powershell
        run: >-
          & windows/scripts/smoke-activation.ps1 -Architecture ARM64
          -Expected TaigiKeyboardArm64.dll -Unexpected TaigiKeyboard.dll

      - name: Activate from an x64 process
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = "$env:RUNNER_TEMP\pwsh-x64.zip"
          $dir = "$env:RUNNER_TEMP\pwsh-x64"
          Invoke-WebRequest -UseBasicParsing -OutFile $zip -Uri `
            "https://github.com/PowerShell/PowerShell/releases/download/v$env:PWSH_X64_VERSION/PowerShell-$env:PWSH_X64_VERSION-win-x64.zip"
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLower()
          if ($actual -ne $env:PWSH_X64_SHA256) { throw "PowerShell digest $actual, expected $env:PWSH_X64_SHA256" }
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          & "$dir\pwsh.exe" -NoProfile -STA -File windows/scripts/smoke-activation.ps1 `
            -Architecture AMD64 -Expected TaigiKeyboard.dll -Unexpected TaigiKeyboardArm64.dll
          if ($LASTEXITCODE -ne 0) { throw "smoke-activation.ps1 exited $LASTEXITCODE" }

      - name: Uninstall
        shell: powershell
        run: '& windows/scripts/smoke-installer.ps1 -Action Uninstall'

  # Only a dispatched run on `main` stages a release, and only once both
  # installer smoke tests passed. A run triggered by `release: published` is the
  # provenance rebuild — the release it would attach to is already public, and
  # its installer is the one people are downloading. A dispatched branch run
  # builds and tests, and attaches nothing.
  attach:
    name: Attach the installer to the draft release
    needs: [build, installer-x64, installer-arm64]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Attaching the installer to the draft release is a write; the run's own
      # GITHUB_TOKEN can do it inside this repository, so no PAT is involved.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: windows/Cargo.toml
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-installer-unsigned
          path: distribution

      - name: Attach
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(awk '
              /^\[workspace\.package\]/ { inside = 1; next }
              inside && /^\[/ { exit }
              inside && /^version *=/ { gsub(/[" ]/, "", $3); print $3; exit }
          ' windows/Cargo.toml)"
          tag="desktop-$version"

          # The draft is stage-desktop.sh's (the macOS half, or the script
          # itself for a patch); this run joins it. A published release means
          # the staging order was broken — an asset added to it would be public
          # with no test — and no release at all means nothing staged yet.
          state="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft|tostring' 2>&1)" || {
              echo "no release $tag: $state" >&2
              echo "stage-desktop.sh creates the draft before dispatching this run." >&2
              exit 1
          }
          [ "$state" = true ] || {
              echo "$tag is already published — an asset added now would be public with no test" >&2
              exit 1
          }

          cd distribution
          installer="TaigiKeyboard-$version.exe"
          [ -f "$installer" ] || { echo "no $installer in $(pwd)" >&2; exit 1; }
          # The digest beside the installer, in the same shape the macOS half
          # stages: an unsigned channel gives a user nothing else to check a
          # manual download against.
          sha256sum "$installer" | cut -d' ' -f1 > "$installer.sha256.tmp"
          printf '%s  %s\n' "$(cat "$installer.sha256.tmp")" "$installer" > "$installer.sha256"
          rm -f "$installer.sha256.tmp"

          gh release upload "$tag" "$installer" "$installer.sha256" --repo "$GITHUB_REPOSITORY"
          echo "attached $installer to $tag (built from $GITHUB_SHA)"
