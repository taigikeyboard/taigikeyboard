name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      proto: ${{ steps.filter.outputs.proto }}
      android: ${{ steps.filter.outputs.android }}
      docs: ${{ steps.filter.outputs.docs }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            rust:
              - 'engine/**'
              - '.github/workflows/ci.yml'
            proto:
              - 'engine/protos/proto/**'
              - 'engine/scripts/gen-platform-protos.sh'
              - 'android/app/src/main/java/com/siansiansu/taigikeyboard/engine/proto/**'
              - '.github/workflows/ci.yml'
            android:
              - 'android/**'
              - 'engine/**'
              - '.github/workflows/ci.yml'
            docs:
              - 'rules/**/*.md'
              - '*.md'
              - '.markdownlint.json'
              - '.github/workflows/ci.yml'
            workflows:
              - '.github/workflows/**'

  rust-engine:
    name: Rust engine
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Pinned to 27.5 to match the libprotoc version that produced the
      # checked-in *.pb.swift / *.java files. apt's protobuf-compiler on
      # ubuntu-24.04 is 3.21.x, which would dirty the proto-drift job.
      - name: Setup protoc 27.5
        uses: arduino/setup-protoc@v3
        with:
          version: '27.5'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine -> target
          shared-key: rust-host

      # Inlines `cargo make ci` (fmt-check + check + clippy + test) so the CI
      # runner does not need cargo-make installed. Keep these four commands in
      # sync with engine/Makefile.toml [tasks.ci].
      - name: cargo fmt --check
        working-directory: engine
        run: cargo fmt --all -- --check

      - name: cargo check --locked
        working-directory: engine
        run: cargo check --workspace --locked

      - name: cargo clippy -D warnings
        working-directory: engine
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        working-directory: engine
        run: cargo test --workspace --locked

  proto-drift:
    name: Proto drift (Java)
    needs: changes
    if: needs.changes.outputs.proto == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup protoc 27.5
        uses: arduino/setup-protoc@v3
        with:
          version: '27.5'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Java-only regen. protoc-gen-swift has no Linux binary release and
      # building swift-protobuf from source on Linux is heavy; Swift drift
      # is caught locally via engine/scripts/gen-platform-protos.sh.
      #
      # The perl post-process below mirrors gen-platform-protos.sh lines
      # 58-67: protoc-gen-java emits trailing whitespace + an extra blank
      # line that fail `git diff --check`. Keep in sync with the script.
      - name: Regenerate Java protos
        run: |
          PROTO_DIR=engine/protos/proto
          JAVA_OUT=android/app/src/main/java
          mkdir -p "$JAVA_OUT"
          protoc \
            --proto_path="$PROTO_DIR" \
            --java_out=lite:"$JAVA_OUT" \
            "$PROTO_DIR"/envelope.proto \
            "$PROTO_DIR"/phonetics.proto \
            "$PROTO_DIR"/composing.proto \
            "$PROTO_DIR"/lexicon.proto \
            "$PROTO_DIR"/nextword.proto \
            "$PROTO_DIR"/case.proto

          JAVA_PROTO_DIR="$JAVA_OUT/com/siansiansu/taigikeyboard/engine/proto"
          for f in "$JAVA_PROTO_DIR"/*.java; do
            perl -i -pe 's/[ \t]+$//' "$f"
            perl -i -e 'local $/; $_ = <>; s/\n+\z/\n/; print' "$f"
          done

      - name: Verify no drift
        run: |
          if ! git diff --exit-code -- 'android/app/src/main/java/com/siansiansu/taigikeyboard/engine/proto/'; then
            echo "::error::Java proto bindings drifted from .proto sources."
            echo "Run engine/scripts/gen-platform-protos.sh locally and commit the result."
            exit 1
          fi

  android:
    name: Android (lint + test + build)
    needs: changes
    if: needs.changes.outputs.android == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup protoc 27.5
        uses: arduino/setup-protoc@v3
        with:
          version: '27.5'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine -> target
          shared-key: rust-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
          add-to-path: false

      - name: Build Rust .so for Android (arm64-v8a + armeabi-v7a)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: bash engine/scripts/build-android-libs.sh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: gradle lint + unit tests + assembleDebug
        working-directory: android
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Upload lint report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

  markdown:
    name: Markdown lint
    needs: changes
    if: needs.changes.outputs.docs == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v17
        with:
          config: .markdownlint.json
          globs: |
            rules/**/*.md
            *.md

  actionlint:
    name: actionlint
    needs: changes
    if: needs.changes.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: raven-actions/actionlint@v2
