name: Linux build

# The Linux input method on a real Linux: what the maintainer's Mac cannot
# prove (docs/architecture/linux-roadmap.md L12). Builds both workspaces the
# engine links, runs the Linux workspace's tests, and smokes the engine
# against a real ibus-daemon — the daemon must be able to spawn the binary
# from the component XML and complete `CreateEngine`, which is the wire's
# first byte-level contract. Every run also packs the three packages — the
# `.deb` here, the Fedora `.rpm` and the Arch `.pkg.tar.zst` in their own
# distribution containers — and keeps them as the workflow artifacts
# `linux-deb` / `linux-rpm` / `linux-arch`.
#
# On a dispatch from `scripts/stage-desktop.sh` the run attaches the packages
# to the `desktop-<version>` draft — the Linux half of a desktop release, the
# way `windows-build.yml` is the Windows half (docs/architecture/linux-release.md).
#
# Budget: ~4 min warm, ~10 min cold (dependency compile + apt).
on:
  # A publish rebuilds for provenance and keeps the artifact; it never
  # touches the published assets (`desktop-release.md`: what was tested is
  # what ships).
  release:
    types: [published]
  # USER 2026-09-25: schedule, not per pull request (「將linux build也改成排程,
  # 減少mr等待的時間」), like linux-e2e.yml. Nightly at 台灣凌晨 2:30 (18:30 UTC),
  # half an hour before the e2e run; a failure mails whoever last edited the
  # cron. Before merging a Linux change, `make linux-check` locally or a manual
  # dispatch of this workflow.
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      source_sha:
        description: The commit stage-desktop.sh staged; attach runs only when it is set and matches
        required: false
        type: string

# Every job reads; only `attach` writes (its own block below).
permissions:
  contents: read

concurrency:
  group: linux-build-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Same pin as engine.yml: engine/protos/build.rs shells out to protoc.
  PROTOC_VERSION: 36.1
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build + test + ibus smoke
    runs-on: ubuntu-24.04
    # Only the desktop train: a mobile publish has no Linux package in it.
    if: >-
      github.event_name != 'release' ||
      startsWith(github.event.release.tag_name, 'desktop-')
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ibus dbus-daemon xvfb libgtk-4-dev libadwaita-1-dev pkg-config \
            fcitx5 fcitx5-modules-dev extra-cmake-modules cmake ninja-build dpkg-dev desktop-file-utils

      - name: Install protoc ${{ env.PROTOC_VERSION }}
        run: |
          curl -sSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -q -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          protoc --version

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            linux -> target
            desktop -> target

      - name: cargo clippy (linux workspace)
        working-directory: linux
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Under xvfb: the settings crate's pane-mount test needs a display and
      # skips itself without one.
      - name: cargo test (linux workspace)
        working-directory: linux
        env:
          # The pane-mount test must run here, never skip: a display exists.
          TAIGI_REQUIRE_DISPLAY: "1"
        run: xvfb-run -a cargo test --workspace

      # The test-mode trace (docs/architecture/e2e-trace-schema.md); release
      # packages prove it absent in `make build` (e2e-trace-guard.sh).
      - name: cargo test (platform trace, e2e-trace on)
        working-directory: linux
        run: cargo test -p taigi-linux-core --features e2e-trace

      - name: cargo build --release (IBus engine + FFI static library)
        working-directory: linux
        run: cargo build --release -p taigikeyboard-ibus -p taigi-linux-ffi

      # The Fcitx5 addon: the only place it compiles before a Linux VM does.
      - name: cmake (Fcitx5 addon)
        working-directory: linux
        run: |
          cmake -S fcitx5 -B target/fcitx5-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DTAIGI_FFI_LIB="$PWD/target/release/libtaigi_linux_ffi.a"
          cmake --build target/fcitx5-build
          test -f target/fcitx5-build/src/libtaigikeyboard.so
          nm -D --defined-only target/fcitx5-build/src/libtaigikeyboard.so | grep -q fcitx_addon_factory_instance

      - name: cargo fmt --check
        working-directory: linux
        run: cargo fmt -- --check

      # The daemon smoke: install the engine into a throwaway prefix, point
      # ibus-daemon at that component directory, and ask it to list and
      # select the engine. `ibus engine taigikeyboard` returns only once the
      # daemon has spawned the binary and CreateEngine has answered.
      - name: ibus-daemon smoke
        working-directory: linux
        run: |
          set -euxo pipefail
          PREFIX="$RUNNER_TEMP/prefix"
          make install PREFIX="$PREFIX" DESTDIR=""
          test -f "$PREFIX/share/fcitx5/addon/taigikeyboard.conf"
          # The addon file the loader will look for (5.1.7 addonloader.cpp:
          # `Library=export:libX` → `libX.so`) must be the one installed.
          library="$(sed -n 's/^Library=export:\(.*\)$/\1/p' "$PREFIX/share/fcitx5/addon/taigikeyboard.conf")"
          test -n "$library"
          found=""
          for candidate in "$PREFIX"/lib/fcitx5/"$library".so "$PREFIX"/lib/*/fcitx5/"$library".so; do
            [ -f "$candidate" ] && found="$candidate"
          done
          [ -n "$found" ] || { echo "::error::no $library.so under $PREFIX/lib — the addon .conf and the CMake target disagree"; exit 1; }
          echo "addon file: $found"
          desktop-file-validate "$PREFIX/share/applications/tw.taigikeyboard.Settings.desktop"
          export IBUS_COMPONENT_PATH="$PREFIX/share/ibus/component"
          export TAIGIKEYBOARD_DATA_DIR="$GITHUB_WORKSPACE"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/xdg-config"
          export XDG_DATA_HOME="$RUNNER_TEMP/xdg-data"
          export RUST_LOG=debug
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME"
          xvfb-run -a dbus-run-session -- bash -c '
            set -euxo pipefail
            # No config module on a runner (no dconf / memconf): `--config disable`
            # keeps the daemon up; `--panel disable` likewise.
            ibus-daemon --verbose --panel disable --config disable > "$RUNNER_TEMP/ibus-daemon.log" 2>&1 &
            DAEMON=$!
            # The daemon writes its socket file once its bus is up.
            for i in $(seq 1 40); do ibus list-engine > /dev/null 2>&1 && break; sleep 0.5; done
            ibus list-engine | tee "$RUNNER_TEMP/engines.txt"
            grep -q taigikeyboard "$RUNNER_TEMP/engines.txt"
            ibus engine taigikeyboard
            sleep 2
            ibus engine | tee "$RUNNER_TEMP/current.txt"
            grep -q taigikeyboard "$RUNNER_TEMP/current.txt"
            kill "$DAEMON" || true
          '

      # The package, from the same install layout the smoke used, then read
      # back: a `.deb` that lists the addon, the engine, the window, the
      # registration files and the dictionaries.
      - name: Build the .deb
        working-directory: linux
        run: |
          set -euo pipefail
          make deb
          dpkg-deb --contents target/taigikeyboard_*_amd64.deb | tee "$RUNNER_TEMP/deb-contents.txt"
          for path in usr/libexec/ibus-engine-taigikeyboard usr/bin/taigikeyboard-settings \
                      fcitx5/libtaigikeyboard.so usr/share/fcitx5/addon/taigikeyboard.conf \
                      usr/share/fcitx5/inputmethod/taigikeyboard.conf usr/share/ibus/component/taigikeyboard.xml \
                      usr/share/taigikeyboard/dictionaries/dictionary.fst usr/share/applications/tw.taigikeyboard.Settings.desktop \
                      usr/share/icons/hicolor/48x48/apps/taigikeyboard.png usr/share/doc/taigikeyboard/copyright; do
            grep -q "$path" "$RUNNER_TEMP/deb-contents.txt" || { echo "::error::$path missing from the .deb"; exit 1; }
          done
          # The control fields, not only the file name: the package a user
          # installs has to say the version the release is tagged with.
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          package="target/taigikeyboard_${version}_amd64.deb"
          [ "$(dpkg-deb -f "$package" Version)" = "$version" ] || { echo "::error::$package control Version is not $version"; exit 1; }
          [ "$(dpkg-deb -f "$package" Architecture)" = amd64 ] || { echo "::error::$package control Architecture is not amd64"; exit 1; }
          cd target && sha256sum taigikeyboard_*_amd64.deb | tee SHA256SUMS

      # Nothing here passes --locked, so a resolution that rewrote
      # linux/Cargo.lock would pass unnoticed — and the package would no
      # longer correspond to the commit it claims (windows-build.yml, same step).
      - name: Verify the build changed nothing tracked
        run: |
          set -euo pipefail
          status="$(git status --porcelain --ignore-submodules=none)"
          if [ -n "$status" ]; then
            echo "$status" >&2
            echo "::error::the build modified tracked files — the package no longer matches ${{ github.sha }}"
            exit 1
          fi

      - name: Upload the .deb
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-deb
          path: |
            linux/target/taigikeyboard_*_amd64.deb
            linux/target/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Show daemon log on failure
        if: failure()
        run: |
          cat "$RUNNER_TEMP/ibus-daemon.log" 2>/dev/null || true
          ls -la "$RUNNER_TEMP" || true

  # The Fedora package: the same `make install` layout packed by rpmbuild, in
  # the distribution's own container so rpm's ELF scan writes Fedora's
  # library Requires. `install-check` installs it into a clean container.
  rpm:
    name: Fedora .rpm
    runs-on: ubuntu-24.04
    container: fedora:44
    if: >-
      github.event_name != 'release' ||
      startsWith(github.event.release.tag_name, 'desktop-')
    timeout-minutes: 40
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git gcc gcc-c++ make cmake ninja-build extra-cmake-modules fcitx5-devel \
            gtk4-devel libadwaita-devel pkgconf-pkg-config rpm-build unzip findutils

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install protoc ${{ env.PROTOC_VERSION }}
        run: |
          curl -sSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          unzip -q -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'

      - name: Install Rust toolchain
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: fedora
          workspaces: linux -> target

      - name: Build the .rpm
        run: make -C linux rpm

      - name: Checksum
        run: cd linux/target && sha256sum taigikeyboard-*.x86_64.rpm | tee SHA256SUMS-rpm

      - name: Upload the .rpm
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-rpm
          path: |
            linux/target/taigikeyboard-*.x86_64.rpm
            linux/target/SHA256SUMS-rpm
          if-no-files-found: error
          retention-days: 14

  # The Arch package: the same layout packed by makepkg, which refuses to run
  # as root — so the build runs as an unprivileged user.
  arch:
    name: Arch .pkg.tar.zst
    runs-on: ubuntu-24.04
    container: archlinux:latest
    if: >-
      github.event_name != 'release' ||
      startsWith(github.event.release.tag_name, 'desktop-')
    timeout-minutes: 40
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git cmake ninja extra-cmake-modules fcitx5 gtk4 libadwaita pkgconf unzip rustup

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install protoc ${{ env.PROTOC_VERSION }}
        run: |
          curl -sSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          unzip -q -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'

      - name: Build the package (unprivileged)
        run: |
          set -euo pipefail
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          sudo -u builder bash -c 'set -euo pipefail; rustup default stable; make -C linux arch'

      - name: Checksum
        run: cd linux/target && sha256sum taigikeyboard-*-x86_64.pkg.tar.zst | tee SHA256SUMS-arch

      - name: Upload the package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-arch
          path: |
            linux/target/taigikeyboard-*-x86_64.pkg.tar.zst
            linux/target/SHA256SUMS-arch
          if-no-files-found: error
          retention-days: 14

  # Each package installed into a FRESH container of its distribution — no
  # build dependency present to hide a missing runtime one — and every
  # package held to the SAME checks, so the three formats are proven equally:
  # files in place, every linked library resolved, the IBus daemon spawning
  # the engine, Fcitx5 loading the addon, and the desktop caches (icon,
  # fontconfig) holding what the package installed. Behaviour on a desktop
  # session is S74's.
  install-check:
    name: install check (${{ matrix.distro }})
    needs: [build, rpm, arch]
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            image: ubuntu:24.04
            artifact: linux-deb
            install: >-
              apt-get update &&
              DEBIAN_FRONTEND=noninteractive apt-get install -y ./taigikeyboard_*_amd64.deb
              fcitx5 ibus dbus-daemon dbus-bin xvfb x11-xkb-utils
            addon: /usr/lib/x86_64-linux-gnu/fcitx5/libtaigikeyboard.so
            engine: /usr/libexec/ibus-engine-taigikeyboard
            license: /usr/share/doc/taigikeyboard/copyright
          - distro: fedora
            image: fedora:44
            artifact: linux-rpm
            install: >-
              dnf install -y ./taigikeyboard-*.x86_64.rpm fcitx5 ibus dbus-daemon dbus-tools
              xorg-x11-server-Xvfb setxkbmap
            addon: /usr/lib64/fcitx5/libtaigikeyboard.so
            engine: /usr/libexec/taigikeyboard/ibus-engine-taigikeyboard
            license: /usr/share/licenses/taigikeyboard/fonts-OFL-1.1.txt
          - distro: arch
            image: archlinux:latest
            artifact: linux-arch
            install: >-
              pacman -Syu --noconfirm &&
              pacman -U --noconfirm ./taigikeyboard-*-x86_64.pkg.tar.zst &&
              pacman -S --noconfirm --needed ibus dbus xorg-server-xvfb xorg-setxkbmap
            addon: /usr/lib/fcitx5/libtaigikeyboard.so
            engine: /usr/lib/taigikeyboard/ibus-engine-taigikeyboard
            license: /usr/share/licenses/taigikeyboard/fonts-OFL-1.1.txt
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}

      - name: Install the package (+ both frameworks, D-Bus tools, a virtual display)
        run: ${{ matrix.install }}

      # What every desktop has and a bare container lacks: a machine id (IBus
      # names its bus address file after it) and a display (`ibus engine`
      # runs setxkbmap on it). Xvfb stays up for the later steps.
      - name: Machine id + virtual display
        shell: bash
        run: |
          set -eu
          [ -s /etc/machine-id ] || tr -d - < /proc/sys/kernel/random/uuid > /etc/machine-id
          Xvfb :99 -nolisten tcp > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          for i in $(seq 1 20); do [ -e /tmp/.X11-unix/X99 ] && break; sleep 0.5; done
          [ -e /tmp/.X11-unix/X99 ] || { cat "$RUNNER_TEMP/xvfb.log"; exit 1; }

      - name: Files in place, every linked library resolved
        shell: bash
        env:
          ADDON: ${{ matrix.addon }}
          ENGINE: ${{ matrix.engine }}
          LICENSE_FILE: ${{ matrix.license }}
        run: |
          set -eu
          # The engine and licence paths differ per distribution layout
          # (linux/Makefile LAYOUT); the component XML must name the former.
          grep -q "<exec>$ENGINE --ibus</exec>" /usr/share/ibus/component/taigikeyboard.xml || { echo "::error::component <exec> does not name $ENGINE"; exit 1; }
          for path in "$ENGINE" /usr/bin/taigikeyboard-settings "$ADDON" "$LICENSE_FILE" \
                      /usr/share/fcitx5/addon/taigikeyboard.conf /usr/share/fcitx5/inputmethod/taigikeyboard.conf \
                      /usr/share/ibus/component/taigikeyboard.xml /usr/share/taigikeyboard/dictionaries/dictionary.fst \
                      /usr/share/applications/tw.taigikeyboard.Settings.desktop; do
            test -e "$path" || { echo "::error::$path missing after install"; exit 1; }
          done
          for elf in "$ENGINE" /usr/bin/taigikeyboard-settings "$ADDON"; do
            # ldd itself must succeed: a failure (bad ELF) would otherwise
            # read as "nothing missing".
            libs="$(ldd "$elf" 2>&1)" || { echo "$libs"; echo "::error::ldd failed on $elf"; exit 1; }
            if grep 'not found' <<< "$libs"; then
              echo "::error::$elf links a library the package does not pull in"
              exit 1
            fi
          done

      # The build job's daemon smoke, against the INSTALLED component: the
      # daemon lists the engine and `ibus engine` returns only once it has
      # spawned the binary and CreateEngine answered.
      - name: IBus spawns the engine
        shell: bash
        env:
          DISPLAY: ":99"
        run: |
          set -euxo pipefail
          export XDG_CONFIG_HOME="$RUNNER_TEMP/xdg-config" XDG_DATA_HOME="$RUNNER_TEMP/xdg-data"
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME"
          dbus-run-session -- bash -c '
            set -euxo pipefail
            ibus-daemon --verbose --panel disable --config disable > "$RUNNER_TEMP/ibus-daemon.log" 2>&1 &
            for i in $(seq 1 40); do ibus list-engine > /dev/null 2>&1 && break; sleep 0.5; done
            ibus list-engine | grep -q taigikeyboard
            ibus engine taigikeyboard
            sleep 2
            ibus engine | grep -q taigikeyboard
          ' || { cat "$RUNNER_TEMP/ibus-daemon.log"; exit 1; }

      # The addon is OnDemand: fcitx5 lists the input method from its .conf,
      # and loads the library only when asked for it. GetConfig on the addon
      # URI loads it (fcitx5 dbusmodule.cpp `getConfig` → addonManager().addon(
      # name, true)); addonmanager.cpp logs "Loaded addon <name>" on success.
      - name: Fcitx5 lists the input method and loads the addon
        shell: bash
        env:
          DISPLAY: ":99"
        run: |
          set -euxo pipefail
          export XDG_CONFIG_HOME="$RUNNER_TEMP/xdg-config" XDG_DATA_HOME="$RUNNER_TEMP/xdg-data"
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME"
          log="$RUNNER_TEMP/fcitx5.log"
          dbus-run-session -- bash -c '
            set -euxo pipefail
            fcitx5 --verbose="*=5" > "'"$log"'" 2>&1 &
            call() { dbus-send --session --print-reply --dest=org.fcitx.Fcitx5 /controller "org.fcitx.Fcitx.Controller1.$@"; }
            # Wait for THIS fcitx5 to own its name before any call: a call to
            # an unowned name makes dbus-daemon auto-start a second fcitx5
            # (its log goes to the step, not $log), and the grep below races.
            owned() { dbus-send --session --print-reply --dest=org.freedesktop.DBus / org.freedesktop.DBus.NameHasOwner string:org.fcitx.Fcitx5 | grep -q "boolean true"; }
            for i in $(seq 1 40); do owned && break; sleep 0.5; done
            # Captured, not piped into grep -q: an early grep exit would
            # SIGPIPE dbus-send and pipefail would fail the step.
            ims="$(call AvailableInputMethods)"
            grep -q "\"taigikeyboard\"" <<< "$ims"
            call GetConfig string:fcitx://config/addon/taigikeyboard > /dev/null
            sleep 1
            grep -q "Loaded addon taigikeyboard" "'"$log"'"
          ' || { cat "$log"; echo "::error::fcitx5 did not load the taigikeyboard addon"; exit 1; }

      # What each distribution's own hooks (dpkg / rpm file triggers, pacman
      # hooks) must have done: fontconfig knows the bundled typefaces, and an
      # existing hicolor icon cache lists the icon. No cache at all is fine —
      # GTK then scans the directories itself.
      - name: Desktop caches hold the installed icon and fonts
        shell: bash
        run: |
          set -euo pipefail
          fc-list | grep -i taigikeyboard || { echo "::error::fontconfig does not list the bundled typefaces"; exit 1; }
          cache=/usr/share/icons/hicolor/icon-theme.cache
          if [ -f "$cache" ]; then
            grep -q taigikeyboard "$cache" || { echo "::error::$cache exists but lacks the taigikeyboard icon — no hook refreshed it"; exit 1; }
            echo "icon cache refreshed"
          else
            echo "no hicolor icon cache on this system; GTK scans the directories"
          fi

  # The release half: only a dispatch from `main` by `stage-desktop.sh`,
  # carrying the commit it staged, attaches — onto a DRAFT targeting that
  # commit, never over an asset already there. What the maintainer tests on
  # the draft is what a publish ships. The only job that can write.
  attach:
    name: attach to the draft
    needs: [build, rpm, arch, install-check]
    if: >-
      github.repository == 'taigikeyboard/taigikeyboard' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.source_sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: linux-*
          merge-multiple: true
          path: linux/target

      - name: Attach the three packages to the draft release
        working-directory: linux
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          # The commit the staging run meant, not whatever main points at by
          # the time this run started: main can move while the Windows half
          # is waited on.
          [ "$SOURCE_SHA" = "$GITHUB_SHA" ] || {
              echo "::error::this run built $GITHUB_SHA but the staging run staged $SOURCE_SHA — main moved; re-run stage-desktop.sh"
              exit 1
          }
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          tag="desktop-$version"
          # The draft is stage-desktop.sh's, created on the staged commit. A
          # published release means the staging order was broken; a draft on
          # another commit is another staging run's.
          state="$(gh release view "$tag" --json isDraft,targetCommitish \
              --jq '"\(.isDraft) \(.targetCommitish)"' 2>&1)" || {
              echo "no release $tag: $state" >&2
              echo "stage-desktop.sh creates the draft before dispatching this run." >&2
              exit 1
          }
          read -r is_draft target <<< "$state"
          [ "$is_draft" = true ] || {
              echo "$tag is already published — an asset added now would be public with no test" >&2
              exit 1
          }
          [ "$target" = "$GITHUB_SHA" ] || {
              echo "::error::the $tag draft targets $target, not $GITHUB_SHA — another staging run owns it"
              exit 1
          }
          cd target
          # The names scripts/lib/desktop-release.sh looks for (LINUX_*_ASSET).
          for package in "taigikeyboard_${version}_amd64.deb" \
                         "taigikeyboard-${version}-1.x86_64.rpm" \
                         "taigikeyboard-${version}-1-x86_64.pkg.tar.zst"; do
            test -f "$package" || { echo "::error::$package was not built"; exit 1; }
            sha256sum "$package" > "$package.sha256"
            gh release upload "$tag" "$package" "$package.sha256" --repo "$GITHUB_REPOSITORY"
            echo "attached $package to $tag (built from $GITHUB_SHA)"
          done
