name: Linux e2e

# The end-to-end run on a real Linux (docs/architecture/e2e-testing-roadmap.md,
# PR3b + PR4): in a distribution's own container, the test-mode build
# (`make -C linux install E2E=1`) compiled against THAT distribution's
# libraries and installed into a private prefix, every e2e/scenarios/*.json
# typed through xdotool into a GTK entry via Fcitx5 and via IBus under Xvfb,
# then tools/e2e/analyze.py. Each run directory (traces + report.md) is kept
# as the `linux-e2e-<distro>` artifact. The shipped packages are never traced
# (PR3a); their own install check lives in linux-build.yml.
#
# USER 2026-09-25: schedule only ("switch everything to scheduled runs") — no pull_request
# trigger. The whole distribution matrix runs nightly (USER 2026-09-24:
# 03:00 Taiwan time = 19:00 UTC) and on demand. A scheduled failure mails whoever
# last edited the cron.
on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-e2e-${{ github.event_name }}-${{ github.sha }}

env:
  PROTOC_VERSION: "36.1"

jobs:
  e2e:
    name: scenarios through Fcitx5 + IBus (${{ matrix.distro }})
    runs-on: ubuntu-24.04
    container: ${{ fromJSON('{"ubuntu":"ubuntu:24.04","debian":"debian:13","fedora":"fedora:44","arch":"archlinux:latest"}')[matrix.distro] }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu, debian, fedora, arch]
    # A container's default `sh` is dash on Ubuntu, which has no pipefail.
    defaults:
      run:
        shell: bash
    steps:
      # Before the deps: a container without git gets the tree through the
      # REST API, which is all the build needs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install build + e2e dependencies
        run: bash tools/e2e/linux/ci-deps.sh ${{ matrix.distro }}

      - name: Install protoc ${{ env.PROTOC_VERSION }}
        run: |
          curl -sSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          unzip -q -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'

      # Arch ships rustup as a package; everywhere else it comes from rustup.rs.
      - name: Install Rust toolchain
        run: |
          if command -v rustup >/dev/null; then
            rustup default stable
          else
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable --no-modify-path
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: e2e-${{ matrix.distro }}
          workspaces: |
            linux -> target
            desktop -> target

      - name: Build + install the test-mode IME into a private prefix
        run: make -C linux install E2E=1 PREFIX="$RUNNER_TEMP/prefix"

      - name: Drive every scenario (Fcitx5, then IBus)
        run: |
          set -euo pipefail
          xvfb-run -a dbus-run-session -- python3 tools/e2e/linux/driver.py \
            --framework fcitx5 --prefix "$RUNNER_TEMP/prefix" --out "$RUNNER_TEMP/run"
          # Fedora: ibus-daemon never lists the test engine (only the system
          # xkb engines) — root cause open, USER 2026-09-24 skip + its own
          # round. Recorded as `skipped` so the report still shows it.
          if [ "${{ matrix.distro }}" = fedora ]; then
            python3 tools/e2e/linux/driver.py --framework ibus --out "$RUNNER_TEMP/run" \
              --skip "Fedora: ibus-daemon does not list the test engine (open issue)"
          else
            xvfb-run -a dbus-run-session -- python3 tools/e2e/linux/driver.py \
              --framework ibus --prefix "$RUNNER_TEMP/prefix" --out "$RUNNER_TEMP/run"
          fi

      - name: Analyze
        run: python3 tools/e2e/analyze.py --run "$RUNNER_TEMP/run"

      - name: Report
        if: always()
        run: |
          { echo "### ${{ matrix.distro }}"; cat "$RUNNER_TEMP/run/report.md"; } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Keep the run
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-e2e-${{ matrix.distro }}
          path: ${{ runner.temp }}/run
          if-no-files-found: ignore
