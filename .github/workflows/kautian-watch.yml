name: Kautian watch

# Weekly check whether MoE has published a new 教典 export
# (https://sutian.moe.edu.tw/media/senn/ods/kautian.ods). Compares the export's
# content.xml with the committed capture — the zip bytes and meta.xml carry
# timestamps that change on a re-export with identical rows — and opens an
# issue when the rows differ. Refresh steps: dictionary/docs/SOURCES.md § kautian.
on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: kautian-watch
  cancel-in-progress: false

env:
  KAUTIAN_URL: https://sutian.moe.edu.tw/media/senn/ods/kautian.ods
  KAUTIAN_PATH: dictionary/sources/official/kautian/data/raw/kautian.ods
  ISSUE_TITLE: 'chore(dictionary): MoE kautian.ods has new data'

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: ${{ env.KAUTIAN_PATH }}
          sparse-checkout-cone-mode: false

      # --insecure: the publisher's TLS certificate expired 2026-10-08. The download
      # is only hashed and compared, never committed or built; refreshing the capture
      # is a manual step.
      - name: Download upstream export
        run: |
          curl --fail --silent --show-error --insecure --max-time 300 \
            --dump-header upstream.headers --output upstream.ods "$KAUTIAN_URL"

      - name: Compare with committed capture
        id: compare
        run: |
          upstream=$(unzip -p upstream.ods content.xml | sha256sum | cut -d' ' -f1)
          committed=$(unzip -p "$KAUTIAN_PATH" content.xml | sha256sum | cut -d' ' -f1)
          echo "upstream content.xml:  $upstream"
          echo "committed content.xml: $committed"
          if [ "$upstream" = "$committed" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open issue
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$ISSUE_TITLE\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "Issue #$existing already open"
            exit 0
          fi
          last_modified=$(grep -i '^last-modified:' upstream.headers | cut -d' ' -f2- | tr -d '\r')
          size=$(stat -c %s upstream.ods)
          {
            echo "MoE published a kautian.ods whose rows differ from \`$KAUTIAN_PATH\`."
            echo
            echo "- Source: $KAUTIAN_URL"
            echo "- Upstream Last-Modified: $last_modified"
            echo "- Upstream size: $size bytes"
            echo "- Detected by run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "Refresh: replace the capture, then \`make dict\` (regenerate \`word_unigrams.tsv\` / \`word_bigrams.tsv\` with \`build.corpus_bigrams\` if a unigram row is no longer a dictionary record) and commit the rebuilt artifacts."
          } > issue.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body-file issue.md
