name: Kautian watch

# Daily check whether MoE has published a new 教典 export
# (https://sutian.moe.edu.tw/media/senn/ods/kautian.ods). Compares the export's
# data rows with the committed capture, ignoring packaging, styles and ordering.
# Pushes a refresh branch and opens its data PR as the kautian App; the
# maintainer merges the PR, which closes the issue. GITHUB_TOKEN may not create
# PRs here (workflow permissions keep can_approve_pull_request_reviews off), so
# the PR is opened with the App's token, which also lets PR checks run.
# Refresh steps: dictionary/docs/SOURCES.md § kautian.
on:
  schedule:
    # 08:00 Taiwan time, before kautian-mirror's 09:00 downstream check.
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: kautian-watch
  cancel-in-progress: false

env:
  KAUTIAN_URL: https://sutian.moe.edu.tw/media/senn/ods/kautian.ods
  KAUTIAN_PATH: dictionary/sources/official/kautian/data/raw/kautian.ods

jobs:
  check:
    name: compare upstream export, push refresh branch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: read
    outputs:
      head: ${{ steps.refresh.outputs.head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Download upstream export
        run: |
          curl --fail --silent --show-error --max-time 300 \
            --dump-header "$RUNNER_TEMP/upstream.headers" \
            --output "$RUNNER_TEMP/upstream.ods" "$KAUTIAN_URL"

      - name: Compare with committed capture
        id: compare
        run: |
          python tools/kautian_watch.py compare "$KAUTIAN_PATH" "$RUNNER_TEMP/upstream.ods" \
            --baseline-commit "$GITHUB_SHA" --output "$RUNNER_TEMP/report"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'report/report.json').read_text())
          changed = report['baseline_data_sha256'] != report['upstream_data_sha256']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'changed={str(changed).lower()}', file=output)
          PY

      - name: Upload full diff
        id: report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kautian-diff
          path: ${{ runner.temp }}/report/
          if-no-files-found: error
          retention-days: 90

      # No-change runs preserve the latest diff in the issue history.
      - name: Create or update issue
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_URL: ${{ steps.report.outputs.artifact-url }}
        run: |
          last_modified=$(awk 'tolower($1) == "last-modified:" {$1=""; sub(/^ /, ""); sub(/\r$/, ""); print}' "$RUNNER_TEMP/upstream.headers")
          python tools/kautian_watch.py publish --repo "$GITHUB_REPOSITORY" \
            --report "$RUNNER_TEMP/report" --artifact-url "$ARTIFACT_URL" \
            --last-modified "${last_modified:-unknown}" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.compare.outputs.changed == 'true'
        with:
          node-version: '22'

      # A clean runner compiles fst-builder through engine/protos/build.rs.
      - name: Install protoc
        if: steps.compare.outputs.changed == 'true'
        uses: ./.github/actions/setup-protoc

      - name: Rebuild and push refresh branch
        id: refresh
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A refresh branch without a closed PR still awaits the maintainer.
          # Merged branches are deleted on merge; one closed unmerged lingers.
          # Assigned first: a failing command substitution in a `for` list would
          # not stop the step under `set -e`.
          branches=$(git ls-remote --heads origin 'refs/heads/automation/kautian-*' | sed 's#.*refs/heads/##')
          pending=""
          for existing in $branches; do
            closed=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=closed&head=$GITHUB_REPOSITORY_OWNER:$existing" --jq length)
            if [ "$closed" = 0 ]; then pending="$pending $existing"; fi
          done
          if [ -n "$pending" ]; then
            echo "::notice::Kautian refresh branch awaiting maintainer:$pending"
            # A branch whose PR creation failed gets its PR on a later run.
            retry=""
            for existing in $pending; do
              open=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=$GITHUB_REPOSITORY_OWNER:$existing" --jq length)
              if [ "$open" = 0 ]; then retry="$retry $existing"; fi
            done
            echo "retry=${retry# }" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git submodule update --init taigi-converter
          python -m pip install -r dictionary/requirements.txt
          # The pinned version, host target only (.github/actions/setup-rust's reason).
          RUSTUP_TOOLCHAIN="$(bash tools/rust-toolchain.sh)"
          export RUSTUP_TOOLCHAIN
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
          cp "$RUNNER_TEMP/upstream.ods" "$KAUTIAN_PATH"
          python - <<'PY'
          import datetime, email.utils, hashlib, os, re
          from pathlib import Path
          temporary = Path(os.environ['RUNNER_TEMP'])
          headers = (temporary / 'upstream.headers').read_text()
          modified = re.findall(r'^last-modified:\s*(.+)$', headers, re.I | re.M)
          timestamp = email.utils.parsedate_to_datetime(modified[-1].strip()).astimezone(datetime.UTC)
          digest = hashlib.sha256((temporary / 'upstream.ods').read_bytes()).hexdigest()
          source = Path('dictionary/docs/SOURCES.md')
          text = source.read_text()
          replacement = (
              f'- **Captured**: `data/raw/kautian.ods` on {datetime.datetime.now(datetime.UTC):%Y-%m-%d} from\n'
              '  <https://sutian.moe.edu.tw/media/senn/ods/kautian.ods>.\n'
              f'  Upstream Last-Modified: {timestamp:%Y-%m-%d %H:%M:%S} UTC; SHA-256:\n'
              f'  `{digest}`.\n'
          )
          text, count = re.subn(r'- \*\*Captured\*\*: `data/raw/kautian\.ods`.*?(?=- \*\*Licence\*\*:)', replacement, text, flags=re.S)
          if count != 1:
              raise ValueError('Expected exactly one Kautian provenance block')
          source.write_text(text)
          PY
          # Includes binary round trips, POJ integrity and known FST key gates.
          # Corpus membership errors remain fatal; never discard existing counts.
          make dict
          python - <<'PY'
          import subprocess
          allowed = {
              'dictionary/sources/official/kautian/data/raw/kautian.ods',
              'dictionary/sources/official/kautian/data/kautian.csv',
              'dictionary/supplementary/variants/data/variants.csv',
              'dictionary/output/dictionary.csv', 'dictionary/output/walker_lm_stats.txt',
              'dictionary/word-keys.tsv', 'dictionary/docs/SOURCES.md',
              'assets/dictionaries/dictionary.bin', 'assets/dictionaries/dictionary.fst',
              'assets/dictionaries/syllables.fst', 'assets/dictionaries/association.bin',
          }
          paths = subprocess.check_output(['git', 'diff', '--name-only', '-z']).decode().split('\0')
          unexpected = set(paths) - allowed - {''}
          if unexpected:
              raise ValueError(f'Unexpected generated changes: {sorted(unexpected)}')
          subprocess.run(['git', 'add', '--', *sorted(allowed)], check=True)
          PY
          branch="automation/kautian-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git switch -c "$branch"
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'chore(dictionary): refresh MoE Kautian data'
          git push origin "HEAD:refs/heads/$branch"
          {
            echo "head=$(git rev-parse HEAD)"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"

      # Last step: no repository code runs while the App token exists. Repo-level
      # secret, not env `release`, so the daily run needs no approval.
      # i18n-suggestion.yml mints the same App token to open translation PRs.
      - name: Mint the kautian App token
        id: app
        if: steps.refresh.outputs.branch != '' || steps.refresh.outputs.retry != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.KAUTIAN_APP_CLIENT_ID }}
          private-key: ${{ secrets.KAUTIAN_APP_PRIVATE_KEY }}
          owner: taigikeyboard
          repositories: taigikeyboard
          permission-contents: read
          permission-pull-requests: write

      - name: Open data PR
        if: steps.app.outputs.token != ''
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
          BRANCH: ${{ steps.refresh.outputs.branch }}
          RETRY: ${{ steps.refresh.outputs.retry }}
        run: |
          set -euo pipefail
          issue=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&creator=github-actions%5Bbot%5D&per_page=100" \
            --paginate --jq '.[] | select(.title == "chore(dictionary): MoE kautian.ods has new data" and (has("pull_request") | not)) | .number' | sed -n 1p)
          # The issue already carries the diff report; the PR body stays short.
          # $1 = branch, $2 = run that built it (empty for a retry).
          open_pr() {
            body="Refresh MoE capture, provenance and rebuilt dictionary artifacts."
            if [ -n "$2" ]; then body="$body

          Run: $2"; fi
            if [ -n "$issue" ]; then body="$body

          Closes #$issue"; fi
            GH_TOKEN="$APP_TOKEN" gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$1" \
              --title 'chore(dictionary): refresh MoE Kautian data' --body "$body" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          for existing in $RETRY; do open_pr "$existing" ""; done
          if [ -n "$BRANCH" ]; then
            open_pr "$BRANCH" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

  python:
    name: validate refresh branch (python)
    needs: check
    if: needs.check.outputs.head != ''
    uses: ./.github/workflows/python.yml
    with:
      ref: ${{ needs.check.outputs.head }}
    permissions:
      contents: read

  engine:
    name: validate refresh branch (engine)
    needs: check
    if: needs.check.outputs.head != ''
    uses: ./.github/workflows/engine.yml
    with:
      ref: ${{ needs.check.outputs.head }}
    permissions:
      contents: read
