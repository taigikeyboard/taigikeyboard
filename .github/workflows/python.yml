name: Python tools

# The Python that builds the dictionary and cuts releases, gated on changes to
# it: the dictionary pipeline's unit tests (several drive taigi-converter
# through Node, so that submodule is checked out) and the release-notes and
# Windows icon tools. Nothing is built; ~1 min.
on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate for automated dictionary refreshes
        type: string
        required: true
  pull_request:
    paths:
      - 'dictionary/**/*.py'
      - 'dictionary/requirements.txt'
      # Curated LKK invariants also depend on these data-only edits.
      - 'dictionary/supplementary/lkk/data/lkk.csv'
      - 'dictionary/sources/official/kautian/data/kautian.csv'
      - 'taigi-converter'
      - 'tools/*.py'
      - 'tools/windows/**'
      - '.github/workflows/kautian-watch.yml'
      - '.github/workflows/python.yml'
  push:
    branches: [main]
    paths:
      - 'dictionary/**/*.py'
      - 'dictionary/requirements.txt'
      - 'dictionary/supplementary/lkk/data/lkk.csv'
      - 'dictionary/sources/official/kautian/data/kautian.csv'
      - 'taigi-converter'
      - 'tools/*.py'
      - 'tools/windows/**'
      - '.github/workflows/kautian-watch.yml'
      - '.github/workflows/python.yml'

permissions:
  contents: read

concurrency:
  group: python-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: dictionary + release tools
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      # Only the converter: corpus/ is manual-test text, never a build input.
      - name: Check out taigi-converter
        run: git submodule update --init taigi-converter

      # docs/BUILDING.md: Python 3.13+ (emoji/ requires it), Node 22+
      # (taigi-converter's engines field).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: dictionary/requirements.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: python -m pip install -r dictionary/requirements.txt pytest

      # The tests import the pipeline as top-level packages (`build`, `common`),
      # so they run from inside dictionary/.
      - name: Dictionary pipeline tests
        working-directory: dictionary
        run: python -m pytest tests -q

      - name: Release-notes tool tests
        run: python tools/release_notes_test.py

      - name: Kautian watch tests
        run: python -m pytest tools/kautian_watch_test.py -q

      - name: Platform test selection tests
        run: PYTHONPATH=tools python -m unittest test_select_test.PlatformSelectionTests

      - name: Windows icon tool tests
        run: python -m pytest tools/windows/tests -q
