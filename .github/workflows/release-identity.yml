name: Release identity check

# Checks the release identities; changes nothing.
# - `check`: mints the release App token and checks its `main` + `release tags`
#   ruleset bypass. Run after rotating the App's key or changing its
#   installation. Setup: docs/architecture/desktop-release.md § One-time: the
#   release App.
# - `chrome-web-store`: mints a Chrome Web Store token through Workload
#   Identity Federation and reads both items' status (ChromeOS input method,
#   browser extension). Run after changing the
#   Google Cloud side. Setup: docs/architecture/chromeos-release.md § One-time:
#   the Chrome Web Store API.
on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    name: mint token + ruleset bypass
    if: >-
      github.repository == 'taigikeyboard/taigikeyboard' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The App's client id and key live here. No checkout: no repository code
    # runs while the token exists.
    environment: release
    steps:
      # Fails if the installation lacks either repository or any permission.
      - name: Mint the App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: taigikeyboard
          repositories: taigikeyboard,homebrew-tap
          permission-contents: write
          permission-actions: write
          permission-issues: write
          permission-pull-requests: write

      - name: Check the ruleset bypass
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          fail=0
          for ruleset in main 'release tags'; do
            id=$(gh api repos/taigikeyboard/taigikeyboard/rulesets \
              --jq ".[] | select(.source_type == \"Repository\" and .name == \"$ruleset\") | .id")
            if [ -z "$id" ]; then
              echo "::error::ruleset '$ruleset' not found"; fail=1; continue
            fi
            # Only the single-ruleset endpoint returns current_user_can_bypass.
            bypass=$(gh api "repos/taigikeyboard/taigikeyboard/rulesets/$id" \
              --jq '.current_user_can_bypass // "unknown"')
            echo "ruleset '$ruleset' ($id): current_user_can_bypass=$bypass"
            if [ "$bypass" != always ]; then
              echo "::error::App cannot always bypass ruleset '$ruleset' — add it to the ruleset's bypass list with mode Always"
              fail=1
            fi
          done
          exit "$fail"


  # GitHub's OIDC token → Workload Identity Federation → the store's service
  # account → a 5-minute store token, then a read-only status call per item
  # (`chrome-web-store.sh status <package>`). No stored secret: the `CWS_*` variables on
  # the `release` environment are identifiers.
  chrome-web-store:
    name: Chrome Web Store token + items' status
    if: >-
      github.repository == 'taigikeyboard/taigikeyboard' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The federation's attribute condition admits only this repository's
    # `release` environment.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Mint the store token
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.CWS_WIF_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          access_token_lifetime: 300s
          # The token is a step output only: no credentials file in the
          # workspace, no GOOGLE_* variables for later steps.
          create_credentials_file: false
          export_environment_variables: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/release

      - name: Read the items' status
        env:
          CWS_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ vars.CWS_ITEM_ID }}
          CWS_EXTENSION_ITEM_ID: ${{ vars.CWS_EXTENSION_ITEM_ID }}
        run: |
          bash tools/release/chrome-web-store.sh status chromeos
          bash tools/release/chrome-web-store.sh status extension
