name: Announce desktop release

# The second half of a desktop release, run for you.
#
# The monthly cut (desktop-train.yml) or a hotfix (`make desktop-patch`) stages each
# platform's installer on a DRAFT release that no user can reach. desktop-publish.yml
# publishes the month's draft on the 5th with the App token (a patch is published by
# hand). That publish fires this: it proves each installer downloads
# anonymously, mirrors it to dl.taigikeyboard.tw (Cloudflare R2), then
# writes the website data `appcast/{macos,windows}.json` and
# the download buttons (Linux included) are rendered from, and waits until the
# live appcasts serve it. A release carrying a macOS `.pkg` then bumps the
# Homebrew cask (tools/release/bump-cask.sh) and audits it. A failure posts to
# Discord.
#
# `make desktop-announce` runs the identical script locally — for a re-run after
# a failure here, or when the token below has expired; it prints the
# `bump-cask.sh` arguments.
on:
  release:
    types: [published]
  # For a re-run: the release is already published, so this is idempotent.
  workflow_dispatch:
    inputs:
      version:
        description: Desktop version to announce (defaults to the checkout's)
        required: false

permissions:
  contents: read

# Two announcements at once race on the website commit, and the loser fails;
# queue them instead. `queue: max` keeps every waiting run — the default keeps
# one and cancels the rest, which would skip a platform's announcement.
concurrency:
  group: announce-desktop-release
  queue: max

jobs:
  announce:
    name: website + appcasts
    runs-on: ubuntu-latest
    # The R2 keys, SITE_CONTENTS_TOKEN and the release App's key live in the
    # `release` environment, not at repository level: only `main` (code-owner
    # review) and `*-*.*.*` tags (creation limited by the `release tags`
    # ruleset) may deploy to it, so a pushed branch with an edited workflow
    # cannot read them. The run waits for the environment's reviewer
    # (release-automation-roadmap.md D5).
    environment: release
    # Desktop releases only. A mobile release published here — the mobile train
    # ships through the stores, so there should never be one — carries no
    # desktop installer, and the site data is the desktop train's.
    if: >-
      github.repository == 'taigikeyboard/taigikeyboard' &&
      (github.event_name != 'release' ||
       startsWith(github.event.release.tag_name, 'desktop-'))
    # Up to 25 min per appcast wait (release-site.sh MANIFEST_WAIT_SECONDS:
    # two 10-min caches) plus the downloads and the R2 mirror.
    timeout-minutes: 60
    outputs:
      macos_version: ${{ steps.announce.outputs.macos_version }}
    steps:
      # For the cask bump. Minted before the checkout, so the App's key never
      # shares a job with repository code; only this homebrew-tap-contents
      # token does (release-automation-roadmap.md Phase 7). Valid one hour: a
      # 401 after a slow announcement is fixed by a re-run.
      - name: Mint the App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: taigikeyboard
          repositories: homebrew-tap
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Announce
        id: announce
        env:
          # The script reads this repository's release and commits to the
          # WEBSITE repository, which the workflow's own GITHUB_TOKEN cannot
          # reach. One fine-grained token covering both — taigikeyboard
          # (Contents: read) and taigikeyboard.github.io (Contents: write) —
          # stored as the SITE_CONTENTS_TOKEN secret. When it expires this job
          # fails and `make desktop-announce` still works from a machine with
          # `gh` logged in.
          GH_TOKEN: ${{ secrets.SITE_CONTENTS_TOKEN }}
          # The R2 download mirror (desktop-release.md § One-time: the R2
          # mirror); the AWS CLI it drives is preinstalled on ubuntu-latest.
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          # Through env, never expanded into the script: this step holds the
          # secrets above, and a dispatch input is free text.
          ANNOUNCE_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$ANNOUNCE_VERSION" ]; then
            bash tools/release/announce-release.sh --version "$ANNOUNCE_VERSION"
          else
            bash tools/release/announce-release.sh
          fi

      - name: Bump the cask
        if: steps.announce.outputs.macos_version != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          MACOS_VERSION: ${{ steps.announce.outputs.macos_version }}
          MACOS_SHA256: ${{ steps.announce.outputs.macos_sha256 }}
        run: bash tools/release/bump-cask.sh "$MACOS_VERSION" "$MACOS_SHA256"

  # After the push, so a failure means the live cask is wrong: fix or revert
  # the tap commit by hand. No secret — brew runs code it downloads; the
  # read-only token is for the livecheck's GitHub API calls.
  cask-audit:
    name: audit the cask
    needs: announce
    if: needs.announce.outputs.macos_version != ''
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
      MACOS_VERSION: ${{ needs.announce.outputs.macos_version }}
    steps:
      - name: Audit
        run: |
          set -euo pipefail
          brew tap taigikeyboard/tap
          # Homebrew loads a non-official tap's cask only once trusted.
          brew trust --cask taigikeyboard/tap/taigikeyboard
          tapped="$(brew info --cask --json=v2 taigikeyboard/tap/taigikeyboard | jq -r '.casks[0].version')"
          [ "$tapped" = "$MACOS_VERSION" ] || {
            echo "::error::the tap's cask names $tapped, not $MACOS_VERSION"
            exit 1
          }
          brew audit --cask --strict --online taigikeyboard/tap/taigikeyboard

  finish:
    name: report a failure
    needs: [announce, cask-audit]
    if: always() && github.repository == 'taigikeyboard/taigikeyboard' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/release

      - name: Report a failure
        env:
          DISCORD_PR_WEBHOOK: ${{ secrets.DISCORD_PR_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERSION: ${{ inputs.version || github.event.release.tag_name }}
        run: |
          bash tools/release/desktop-train.sh notify "Desktop announce ${VERSION:-(checkout version)} failed: $RUN_URL"
