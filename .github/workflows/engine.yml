name: Engine

# The shared Rust engine, gated on every change to it: tests, then formatting
# for both Cargo workspaces. Ubuntu only — the engine has no platform code, and
# the platform builds that link it (Xcode, Gradle, SwiftPM, the TSF DLL) stay on
# the maintainer's machines and the release runners; each needs a toolchain that
# would cost more runner time than the tests it would run.
#
# Budget: ~2 min with a warm cache, ~5 min cold (dependency compile). Nothing
# here needs a macOS or Windows runner.
on:
  pull_request:
    paths:
      - 'engine/**'
      - 'windows/**/*.rs'
      - 'windows/Cargo.*'
      - 'dictionary/output/dictionary.csv'
      - 'dictionaries/**'
      - '.github/workflows/engine.yml'
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'windows/**/*.rs'
      - 'windows/Cargo.*'
      - 'dictionary/output/dictionary.csv'
      - 'dictionaries/**'
      - '.github/workflows/engine.yml'

permissions:
  contents: read

concurrency:
  group: engine-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Same pin as windows-build.yml, for the same reason: engine/protos/build.rs
  # shells out to protoc, and the runner image has none.
  PROTOC_VERSION: 36.1
  PROTOC_SHA256: c4bc672d9d49214dc8cafdceadf4df92182d6ca8e3ec65a56b2d7de5602669b4

jobs:
  test:
    name: cargo test + fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Mirrors `channel` in engine/rust-toolchain.toml and windows/rust-toolchain.toml.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install protoc ${{ env.PROTOC_VERSION }}
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/protoc.zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          echo "${PROTOC_SHA256}  $RUNNER_TEMP/protoc.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"

      # rust-toolchain.toml lists the iOS / macOS / Android targets as well;
      # rustup would install them all on first use. RUSTUP_TOOLCHAIN (job env
      # above) overrides the file, so only the host target is installed —
      # the one a test run links.
      - name: Install the toolchain (host target only)
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt --no-self-update
          cargo --version && rustc --version && protoc --version

      # Cached across runs by Cargo.lock hash. The workspace's own crates are
      # rebuilt every time; only dependencies come from the cache.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: engine

      # --no-fail-fast so one red crate does not hide the others' results.
      #
      # corpus_total_freq_matches_dictionary_csv is skipped, not fixed: it has
      # been red on main since 2026-08-29 because CORPUS_TOTAL_FREQ in
      # engine/composing/src/lattice/cost.rs was not updated with the rebuilt
      # dictionary.csv, and updating it moves the OOV cost — a candidate-ranking
      # change the maintainer has not signed off. Remove the --skip when the
      # constant is updated.
      - name: cargo test
        working-directory: engine
        run: cargo test --workspace --no-fail-fast -- --skip corpus_total_freq_matches_dictionary_csv

      # Both workspaces, one formatter. Windows crates are checked here rather
      # than compiled: rustfmt reads source, so it needs no Windows target.
      - name: cargo fmt --check (engine + windows)
        run: |
          set -euo pipefail
          cargo fmt --all --check --manifest-path engine/Cargo.toml
          cargo fmt --all --check --manifest-path windows/Cargo.toml
