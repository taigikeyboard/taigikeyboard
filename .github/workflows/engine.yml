name: Engine

# The shared Rust engine, gated on every change to it: tests, clippy, then
# formatting. The desktop-shared and Windows workspaces link the engine and are
# gated in desktop.yml, which an engine change also triggers; Linux gates its
# own in linux-build.yml, nightly — `make linux-check` before a Linux PR.
# Ubuntu only — the engine has no platform code, and
# the platform builds that link it (Xcode, Gradle, SwiftPM, the TSF DLL) stay on
# the maintainer's machines and the release runners; each needs a toolchain that
# would cost more runner time than the tests it would run.
#
# Budget: ~2 min with a warm cache, ~5 min cold (dependency compile). Nothing
# here needs a macOS or Windows runner.
on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate for automated dictionary refreshes
        type: string
        required: true
  pull_request:
    paths:
      - 'engine/**'
      - 'dictionary/output/dictionary.csv'
      - 'assets/dictionaries/**'
      - '.github/workflows/engine.yml'
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'dictionary/output/dictionary.csv'
      - 'assets/dictionaries/**'
      - '.github/workflows/engine.yml'

permissions:
  contents: read

concurrency:
  group: engine-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Same pin as windows-build.yml, for the same reason: engine/protos/build.rs
  # shells out to protoc, and the runner image has none.
  PROTOC_VERSION: 36.1
  PROTOC_SHA256: c4bc672d9d49214dc8cafdceadf4df92182d6ca8e3ec65a56b2d7de5602669b4

jobs:
  test:
    name: cargo test + fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Mirrors `channel` in engine/rust-toolchain.toml and windows/rust-toolchain.toml.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install protoc ${{ env.PROTOC_VERSION }}
        run: |
          set -euo pipefail
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 10 -o "$RUNNER_TEMP/protoc.zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          echo "${PROTOC_SHA256}  $RUNNER_TEMP/protoc.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"

      # rust-toolchain.toml lists the iOS / macOS / Android targets as well;
      # rustup would install them all on first use. RUSTUP_TOOLCHAIN (job env
      # above) overrides the file, so only the host target is installed —
      # the one a test run links.
      - name: Install the toolchain (host target only)
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
          cargo --version && rustc --version && protoc --version

      # Cached across runs by Cargo.lock hash. The workspace's own crates are
      # rebuilt every time; only dependencies come from the cache. Every
      # rust-cache step saves from main only: pull requests restore main's
      # entry instead of each adding ~1 GB of its own, which kept the repo at
      # the 10 GB Actions cache cap and evicted main's entries.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: engine
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # --no-fail-fast so one red crate does not hide the others' results.
      - name: cargo test
        working-directory: engine
        run: cargo test --workspace --no-fail-fast

      # Only the targets the feature changes: the lib (trace.rs's unit tests
      # are behind it) and tests/e2e_trace.rs (`#![cfg(feature = "e2e-trace")]`).
      # The rest of dispatch already ran feature-off in the step above.
      - name: cargo test (dispatch, e2e-trace on)
        working-directory: engine
        run: cargo test -p dispatch --features e2e-trace --lib --test e2e_trace

      # Same gate as `make lint`, engine half; desktop.yml runs the desktop half.
      - name: cargo clippy -D warnings (engine)
        run: cargo clippy --manifest-path engine/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: cargo fmt --check (engine)
        run: cargo fmt --all --check --manifest-path engine/Cargo.toml

  # engine/Cargo.toml's `rust-version` is a promise to anyone embedding the
  # engine, and the other workspaces' newer floors (1.93 desktop + linux,
  # 1.95 windows) never exercise it.
  # Read from the manifest so the check cannot drift from the declaration.
  msrv:
    name: cargo check on the declared rust-version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install protoc ${{ env.PROTOC_VERSION }}
        run: |
          set -euo pipefail
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 10 -o "$RUNNER_TEMP/protoc.zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          echo "${PROTOC_SHA256}  $RUNNER_TEMP/protoc.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"

      - name: Install the declared rust-version (host target only)
        run: |
          set -euo pipefail
          msrv="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' engine/Cargo.toml)"
          [ -n "$msrv" ] || { echo "::error::no rust-version in engine/Cargo.toml"; exit 1; }
          rustup toolchain install "$msrv" --profile minimal --no-self-update
          echo "RUSTUP_TOOLCHAIN=$msrv" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: engine
          key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo check --all-targets
        run: cargo check --manifest-path engine/Cargo.toml --workspace --all-targets --locked

  # docs/architecture/e2e-trace-schema.md § Test mode only.
  e2e-trace-guard:
    name: e2e trace stays out of release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install protoc ${{ env.PROTOC_VERSION }}
        run: |
          set -euo pipefail
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 10 -o "$RUNNER_TEMP/protoc.zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          echo "${PROTOC_SHA256}  $RUNNER_TEMP/protoc.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"

      - name: Install the toolchain (host target only)
        run: rustup toolchain install stable --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: engine
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: shipped feature graph has no e2e-trace
        working-directory: engine
        run: |
          set -euo pipefail
          # Every shipped crate that links `dispatch`; the desktop
          # workspaces add theirs in their own e2e PRs (macOS: macos.yml
          # `native`, which also runs on every engine change).
          for crate in swift-ffi android-jni; do
            if cargo tree -e features -i dispatch -p "$crate" | grep -q 'dispatch feature "e2e-trace"'; then
              echo "::error::$crate enables dispatch/e2e-trace by default"; exit 1
            fi
          done
          # Positive control: the grep sees the feature when it IS on.
          cargo tree -e features -i dispatch -p android-jni --features e2e-trace | grep -q 'dispatch feature "e2e-trace"'

      - name: release build carries the marker only when traced
        working-directory: engine
        run: |
          set -euo pipefail
          source scripts/lib/e2e-trace-guard.sh
          # One target dir: only dispatch + android-jni rebuild between the two.
          cargo build --release -p android-jni
          e2e_trace_assert_absent target/release/librust_taigi.so
          cargo build --release -p android-jni --features e2e-trace
          e2e_trace_assert_present target/release/librust_taigi.so
