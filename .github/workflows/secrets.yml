name: Secrets

# Kept separate from security.yml because the triggers differ: the dependency audit
# only cares about the engine's manifests, while a credential can be staged in any
# file, so this runs on every pull request and every push to main.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '30 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Superseding a pull request's earlier run is fine — the new run covers the whole
# branch again. The exception is a force-push, whose new range does not contain the
# commits the cancelled run was scanning; those are only reachable while the old
# objects survive. A push to main must never be cancelled: each of those runs scans
# only its own range, so cancelling one would leave those commits unscanned until
# Monday.
concurrency:
  group: secrets-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 is what makes a range and the watermark below resolvable.
      # The cost of it is not the commits, it is the blobs: .git is ~845 MB, nearly
      # all of it dead dictionary.db copies from before the format moved to
      # dictionary.bin, and an unfiltered fetch spent 42 s of PR #693's 50 s run
      # dragging them in for a scan that itself took 139 ms.
      #
      # blob:none is safe for every event here because no scan in this workflow
      # reads the whole history — each one covers a bounded set of commits and lets
      # the promisor fetch only the blobs those commits touch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      # Pinned by digest, not only by version: a security gate should not run
      # whatever the release URL happens to serve.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Version
        run: gitleaks version

      # A pull request or a push is scanned over its own commits. Everything older
      # is covered by .gitleaks-scanned's watermark — the last commit whose entire
      # history was scanned clean. History is immutable, so rescanning it under the
      # same rules finds nothing that run did not; what the weekly job scans
      # instead is every commit on every ref the watermark cannot reach, which is
      # also the net for anything a range could not see.
      #
      # That net has a limit worth stating: it reaches what the checkout can still
      # resolve. A commit pushed to a branch that is force-pushed away or deleted
      # before the weekly run, with no pull request open, is unreachable from every
      # surviving ref and no scan here will find it. A weekly full-history pass had
      # the same hole — it too could only read what still existed.
      #
      # scripts/gitleaks-scan.sh is the same entry point `make scan-secrets` uses,
      # and it enforces the baseline checks: the recorded gitleaks version must be
      # the installed one, and the recorded watermark must still exist.
      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -uo pipefail

          have() { [ -n "${1:-}" ] && git cat-file -e "$1^{commit}" 2>/dev/null; }

          # A range is only usable if both endpoints are present. A force-push can
          # leave `before` unreachable, and a ref deletion sends an all-zero SHA;
          # in either case fall back to the watermark scan, which reaches every ref.
          case "$EVENT" in
            pull_request) FROM="$PR_BASE";     TO="$PR_HEAD"    ;;
            push)         FROM="$PUSH_BEFORE"; TO="$PUSH_AFTER" ;;
            *)            FROM="";             TO=""            ;;
          esac

          if have "$FROM" && have "$TO"; then
            ./scripts/gitleaks-scan.sh "$FROM..$TO"
          else
            if [ -n "$FROM$TO" ]; then
              echo "::warning::$EVENT endpoints not both present — scanning against the watermark instead"
            fi
            ./scripts/gitleaks-scan.sh
          fi
