name: Secrets

# Kept separate from security.yml because the triggers differ: the dependency audit
# only cares about the engine's manifests, while a credential can be staged in any
# file, so this runs on every pull request and every push to main.

# Automatic triggers are off while the cost is being worked down. Measured on the
# run that opened PR #693: 50 s total, of which the checkout was 42 s and the scan
# itself 139 ms — nearly all of it fetching dead dictionary.db blobs that
# `fetch-depth: 0` drags in. Turn these back on once the checkout is cheap
# (`filter: blob:none`, or a shallower fetch of just the range endpoints).
#
# Until then this runs on demand only, and the local gate is .githooks/pre-commit
# via `make hooks`.
on:
  workflow_dispatch:
  # pull_request:
  # push:
  #   branches: [main]
  # schedule:
  #   - cron: '30 0 * * 1'

permissions:
  contents: read

# Superseding a pull request's earlier run is fine — the new run covers the whole
# branch again. A push must never be cancelled: each push run scans only its own
# range, so cancelling one would leave those commits unscanned until Monday.
concurrency:
  group: secrets-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Pinned by digest, not only by version: a security gate should not run
      # whatever the release URL happens to serve.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Version
        run: gitleaks version

      # A pull request or a push is scanned over its own commits; the whole history
      # is 851 MB and rescanning it per event would dominate the run. Monday's
      # scheduled run covers everything, and is also the net for anything a range
      # could not reach.
      #
      # Merge commits are included deliberately: a conflict resolution can
      # introduce a line that exists in neither parent.
      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -uo pipefail

          # gitleaks reports a finding and its own errors both as 1 by default.
          # --exit-code 2 separates them so a broken config cannot read as a pass,
          # and a finding cannot read as a crash.
          scan() {
            local status=0
            gitleaks git --no-banner --redact -v --exit-code 2 "$@" || status=$?
            case "$status" in
              0) echo "No findings." ;;
              2) echo "::error::gitleaks found a credential. Rotate it, then remove it from the branch."; exit 1 ;;
              *) echo "::error::gitleaks failed to run (exit $status) — nothing was scanned."; exit 1 ;;
            esac
          }

          # A range is only usable if both endpoints are present. A force-push can
          # leave `before` unreachable, and a ref deletion sends an all-zero SHA;
          # in either case fall back to the full history rather than failing on a
          # range that does not resolve.
          have() { [ -n "${1:-}" ] && git cat-file -e "$1^{commit}" 2>/dev/null; }

          case "$EVENT" in
            pull_request)
              if have "$PR_BASE" && have "$PR_HEAD"; then
                echo "Scanning $PR_BASE..$PR_HEAD"
                scan --log-opts="$PR_BASE..$PR_HEAD"
              else
                echo "Pull-request endpoints not both present — scanning full history"
                scan
              fi
              ;;
            push)
              if have "$PUSH_BEFORE" && have "$PUSH_AFTER"; then
                echo "Scanning $PUSH_BEFORE..$PUSH_AFTER"
                scan --log-opts="$PUSH_BEFORE..$PUSH_AFTER"
              else
                echo "Push endpoints not both present — scanning full history"
                scan
              fi
              ;;
            *)
              echo "Scanning full history"
              scan
              ;;
          esac
