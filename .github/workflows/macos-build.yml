name: macOS build

# The macOS half of a desktop release: build, sign, notarize and attach the
# `.pkg` to the `desktop-<version>` draft (docs/architecture/macos-release.md
# § Cutting a release). Dispatched from `main` by `tools/release/stage-desktop.sh`
# with the commit it staged (a hotfix patch). The monthly train
# (desktop-train.yml) calls it with `build_only` and signs in its own
# `sign-and-beta` job, through the same composite action. A pull request
# touching this workflow or the release scripts runs the `build` job alone.
#
# Two jobs on two machines, so no credential is ever on a machine that ran
# third-party code. `build` compiles every crate's build script and every
# SwiftPM package with no secret and a read-only token; `release` gets the
# Developer ID certificates and the notary key, on a fresh VM, and runs only
# Apple's tools and this repository's scripts on the bundle `build` produced —
# nothing it executes was compiled in this run.
#
# Budget: ~20 min build (two release slices, fat LTO, no cache) + ~5 min
# release (signing, notarization wait).
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: The commit stage-desktop.sh staged; the run refuses any other
        required: true
        type: string
  workflow_call:
    inputs:
      source_sha:
        description: The commit to build (the train's release commit)
        required: true
        type: string
      build_only:
        description: Build and upload the bundle; sign and attach nothing
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/macos-build.yml'
      - 'macos/scripts/bundle-app.sh'
      - 'macos/scripts/release-app.sh'

permissions: {}

concurrency:
  group: macos-build-${{ inputs.source_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned, not the image default, so a runner image update cannot change the
  # SDK a release links against. macos-26 carries GA Xcode 26.x only;
  # KeyboardShortcuts needs Swift 6.2+ (macos.yml says why).
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  # No secret, no environment, a read-only token, no token on disk.
  build:
    name: release bundle (no credentials)
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # Same protoc as macos.yml (engine/protos/build.rs shells out to it).
      PROTOC_VERSION: 36.1
      PROTOC_SHA256: de56d57afe30c5d191b11d24ff93dd4025728d7fb43b773886b2d3613e0bdbb2
    steps:
      # The staged commit, not whatever the run's ref points at by now.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Install protoc ${{ env.PROTOC_VERSION }}
        run: |
          set -euo pipefail
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 10 -H "Authorization: Bearer ${{ github.token }}" -o "$RUNNER_TEMP/protoc.zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-osx-aarch_64.zip"
          echo "${PROTOC_SHA256}  $RUNNER_TEMP/protoc.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"

      # Both macOS targets, from macos/rust-toolchain.toml.
      - name: Install the toolchain (macos/rust-toolchain.toml)
        working-directory: macos
        run: |
          set -euo pipefail
          rustup toolchain install --no-self-update
          rustup target list --installed
          xcodebuild -version && swift --version && protoc --version

      - name: Build the engine xcframework (universal)
        run: make macos-libs

      # Every assembly check of a release bundle, both slices, ad-hoc signed.
      - name: bundle-app.sh release
        run: bash macos/scripts/bundle-app.sh release

      - name: Verify the build changed nothing tracked
        run: |
          status="$(git status --porcelain --ignore-submodules=none)"
          [ -z "$status" ] || { echo "$status"; echo "::error::the build modified tracked files"; exit 1; }

      # tar, because the artifact store drops the executable bit and symlinks.
      - name: Pack the bundle
        if: inputs.source_sha != ''
        run: tar -C macos/.build/bundle -cf "$RUNNER_TEMP/bundle.tar" TaigiKeyboard.app

      # Kept as long as the train's second approval may wait (an environment
      # approval expires after 30 days).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.source_sha != ''
        with:
          name: macos-bundle
          path: ${{ runner.temp }}/bundle.tar
          if-no-files-found: error
          retention-days: 30

  # The credentials, on a machine that compiles nothing.
  release:
    name: sign, notarize, attach
    needs: build
    if: >-
      inputs.source_sha != '' && !inputs.build_only &&
      github.repository == 'taigikeyboard/taigikeyboard' &&
      github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 30
    environment: release
    permissions:
      # generate-notes, the draft read, the upload — in the steps given the token.
      contents: write
    steps:
      # Before the checkout: the scripts that will hold the Developer ID keys
      # come from the staged commit, so it must be one `main` has reviewed.
      - name: Check the commit is on main
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$SOURCE_SHA" --jq .status)"
          case "$status" in
            identical | behind) ;;
            *) echo "::error::$SOURCE_SHA is not on main (compare: $status) — only a reviewed commit is signed"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - uses: ./.github/actions/macos-sign-attach
        with:
          source-sha: ${{ inputs.source_sha }}
          github-token: ${{ github.token }}
          application-p12: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12 }}
          installer-p12: ${{ secrets.MACOS_DEVELOPER_ID_INSTALLER_P12 }}
          p12-password: ${{ secrets.MACOS_P12_PASSWORD }}
          api-key-p8: ${{ secrets.APPLE_API_KEY_P8 }}
          api-key-id: ${{ vars.APPLE_API_KEY_ID }}
          api-issuer-id: ${{ vars.APPLE_API_ISSUER_ID }}
