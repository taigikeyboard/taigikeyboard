name: Security (Windows)

# cargo deny over the Windows workspace (`windows/deny.toml`), split out of
# security.yml because of its cost, not its rules. The workspace pins windows-rs
# by git rev, and `cargo metadata` must fetch that repository's whole history
# (~1.3 GB) to resolve it: 4–5 min of a job whose other checks take seconds
# (PR #756: 286 s of 304 s). Caching the git db would park 1.3 GB in a 10 GB
# Actions cache for a check that runs a few times a month.
#
# Gated on what can change its verdict: the Windows manifests and lockfile, its
# deny.toml, and the engine / desktop manifests its path dependencies come from
# (their licence fields and the wildcard-path exemption). Advisories are covered
# for every workspace by security.yml's cargo audit, which keeps windows/.
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'windows/Cargo.lock'
      - 'windows/deny.toml'
      - 'windows/**/Cargo.toml'
      - 'engine/**/Cargo.toml'
      - 'desktop/**/Cargo.toml'
      - '.github/workflows/security-windows.yml'
  push:
    branches: [main]
    paths:
      - 'windows/Cargo.lock'
      - 'windows/deny.toml'
      - 'windows/**/Cargo.toml'
      - 'engine/**/Cargo.toml'
      - 'desktop/**/Cargo.toml'
      - '.github/workflows/security-windows.yml'

permissions:
  contents: read

concurrency:
  group: security-windows-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deny:
    name: cargo deny (windows)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # windows/rust-toolchain.toml lists the Windows targets; this job compiles
      # nothing, so the runner image's stable is enough (security.yml's reason).
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            engine
            windows
            desktop

      - name: Install cargo-deny (prebuilt)
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-deny

      - name: cargo deny check (windows)
        working-directory: windows
        run: cargo deny check
