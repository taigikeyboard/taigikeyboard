name: macOS

# The macOS input method's Swift suite (`make -C macos test`: i18n check +
# `swift test`) against an engine built from the same commit. Not a required
# check.
#
# Runner: macos-26 (arm64), whose default Xcode is 26.x. KeyboardShortcuts
# 3.1.0's manifest is swift-tools 6.2 (see macos/Package.swift), so package
# resolution needs Swift 6.2+ — macos-15 defaults to Xcode 16.4 (Swift 6.1)
# and would need an explicit Xcode switch that breaks whenever the image drops
# that Xcode. The public repo runs macOS minutes free.
#
# The engine is built for the runner's architecture only
# (TAIGI_MACOS_TARGETS): `swift test` links one slice, and the second
# release + LTO build of swift-ffi would roughly double the Rust time. The
# universal build stays with `make build` / the release pipeline.
on:
  pull_request:
    paths:
      - 'macos/**'
      - 'desktop/**'
      - 'engine/**'
      - '!engine/android-jni/**'
      - '!engine/build-helpers/fst-builder/**'
      - 'assets/dictionaries/**'
      - 'i18n/**'
      - 'tools/i18n/**'
      - 'assets/symbols/**'
      - 'assets/fonts/font/**'
      - '.github/workflows/macos.yml'
  push:
    branches: [main]
    paths:
      - 'macos/**'
      - 'desktop/**'
      - 'engine/**'
      - '!engine/android-jni/**'
      - '!engine/build-helpers/fst-builder/**'
      - 'assets/dictionaries/**'
      - 'i18n/**'
      - 'tools/i18n/**'
      - 'assets/symbols/**'
      - 'assets/fonts/font/**'
      - '.github/workflows/macos.yml'

permissions:
  contents: read

concurrency:
  group: macos-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Same protoc as engine.yml (engine/protos/build.rs shells out to it for
  # prost), macOS arm64 build of the release.
  PROTOC_VERSION: 36.1
  PROTOC_SHA256: de56d57afe30c5d191b11d24ff93dd4025728d7fb43b773886b2d3613e0bdbb2

jobs:
  test:
    name: macOS swift test
    runs-on: macos-26
    timeout-minutes: 40
    env:
      # Overrides macos/rust-toolchain.toml's target list (both macOS
      # architectures), so only the host target — the one built here — is installed.
      RUSTUP_TOOLCHAIN: stable
      TAIGI_MACOS_TARGETS: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install protoc ${{ env.PROTOC_VERSION }}
        run: |
          set -euo pipefail
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 10 -o "$RUNNER_TEMP/protoc.zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-osx-aarch_64.zip"
          echo "${PROTOC_SHA256}  $RUNNER_TEMP/protoc.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"

      - name: Install the toolchain (host target only)
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          cargo --version && rustc --version && protoc --version
          xcodebuild -version && swift --version

      # The archive builds in the macOS workspace (macos/target), not the engine's.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: macos
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the engine xcframework (arm64)
        run: bash engine/scripts/build-macos-xcframework.sh

      - name: make -C macos test
        run: make -C macos test

  # The macOS Cargo workspace (`macos/`: the `taigi-macos-ffi` archive) on its
  # own, gated like desktop.yml gates `desktop/`: native tests, clippy, fmt —
  # the steps of `make macos-rust-check` — plus the e2e-trace feature-graph
  # guard. Ubuntu, as for engine.yml and desktop.yml: the crate has no
  # platform code, and no step here builds the xcframework.
  native:
    name: macOS Rust (test, clippy, fmt, trace guard)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Overrides macos/rust-toolchain.toml's darwin target list.
      RUSTUP_TOOLCHAIN: stable
      # The linux-x86_64 zip's, as in engine.yml (the workflow's is the macOS one).
      PROTOC_SHA256: c4bc672d9d49214dc8cafdceadf4df92182d6ca8e3ec65a56b2d7de5602669b4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install protoc ${{ env.PROTOC_VERSION }}
        run: |
          set -euo pipefail
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 10 -o "$RUNNER_TEMP/protoc.zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          echo "${PROTOC_SHA256}  $RUNNER_TEMP/protoc.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"

      - name: Install the toolchain (host target only)
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
          cargo --version && rustc --version && protoc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: macos
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo test (macos)
        run: cargo test --manifest-path macos/Cargo.toml --workspace --locked --no-fail-fast

      # Same gate as `make lint`, macOS half.
      - name: cargo clippy -D warnings (macos)
        run: cargo clippy --manifest-path macos/Cargo.toml --workspace --all-targets --locked -- -D warnings

      # Plain fmt, never `--all`: `--all` also checks the engine crates (path
      # dependencies), which engine.yml gates.
      - name: cargo fmt --check (macos)
        run: cargo fmt --check --manifest-path macos/Cargo.toml

      # docs/architecture/e2e-trace-schema.md § Test mode only — the macOS
      # half of engine.yml's `e2e-trace-guard`. The archive's engine edges set
      # their own features (`default-features = false` + `user-data`), so
      # swift-ffi's graph there is not the one this archive ships.
      - name: shipped feature graph has no e2e-trace
        run: |
          set -euo pipefail
          traced() {
            cargo tree --manifest-path macos/Cargo.toml -e features -i dispatch -p taigi-macos-ffi "$@" \
              | grep -q 'dispatch feature "e2e-trace"'
          }
          if traced; then
            echo "::error::taigi-macos-ffi enables dispatch/e2e-trace by default"; exit 1
          fi
          # Positive control: the grep sees the feature when it IS on.
          traced --features e2e-trace

  # macos/Cargo.toml's `rust-version` (the floor of the desktop crates it
  # links); `native` above runs stable and never exercises it. Read from the
  # manifest, as engine.yml's and desktop.yml's `msrv` do.
  msrv:
    name: macOS Rust on the declared rust-version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PROTOC_SHA256: c4bc672d9d49214dc8cafdceadf4df92182d6ca8e3ec65a56b2d7de5602669b4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install protoc ${{ env.PROTOC_VERSION }}
        run: |
          set -euo pipefail
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 10 -o "$RUNNER_TEMP/protoc.zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          echo "${PROTOC_SHA256}  $RUNNER_TEMP/protoc.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"

      - name: Install the declared rust-version (host target only)
        run: |
          set -euo pipefail
          msrv="$(sed -n 's/^rust-version = "\([^"]*\)".*/\1/p' macos/Cargo.toml)"
          [ -n "$msrv" ] || { echo "::error::no rust-version in macos/Cargo.toml"; exit 1; }
          rustup toolchain install "$msrv" --profile minimal --no-self-update
          echo "RUSTUP_TOOLCHAIN=$msrv" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: macos
          key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo check --all-targets
        run: cargo check --manifest-path macos/Cargo.toml --workspace --all-targets --locked
