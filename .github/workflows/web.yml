name: Web

# The web version's gates: `make web-check`'s steps (the wasm build and the Node
# smoke test over the real dictionaries in `check`; clippy, biome and fmt in the
# parallel `lint` job, so neither waits on the other) and Playwright in Chromium
# over the staged site, using the official image's browsers and system libraries.
# An engine, desktop-shared or dictionary change triggers it too, because
# `taigi-web` links those crates and
# asserts top candidates against that data; a font or string change, because the
# page ships them; the iOS app icon too. A push to main runs the gates only; the
# site deploys hourly, from main's head, when that head passes the gates and
# differs from the last scheduled run's. A manual run on main gates and deploys
# main's head unconditionally (docs/architecture/web-release.md).
on:
  schedule:
    # Not minute 0. GitHub's scheduler is busiest at the top of the hour, when
    # it delays scheduled runs and, under enough load, drops them: at '0 * * * *'
    # only about one run a day started (11-08 to 11-11), then none for 38 hours.
    # Minutes on a multiple of 5 are where everyone else's crons pile up too,
    # so 17 was drawn at random from the rest. Keep it off those minutes.
    - cron: '17 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'web/**'
      - 'desktop/**'
      - 'engine/**'
      - 'assets/dictionaries/**'
      - 'assets/fonts/**'
      - 'assets/symbols/**'
      - 'ios/Sources/TaigiKeyboard/App/Assets/Assets.xcassets/AppIcon.appiconset/**'
      - 'i18n/**'
      - 'mise.toml'
      - '.github/workflows/web.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'desktop/**'
      - 'engine/**'
      - 'assets/dictionaries/**'
      - 'assets/fonts/**'
      - 'assets/symbols/**'
      - 'ios/Sources/TaigiKeyboard/App/Assets/Assets.xcassets/AppIcon.appiconset/**'
      - 'i18n/**'
      - 'mise.toml'
      - '.github/workflows/web.yml'

permissions:
  contents: read

concurrency:
  group: web-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A scheduled run whose head the last successful scheduled run already had
  # deploys nothing: that run deployed it, or skipped it for the same reason.
  changed:
    name: main moved since last scheduled run
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      moved: ${{ steps.compare.outputs.moved }}
    steps:
      - id: compare
        run: |
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow web.yml --event schedule \
            --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          if [ "$last" = "$GITHUB_SHA" ]; then moved=false; else moved=true; fi
          echo "last scheduled: ${last:-none}, head: $GITHUB_SHA, moved: $moved"
          echo "moved=$moved" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  check:
    name: wasm build + smoke + Playwright
    needs: changed
    if: ${{ !cancelled() && (needs.changed.result == 'skipped' || needs.changed.outputs.moved == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # Only what the gate runs. The versions are mise.toml's, the same pins a
      # contributor installs; protoc is there because engine/protos/build.rs
      # shells out to it; uv is what mise installs fonttools with; zig compiles
      # and archives SQLite's wasm objects (web/Makefile).
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.2
          install_args: protoc github:wasm-bindgen/wasm-bindgen github:WebAssembly/binaryen biome uv pipx:fonttools zig
          cache_save: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the toolchain (web/rust-toolchain.toml)
        working-directory: web
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: web
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The subset fonts (19 MB) take ~50 s of pyftsubset in `make -C web site`
      # and change only with their inputs (web/Makefile's
      # `$(FONTS)/.stamp` rule; fonttools' pin is in mise.toml). After
      # rust-cache, which owns the rest of web/target.
      - id: fonts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/target/fonts
          key: web-fonts-${{ hashFiles('assets/fonts/font/**', 'web/scripts/subset-fonts.sh', 'web/src/fonts.css', 'web/Makefile', 'mise.toml') }}

      # The checkout gave every input a newer mtime than the restored stamp.
      - name: Mark the restored fonts current
        if: steps.fonts.outputs.cache-hit == 'true'
        run: touch web/target/fonts/.stamp

      # `make web-check` minus `lint`, which the `lint` job runs.
      - name: make -C web test smoke
        run: make -C web test smoke

      # The ChromeOS input method's store zip, over the wasm `smoke` just
      # built; the release builds it in chromeos-build.yml.
      - name: make -C web chromeos
        run: make -C web chromeos

      - name: Stage the site
        run: make -C web site

      - name: Stage the browser extension
        run: make -C web extension extension-fixtures

      # The image includes system libraries, avoiding apt and Ubuntu mirror DNS
      # outages at test time. Match the installed
      # package exactly, since each Playwright version needs its own browsers.
      # Rust and mise stay on the host; only the browser tests use the image.
      - name: Playwright (Chromium)
        run: |
          version=$(node --print 'require("./web/node_modules/@playwright/test/package.json").version')
          docker run --rm --init --ipc=host \
            --env CI=true \
            --volume "$PWD/web:/work" --workdir /work \
            "mcr.microsoft.com/playwright:v${version}-noble" \
            npx --no-install playwright test --project=chromium

      - name: Playwright browser extension (Chromium)
        run: |
          version=$(node --print 'require("./web/node_modules/@playwright/test/package.json").version')
          docker run --rm --init --ipc=host \
            --env CI=true \
            --volume "$PWD/web:/work" --workdir /work \
            "mcr.microsoft.com/playwright:v${version}-noble" \
            npx --no-install playwright test --config extension/playwright.config.mjs

  # `make -C web lint`: clippy over the wasm target compiles a dev build of its
  # own (~45 s), which `check`'s release build cannot share, so it runs beside it.
  lint:
    name: clippy + biome + fmt
    needs: changed
    if: ${{ !cancelled() && (needs.changed.result == 'skipped' || needs.changed.outputs.moved == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # protoc for engine/protos/build.rs, zig for SQLite's C, biome for the
      # page's JS; the same install as `check`, so both share mise's cache.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.2
          install_args: protoc github:wasm-bindgen/wasm-bindgen github:WebAssembly/binaryen biome uv pipx:fonttools zig
          cache_save: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the toolchain (web/rust-toolchain.toml)
        working-directory: web
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: web
          key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: make -C web lint
        run: make -C web lint

  deploy:
    name: Deploy
    needs: [check, lint]
    # Results named, not the implicit success(): that also looks at `changed`,
    # which a dispatch skips, so a dispatch never deployed. A scheduled run
    # whose head did not move skips check and lint, and so this job.
    if: >-
      ${{ !cancelled() &&
      needs.check.result == 'success' && needs.lint.result == 'success' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Secret in an environment that only `main` may use: a pushed branch
    # cannot read it (repository secrets reach every branch).
    environment: web-deploy
    steps:
      - name: Start the deploy in taigikeyboard/web
        run: gh workflow run deploy.yml --repo taigikeyboard/web
        env:
          GH_TOKEN: ${{ secrets.WEB_DEPLOY_TOKEN }}
