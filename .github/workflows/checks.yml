name: Checks

# The gates that need no compiler: generated i18n artifacts are current, the
# i18n codegen's own tests pass, Swift formatting matches .swiftformat, and
# the e2e analyzer's tests pass over the committed scenarios.
# Everything here reads files; the whole job is well under a minute.
#
# Swift is linted here on Linux rather than on a macOS runner because
# swiftformat parses source without building it — the macOS toolchain would
# cost minutes to set up for a check that takes seconds.
on:
  pull_request:
    paths:
      - 'i18n/**'
      - 'tools/i18n/**'
      - 'ios/Localizable.xcstrings'
      - 'ios/**/*.swift'
      - 'ios/.swift-version'
      - 'macos/**/*.swift'
      - '.swiftformat'
      - 'e2e/**'
      - 'tools/e2e/**'
      - 'engine/protos/proto/**'
      - 'engine/scripts/gen-platform-protos.sh'
      - 'android/app/src/main/java/com/siansiansu/taigikeyboard/engine/proto/**'
      - 'android/app/build.gradle.kts'
      - '.github/workflows/checks.yml'
  push:
    branches: [main]
    paths:
      - 'i18n/**'
      - 'tools/i18n/**'
      - 'ios/Localizable.xcstrings'
      - 'ios/**/*.swift'
      - 'ios/.swift-version'
      - 'macos/**/*.swift'
      - '.swiftformat'
      - 'e2e/**'
      - 'tools/e2e/**'
      - 'engine/protos/proto/**'
      - 'engine/scripts/gen-platform-protos.sh'
      - 'android/app/src/main/java/com/siansiansu/taigikeyboard/engine/proto/**'
      - 'android/app/build.gradle.kts'
      - '.github/workflows/checks.yml'

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The version the maintainer's machine runs. Rules change between releases,
  # so an unpinned lint would disagree with `swiftformat ios macos` locally.
  SWIFTFORMAT_VERSION: 0.63.0
  SWIFTFORMAT_SHA256: b4a3cbb8c852a0baaf9adf853e221ff1dabf921a3d8957a602e0bda3af8470f1
  # The Java bindings' compiler — must equal the protobuf-javalite pin
  # (android/app/build.gradle.kts), which gen-platform-protos.sh --java-only
  # enforces. Not engine.yml's 36.1: that one only feeds prost.
  PROTOC_JAVA_VERSION: "36.2"
  PROTOC_JAVA_SHA256: 121f6c7afe1d4d0e3ea6aab9432038599250134cbf4474cb1167d2c7decd4278

jobs:
  e2e-analyzer:
    name: e2e analyzer tests + scenarios
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Analyzer unit tests (also validate e2e/scenarios)
        working-directory: tools/e2e
        run: python3 -m unittest analyze_test

  i18n:
    name: i18n generated + codegen tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Codegen unit tests
        run: python3 tools/i18n/test_i18n.py

      # Same check Gradle's `checkI18nGenerated` runs before every Android
      # build: the committed outputs must match what i18n/*.json generates.
      - name: Generated artifacts are current
        run: python3 tools/i18n/check.py

  swiftformat:
    name: swiftformat --lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install swiftformat ${{ env.SWIFTFORMAT_VERSION }}
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat_linux.zip"
          echo "${SWIFTFORMAT_SHA256}  $RUNNER_TEMP/swiftformat.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          unzip -q "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/bin"
          mv "$RUNNER_TEMP/bin/swiftformat_linux" "$RUNNER_TEMP/bin/swiftformat"
          chmod +x "$RUNNER_TEMP/bin/swiftformat"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          # GITHUB_PATH takes effect in the next step, not this one.
          "$RUNNER_TEMP/bin/swiftformat" --version

      # One directory per invocation: swiftformat reads `--lint ios macos` as a
      # value for --lint and refuses it.
      - name: Lint
        run: |
          set -euo pipefail
          swiftformat --lint ios
          swiftformat --lint macos

  # The committed protobuf bindings match engine/protos/proto/. Java is
  # regenerated and compared — the same .proto drives Java and Swift, so a
  # forgotten `make protos` shows here. protoc-gen-swift has no Linux binary, so
  # Swift is checked structurally: one .pb.swift per .proto, and the iOS and
  # macOS copies identical (both come from the same generator and options).
  protos:
    name: protobuf bindings current
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install protoc ${{ env.PROTOC_JAVA_VERSION }}
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/protoc.zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_JAVA_VERSION}/protoc-${PROTOC_JAVA_VERSION}-linux-x86_64.zip"
          echo "${PROTOC_JAVA_SHA256}  $RUNNER_TEMP/protoc.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"

      # Emptied first, so a binding whose .proto was deleted shows as a deletion.
      - name: Java bindings are current
        run: |
          set -euo pipefail
          java_dir=android/app/src/main/java/com/siansiansu/taigikeyboard/engine/proto
          rm -rf "$java_dir"
          bash engine/scripts/gen-platform-protos.sh --java-only
          if [ -n "$(git status --porcelain -- "$java_dir")" ]; then
            git status --short -- "$java_dir"
            echo "::error::Java protobuf bindings are stale — run \`make protos\` (protoc 36.2) and commit the result."
            exit 1
          fi

      - name: Swift bindings cover every .proto
        run: |
          set -euo pipefail
          ios=ios/Sources/TaigiKeyboard/Engine/Generated
          mac=macos/Sources/TaigiInputMethodCore/Engine/Generated
          protos=$(cd engine/protos/proto && ls *.proto | sed 's/\.proto$//' | sort)
          swift=$(cd "$ios" && ls *.pb.swift | sed 's/\.pb\.swift$//' | sort)
          if [ "$protos" != "$swift" ]; then
            diff <(echo "$protos") <(echo "$swift") || true
            echo "::error::$ios needs exactly one .pb.swift per .proto — run \`make protos\`."
            exit 1
          fi
          if ! diff -r "$ios" "$mac" >/dev/null; then
            diff -rq "$ios" "$mac" || true
            echo "::error::iOS and macOS Swift bindings differ — run \`make protos\` to regenerate both."
            exit 1
          fi

