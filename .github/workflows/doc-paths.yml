name: Doc paths

# Every repo path a living doc names still exists (tools/doc_paths.py), so an
# agent sent to a file by AGENTS.md, a contributing guide or a skill finds it.
# No path filter: moving or deleting any file can kill a doc's path. Reads
# files only; seconds.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: doc-paths-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  paths:
    name: Living docs name existing paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Gate unit tests
        working-directory: tools
        run: python3 -m unittest doc_paths_test

      - name: make lint-doc-paths
        run: make lint-doc-paths
