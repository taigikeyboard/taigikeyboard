name: PR notify Discord

# Posts one Discord message when a PR is opened or closed (merged / closed).
# New commits on a PR (`synchronize`) do not trigger this workflow.
# `pull_request_target` so fork PRs can read the webhook secret; the job never
# checks out PR code, and PR text reaches the shell only through env vars.
on:
  pull_request_target:
    types: [opened, closed]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_PR_WEBHOOK }}
          ACTION: ${{ github.event.action }}
          MERGED: ${{ github.event.pull_request.merged }}
          NUMBER: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          URL: ${{ github.event.pull_request.html_url }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::DISCORD_PR_WEBHOOK not set; skipping"
            exit 0
          fi
          if [ "$ACTION" = opened ]; then
            status="Opened by $AUTHOR"; color=3066993      # green
          elif [ "$MERGED" = true ]; then
            status="Merged by $ACTOR"; color=10181046      # purple
          else
            status="Closed by $ACTOR"; color=15158332      # red
          fi
          jq -n --arg title "#$NUMBER $TITLE" --arg url "$URL" \
                --arg desc "$status" --argjson color "$color" \
            '{allowed_mentions: {parse: []},
              embeds: [{title: ($title | .[0:256]), url: $url,
                        description: $desc, color: $color}]}' \
          | curl -fsS -H 'Content-Type: application/json' -d @- "$WEBHOOK"
