name: Desktop beta

# Puts a staged desktop draft on the unlisted https://taigikeyboard.tw/beta page
# for internal testers. Dispatched by tools/release/stage-desktop.sh (a hotfix
# patch), or by hand to retry a failed beta; the monthly train
# (desktop-train.yml) runs the same composite action in its `sign-and-beta`
# job. Waits for the `release` environment's reviewer (roadmap D5). What and
# why: tools/release/beta-release.sh.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Desktop version of the draft (x.y.z)
        required: true
      release_id:
        description: The draft's release id (stage-desktop.sh passes it)
        required: true
      source_sha:
        description: The commit the draft was staged from
        required: true

permissions:
  contents: read

# A newer staging run supersedes an older beta. Its own group, never announce's:
# cancelling there would drop an announcement.
concurrency:
  group: desktop-beta
  cancel-in-progress: true

jobs:
  beta:
    name: mirror draft to /beta
    if: >-
      github.repository == 'taigikeyboard/taigikeyboard' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: release
    # Reading a draft needs push access; only the fetch step holds this token.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/desktop-beta
        with:
          # Through the action's env, never expanded into a script: dispatch
          # inputs are free text.
          version: ${{ inputs.version }}
          release-id: ${{ inputs.release_id }}
          source-sha: ${{ inputs.source_sha }}
          github-token: ${{ github.token }}
          site-token: ${{ secrets.SITE_CONTENTS_TOKEN }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          discord-webhook: ${{ secrets.DISCORD_BETA_WEBHOOK }}
