version: 2
updates:
  - package-ecosystem: cargo
    directory: /engine
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust
    ignore:
      # rusqlite 0.42 requires sqlite-wasm-rs >=0.6.3 on wasm32, whose memory
      # VFS handle is only `unsafe fn MemVfsUtil::get()`; the web workspace
      # forbids `unsafe_code` (see /web below). Stays on 0.41 (maintainer
      # 2026-11-16; #955 #957 #965 closed). Same entry in /windows, /web,
      # /linux: their lockfiles carry the engine's rusqlite.
      - dependency-name: rusqlite
        versions: [">=0.42"]
    groups:
      cargo-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /windows
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust
    groups:
      cargo-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # windows-rs publishes its sub-crates ahead of the `windows` umbrella
      # crate, so a sub-crate major that the umbrella does not yet depend on
      # cannot be taken: the TSF `#[implement]` macros would expand against the
      # new windows-core while the interfaces still come from the old `windows`.
      # The whole family moves in one deliberate bump, together with the
      # `windows-reactor` git rev pinned in windows/Cargo.toml. Closed as PRs
      # #9 and #10 on 2026-09-07.
      - dependency-name: windows-core
        update-types:
          - version-update:semver-major
      - dependency-name: windows-numerics
        update-types:
          - version-update:semver-major
      - dependency-name: windows-sys
        update-types:
          - version-update:semver-major
      # sha2 0.11 is the RustCrypto breaking line: no `io::Write` on the hasher
      # and a `hybrid_array::Array` output with no `LowerHex`, which is both
      # halves of `file_sha256` in taigi-windows-update. 0.10 is maintained and
      # this is the repository's only sha2 call site. Closed as PR #8.
      - dependency-name: sha2
        update-types:
          - version-update:semver-major
      # Stays on the engine's rusqlite 0.41 (see /engine).
      - dependency-name: rusqlite
        versions: [">=0.42"]

  # The desktop-shared crates (Windows + Linux link them) and the Linux input
  # method each keep their own Cargo.lock, so each needs its own entry.
  - package-ecosystem: cargo
    directory: /desktop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust
    ignore:
      # Stays on the engine's rusqlite 0.41 (see /engine; #1083 closed).
      - dependency-name: rusqlite
        versions: [">=0.42"]
    groups:
      cargo-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust
    ignore:
      # Moves together with the CLI pin in mise.toml (web-guidelines.md).
      - dependency-name: wasm-bindgen
      # 0.6 hands out the memory-VFS handle only through `unsafe fn
      # MemVfsUtil::get()`; the web workspace forbids `unsafe_code`.
      # rusqlite 0.41 accepts 0.5 (#813 closed).
      - dependency-name: sqlite-wasm-rs
        versions: [">=0.6"]
      # rusqlite 0.42 needs sqlite-wasm-rs 0.6 (see /engine).
      - dependency-name: rusqlite
        versions: [">=0.42"]
    groups:
      cargo-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 3
    labels:
      - dependencies
    ignore:
      # CodeMirror 5 is a deliberate extension E2E fixture (`codemirror5.html`,
      # web/Makefile `extension-fixtures`); CM6 is tested through the
      # `@codemirror/*` packages. The `codemirror` 6 meta package would drop
      # the CM5 fixture (#962 closed).
      - dependency-name: codemirror
        update-types:
          - version-update:semver-major
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /linux
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust
      - linux
    ignore:
      # Stays on the engine's rusqlite 0.41 (see /engine).
      - dependency-name: rusqlite
        versions: [">=0.42"]
    groups:
      cargo-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - android
    groups:
      gradle-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    groups:
      gh-actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
