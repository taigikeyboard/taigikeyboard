name: Translation suggestion（翻譯建議）
description: Better wording for a piece of text the app shows.
title: "[i18n] "
labels: ["i18n"]
body:
  - type: markdown
    attributes:
      value: |
        Write in Taiwanese, Mandarin, English, or Japanese. 台語、華語、英文抑是日文攏會使。
        Start from https://taigikeyboard.tw/translate/. Its Fix buttons fill in the title and this form for you. The title names the text, so keep it as filled in.
        請對 https://taigikeyboard.tw/translate/ 揤「修正」開始，標題會自動填好，請毋通改。

        Sending this form opens a pull request automatically, signed with your GitHub account. The suggested text is submitted exactly as written, so put explanations under Why.
        送出了後會自動開 PR，用你的 GitHub 帳號署名。建議的文字會照你寫的提交，說明請寫佇「原因」。
  # The issue title `[i18n] <namespace>.<key> (<language>)` and the `suggestion` id are the URL
  # query parameters taigikeyboard.tw/translate prefills; change them only together with that page.
  # The title and the labels are parsed by tools/i18n/apply_suggestion.py
  # (.github/workflows/i18n-suggestion.yml); change them only together with that script.
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested text（建議的文字）
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why（原因）
      description: Optional. Where you saw it, or why the new wording reads better.
