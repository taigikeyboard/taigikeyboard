<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Hidden and Canvas Editors</title>
    <style>
      body { margin: 2rem; font: 16px/1.5 sans-serif; }
      .editor-box {
        position: relative;
        width: 28rem;
        height: 7rem;
        margin-bottom: 1.25rem;
        border: 1px solid #bbb;
        overflow: hidden;
      }
      /* Monaco (`editContext: true`): 0-width `div.native-edit-context` inside `.overflow-guard`. */
      .overflow-guard { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .native-edit-context {
        position: absolute;
        left: 24px;
        top: 20px;
        width: 0;
        height: 18px;
        opacity: 0;
        outline: none;
      }
      /* Monaco (`editContext: false`): 1px transparent `.inputarea` parked inside `.overflow-guard`. */
      .inputarea {
        position: absolute;
        left: 24px;
        top: 20px;
        width: 1px;
        height: 18px;
        padding: 0;
        border: 0;
        color: transparent;
        background: transparent;
        resize: none;
      }
      /* Ace / xterm: zero-opacity helper textarea inside an editor box. */
      #opacity-zero {
        position: absolute;
        left: 12px;
        top: 12px;
        width: 6rem;
        height: 1.5rem;
        opacity: 0;
      }
      /* Non-CodeMirror zero-height overflow clip around a textarea. */
      #clipped-clip {
        overflow: hidden;
        position: relative;
        width: 3px;
        height: 0;
      }
      #clipped-area {
        position: absolute;
        width: 400px;
        height: 1.2em;
      }
      /* Google Docs: off-screen iframe directly under body, plus a visible title input. */
      #docs-iframe {
        position: absolute;
        top: -10000px;
        left: -10000px;
        width: 1px;
        height: 1px;
        border: 0;
      }
      #docs-title { display: block; width: 18rem; margin-bottom: 1rem; font: inherit; }
      /* Google Sheets: singleton `#waffle-rich-text-editor` parked off-screen while navigating. */
      #sheets-input-box {
        position: absolute;
        top: -10000px;
        left: 0;
      }
      #sheets-input-box.editing {
        position: fixed;
        top: 220px;
        left: 180px;
      }
      #waffle-rich-text-editor {
        width: 7rem;
        height: 1.5rem;
        border: 1px solid #1a73e8;
        background: #fff;
      }
      /* Dynamically toggled field. */
      #dynamic-input { display: block; width: 18rem; margin-bottom: 1rem; font: inherit; }
      #dynamic-input.offscreen { position: fixed; top: -10000px; left: -10000px; }
      /* Visible fixed bar inside an overflow-clipped header (must NOT be misclassified as clipped). */
      #clipped-header { overflow: hidden; height: 2rem; border: 1px solid #ddd; margin-bottom: 1rem; }
      #fixed-palette { position: fixed; right: 2rem; top: 2rem; background: #fff; padding: 4px; border: 1px solid #999; }
      #palette-input { width: 12rem; font: inherit; }
      /* Syntax-highlighted overlay textarea: transparent text fill, visible caret. */
      #overlay-code {
        display: block;
        width: 18rem;
        height: 3rem;
        color: transparent;
        caret-color: #111;
        background: #f8f8f8;
        border: 1px solid #bbb;
        font: 14px/1.4 monospace;
      }
    </style>
  </head>
  <body>
    <input id="docs-title" type="text" placeholder="Document title">

    <div id="monaco-editcontext" class="editor-box monaco-editor">
      <div class="overflow-guard">
        <div id="editcontext-target" class="native-edit-context"></div>
      </div>
    </div>

    <div id="monaco-textarea" class="editor-box monaco-editor">
      <div class="overflow-guard">
        <textarea id="monaco-inputarea" class="inputarea"></textarea>
      </div>
    </div>

    <div id="ace-box" class="editor-box">
      <textarea id="opacity-zero"></textarea>
    </div>

    <div id="clipped-box" class="editor-box">
      <div id="clipped-clip">
        <textarea id="clipped-area"></textarea>
      </div>
    </div>

    <iframe id="docs-iframe" src="about:blank" title="Text target"></iframe>

    <div id="sheets-input-box">
      <div
        id="waffle-rich-text-editor"
        g_editable="true"
        docs-unhandledkeys="ctrl+shift+z,ctrl+y,ctrl+z"
        contenteditable="false"
      ></div>
    </div>

    <input id="dynamic-input" class="offscreen" type="text">

    <header id="clipped-header">
      <div id="fixed-palette">
        <input id="palette-input" type="search">
      </div>
    </header>

    <textarea id="overlay-code"></textarea>

    <pre id="log"></pre>
    <script src="hidden.js"></script>
  </body>
</html>
