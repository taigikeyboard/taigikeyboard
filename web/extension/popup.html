<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="light dark">
    <title>台語齒盤</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="popup.css">
    <script type="module" src="popup.js"></script>
  </head>
  <body class="popup">
    <p id="site"></p>
    <p id="status" role="status"></p>
    <button id="enable" class="setting-reset" type="button" data-i18n="web.extensionEnableSite" hidden>Use on This Site</button>
    <button id="turn-on" class="setting-reset" type="button" data-i18n="web.extensionTurnOn" hidden>Start Typing</button>
    <button id="turn-off" class="setting-reset" type="button" data-i18n="web.extensionTurnOff" hidden>Stop Typing</button>
    <button id="remove" class="setting-reset" type="button" data-i18n="web.extensionRemoveSite" hidden>Stop Using on This Site</button>
    <button id="settings" class="setting-reset" type="button" data-i18n="desktop.menuSettings">TaigiKeyboard Settings</button>
  </body>
</html>
