[package]
name = "taigi-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "The browser-facing crate of the web version"

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
taigi-desktop-core = { workspace = true }
mmap-host = { workspace = true }
# The engine keeps what the user picks (web-roadmap Phase 8).
dispatch = { workspace = true, features = ["user-data"] }
userdata = { workspace = true }
wasm-bindgen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_family = "wasm")'.dependencies]
sqlite-wasm-rs = { workspace = true }
