[toolchain]
# The root rust-toolchain.toml's version (`tools/rust-toolchain.sh check`).
channel = "1.100.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
# wasm32-unknown-unknown — the one target this workspace ships. `cargo` must run
# from this directory for rustup to read this file (`make -C web`).
targets = ["wasm32-unknown-unknown"]
