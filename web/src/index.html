<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title data-i18n="home.appHeaderTitle">TaigiKeyboard</title>
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="ime.js"></script>
  </head>
  <body>
    <script src="prepaint.js"></script>
    <button id="sidebar-toggle" class="corner-button" type="button" aria-controls="sidebar" data-i18n-aria-label="common.settings" data-i18n-title="common.settings">
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <rect x="2.75" y="4" width="14.5" height="12" rx="2.25" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <path d="M7.75 4v12" fill="none" stroke="currentColor" stroke-width="1.5"/>
      </svg>
    </button>
    <aside id="sidebar" popover data-i18n-aria-label="common.settings">
      <div class="sidebar-close">
        <button class="corner-button" type="button" popovertarget="sidebar" popovertargetaction="hide" data-i18n-aria-label="common.close" data-i18n-title="common.close">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M5 5l10 10M15 5L5 15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <form id="settings">
        <label class="setting"><span data-i18n="desktop.appearanceTab">Appearance</span>
          <select name="candidateAppearanceMode">
            <option value="auto" selected data-i18n="settings.displayLanguageAutomatic">Automatic</option>
            <option value="light" data-i18n="desktop.candidateAppearanceLight">Light</option>
            <option value="dark" data-i18n="desktop.candidateAppearanceDark">Dark</option>
          </select>
        </label>
        <label class="setting"><span data-i18n="theme.customFont">Font</span>
          <select name="fontType">
            <option value="system" selected data-i18n="common.fontSystemDefault">System</option>
            <option value="openHuninn" data-i18n="common.fontOpenHuninn">Open Huninn</option>
            <option value="iansui" data-i18n="common.fontIansui">Iansui</option>
            <option value="genYoMin" data-i18n="common.fontGenYoMin">GenYoMin</option>
            <option value="genYoGothic" data-i18n="common.fontGenYoGothic">GenYoGothic</option>
          </select>
        </label>
        <label class="setting"><span data-i18n="settings.inputMode">Input Mode</span>
          <select name="inputMode">
            <option value="tl" selected data-i18n="settings.tlMode">Tâi-lô</option>
            <option value="poj" data-i18n="settings.pojMode">Pe̍h-ōe-jī</option>
            <option value="tps" data-i18n="settings.tpsMode">Phonetic Symbols</option>
          </select>
        </label>
        <label class="setting"><span data-i18n="desktop.shortcutShowTpsKeyboard">Show Phonetic Symbols Mini Keyboard</span>
          <input type="checkbox" name="tpsKeyboardShown">
        </label>
        <label class="setting"><span data-i18n="settings.candidateDisplayMode">Candidate Display</span>
          <select name="candidateDisplayMode">
            <option value="sideBySide" selected data-i18n="settings.candidateDisplayModeSideBySide">Hanji–Romanization Pairing</option>
            <option value="combined" data-i18n="settings.candidateDisplayModeCombined">Hanji with Romanization</option>
            <option value="romanOnly" data-i18n="settings.candidateDisplayModeRomanOnly">Romanization Only</option>
          </select>
        </label>
        <label class="setting"><span data-i18n="settings.displayLanguage">Display Language</span>
          <select name="displayLanguage">
            <option value="system" selected data-i18n="settings.displayLanguageAutomatic">Automatic</option>
            <option value="hanji">漢字</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="tailo">Tâi-lô</option>
            <option value="poj">Pe̍h-ōe-jī</option>
          </select>
        </label>
      </form>
      <nav class="sidebar-links" data-i18n-aria-label="web.links">
        <a href="https://taigikeyboard.tw/" target="_blank" rel="noopener" data-i18n="home.appHeaderTitle">TaigiKeyboard</a>
        <a href="https://taigikeyboard.tw/taigi-converter/" target="_blank" rel="noopener" data-i18n="web.converter">Converter</a>
        <a href="https://taigikeyboard.tw/kautian-mirror/" target="_blank" rel="noopener" data-i18n="web.kautianMirror">Kautian Mirror</a>
      </nav>
    </aside>
    <main>
      <h1 data-i18n="home.appHeaderTitle">TaigiKeyboard</h1>
      <div class="status">
        <p id="message" role="status" data-state="loading"></p>
        <button id="mode-button" type="button" data-i18n-title="settings.inputMode">
          <span id="mode"></span>
          <svg viewBox="0 0 10 10" aria-hidden="true">
            <path d="M2.5 4l2.5 2.5L7.5 4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <div id="editor">
        <textarea id="text" data-i18n-aria-label="web.textLabel" data-i18n-placeholder="web.placeholder" spellcheck="false" autocapitalize="off" autocomplete="off" disabled></textarea>
        <div id="panel" hidden>
          <div id="preedit"></div>
          <ol id="candidates"></ol>
        </div>
      </div>
      <div class="actions">
        <p id="notice" role="status" data-i18n="web.otherInputMethod">Another input method is active. Turn it off to type here.</p>
        <button id="copy" class="action" type="button" data-i18n="desktop.menuCopy">Copy</button>
        <button id="clear" class="action" type="button" data-i18n="web.clear">Clear</button>
      </div>
      <section id="tps-keyboard" data-i18n-aria-label="desktop.shortcutShowTpsKeyboard"></section>
      <div id="spoken" aria-live="polite"></div>
    </main>
  </body>
</html>
