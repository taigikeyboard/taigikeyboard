[package]
name = "android-jni"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# JUSTIFICATION: FFI crate — overrides workspace `unsafe_code = "forbid"` per
# `.claude/rules/rust-ffi-safety.md` §3 (`unsafe` discipline). Every `unsafe` block in
# this crate carries a `// SAFETY:` comment per the same rule.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }

[lib]
name = "rust_taigi"
crate-type = ["cdylib"]

[features]
# Android is this crate's only consumer and always ships the user-data stores
# (docs/architecture/user-data-engine-roadmap.md P8b).
default = ["user-data"]
# Dev-only: exposes `Java_..._panicForTest` so platform tests can drive T1.
# Release builds omit this feature; the post-build `nm` check in
# `engine/scripts/build-android-libs.sh` asserts the symbol is absent.
panic-injector = []
# Test-build-only engine trace — docs/architecture/e2e-trace-schema.md.
e2e-trace = ["dispatch/e2e-trace"]
# The engine-owned user-data stores (bundled SQLite).
user-data = ["dispatch/user-data"]

[dependencies]
dispatch = { workspace = true }
protos = { workspace = true }
log = { workspace = true }
jni = { workspace = true }
