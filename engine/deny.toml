[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.92

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other by `path` with no `version`; cargo-deny
# counts those as wildcards and has failed security.yml since 2026-09-04. Paths
# inside the workspace are not a supply-chain surface, so exempt them.
allow-wildcard-paths = true
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
