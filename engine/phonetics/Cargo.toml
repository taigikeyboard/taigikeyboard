[package]
name = "phonetics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
# One test binary per concern (tests/it.rs etc.), not one per tests/*.rs.
autotests = false

[lints]
workspace = true

[lib]
# No runnable doc examples (doc fences are `text`); skip the rustdoc pass.
doctest = false

[dependencies]
protos = { workspace = true }
unicode-normalization = { workspace = true }
regex = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
once_cell = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
test-support = { workspace = true }

[[test]]
name = "it"
path = "tests/it.rs"
