[package]
name = "userdata"
description = "The user's data on disk: learning databases and custom dictionary, engine-owned (rust-migration-policy §6)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
# One test binary per concern (tests/it.rs etc.), not one per tests/*.rs.
autotests = false

[lints]
workspace = true

# Always links bundled C SQLite; the one gate on that linkage is
# `dispatch/user-data`, the only edge to this crate (user-data-engine-roadmap U11).
[lib]
# No runnable doc examples (doc fences are `text`); skip the rustdoc pass.
doctest = false

[dependencies]
phonetics = { workspace = true }
# The `UserDataRequest` façade (`handle` / `dispatch`).
protos = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
test-support = { workspace = true }
unicode-normalization = { workspace = true }

[[test]]
name = "it"
path = "tests/it.rs"
