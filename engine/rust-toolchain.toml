[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
profile = "minimal"
# JUSTIFICATION: shipped-ABI scope. Apple targets cover the iOS device +
# simulator triples and both macOS architectures — the desktop IME ships one
# universal `.pkg` (`docs/architecture/macos-release.md`), so `x86_64-apple-darwin`
# is a shipped ABI, not a convenience. Android ships arm64 only. Deliberately
# omitted: the armv7 / x86_64 Android targets from
# `.claude/rules/rust-best-practices.md` §6 (the user does not ship those ABIs —
# matched by the arm64-v8a-only `abiFilters` in android/app/build.gradle.kts).
# Re-add when expanding to emulator dev or 32-bit Android.
targets = [
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
    "x86_64-apple-ios",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-linux-android",
]
