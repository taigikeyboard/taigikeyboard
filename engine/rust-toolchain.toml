[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
profile = "minimal"
# JUSTIFICATION: shipped-ABI scope. Apple targets cover the iOS device +
# simulator triples and macOS arm64 (the desktop IME, `docs/architecture/
# macos-roadmap.md` D1); Android ships arm64 only. Deliberately omitted:
# `x86_64-apple-darwin` (Intel macOS distribution is a user-gated later step,
# so the macOS artifact stays single-slice) and the armv7 / x86_64 Android
# targets from `.claude/rules/rust-best-practices.md` §6 (the user does not
# ship those ABIs — matched by the arm64-v8a-only `abiFilters` in
# android/app/build.gradle.kts). Re-add when expanding to Intel Macs,
# emulator dev, or 32-bit Android.
targets = [
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
    "x86_64-apple-ios",
    "aarch64-apple-darwin",
    "aarch64-linux-android",
]
