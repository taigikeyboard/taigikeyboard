[package]
name = "composing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
# One test binary per concern (tests/it.rs etc.), not one per tests/*.rs.
autotests = false

[lints]
workspace = true

[lib]
# No runnable doc examples (doc fences are `text`); skip the rustdoc pass.
doctest = false

[dependencies]
protos = { workspace = true }
phonetics = { workspace = true }
lexicon = { workspace = true }
# `UserRows.frequency` — the `ranking::FrequencyMap` a fetch ranks with.
ranking = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
once_cell = { workspace = true }
# v3.5.8 Phase 9 Item 9 — `canonicalize_poj_shadow` decomposes POJ-display
# input (combining tone marks + `o\u{0358}` + `\u{207f}`) via NFD so the
# FST shadow buffer becomes ASCII-canonical TL spelling.
unicode-normalization = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
test-support = { workspace = true }

[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "prod"
path = "tests/prod.rs"

[[test]]
name = "no_lexicon"
path = "tests/no_lexicon.rs"
