[workspace]
members = ["phonetics", "composing", "protos", "ranking", "dispatch", "swift-ffi", "android-jni"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "MIT"
repository = "https://github.com/siansiansu/taigikeyboard"

[workspace.dependencies]
prost = "0.12"
prost-build = "0.12"
unicode-normalization = "0.1"
unicode-properties = "0.1"
regex = "1"
log = "0.4"
thiserror = "1"
proptest = "1"
once_cell = "1"
phonetics = { path = "./phonetics" }
composing = { path = "./composing" }
protos = { path = "./protos" }
ranking = { path = "./ranking" }
dispatch = { path = "./dispatch" }
swift-bridge = "0.1"
swift-bridge-build = "0.1"
jni = "0.21"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
