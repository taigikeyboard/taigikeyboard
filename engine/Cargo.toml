[workspace]
members = ["phonetics", "protos", "cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/siansiansu/taigikeyboard"

[workspace.dependencies]
prost = "0.12"
prost-build = "0.12"
unicode-normalization = "0.1"
regex = "1"
log = "0.4"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
proptest = "1"
once_cell = "1"
phonetics = { path = "./phonetics" }
protos = { path = "./protos" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
