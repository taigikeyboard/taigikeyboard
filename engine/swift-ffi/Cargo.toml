[package]
name = "swift-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# JUSTIFICATION: FFI crate — overrides workspace `unsafe_code = "forbid"` per
# `docs/contributing/rust-ffi-safety.md` §3. Every `unsafe` block in this crate carries
# a `// SAFETY:` comment per the same rule.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }

[lib]
name = "rust_taigi"
# `staticlib` for iOS (`RustTaigi.xcframework`).
crate-type = ["staticlib"]
# No runnable doc examples (doc fences are `text`); skip the rustdoc pass.
doctest = false

[features]
# Dev-only: exposes `panic_for_test()` so platform tests can drive T1.
# Release builds omit this feature; the post-build `nm` check in
# `engine/scripts/build-xcframework.sh` asserts the symbol is absent.
panic-injector = []
# Test-build-only engine trace — docs/architecture/e2e-trace-schema.md.
e2e-trace = ["dispatch/e2e-trace"]

[dependencies]
# iOS (host app + keyboard extension) always ships the engine-owned user-data
# stores (bundled SQLite; docs/architecture/user-data-engine-roadmap.md P6).
dispatch = { workspace = true, features = ["user-data"] }
protos = { workspace = true }
log = { workspace = true }
swift-bridge = { workspace = true }

[build-dependencies]
swift-bridge-build = { workspace = true }
