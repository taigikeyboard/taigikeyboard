syntax = "proto3";

package taigi.engine;

option java_package = "com.siansiansu.taigikeyboard.engine.proto";
option java_multiple_files = true;

// Lexicon module — dictionary install and the Manage Dictionaries search
// (`DictionarySearchRequest`, whose custom entries engine/dispatch joins
// from the user data).
//
// Ops live in the LexiconRequest.method oneof. Pattern mirrors PhoneticsRequest.method oneof so the top-level dispatcher
// (engine::dispatch) routes by Request.payload tag and then per-module
// dispatch routes by oneof method.

message LexiconRequest {
  // Tag 10 was `process_candidates` (legacy linear ranking, no production
  // caller since v3.5.8; removed).
  // Tag 16 was `classify_input` (no production caller; removed 2026-09-25).
  // Tag 15 was `assoc_lookup`; the bundled bigram lookup now runs inside
  // engine/dispatch for nextword `PredictNext` (2026-09-25).
  // Tag 12 was `search` (the keyboard autocomplete entry retired in v3.5.8
  // Item 13; the last wrapper had no caller; removed 2026-09-30).
  // Tags 13 `search_with_sources`, 14 `search_by_hanji`, 17 `is_hanji` and
  // 18 `dictionary_filters` were the shells' own dictionary-search
  // orchestration; `dictionary_search` answers it in one call (removed
  // 2026-11-20, roadmap C3).
  reserved 10, 12, 13, 14, 15, 16, 17, 18;
  reserved "process_candidates", "search", "classify_input", "assoc_lookup",
      "search_with_sources", "search_by_hanji", "is_hanji", "dictionary_filters";

  oneof method {
    InstallRequest            install               = 11;  // lexicon read-path
    DictionarySearchRequest   dictionary_search     = 19;  // Manage Dictionaries search, one call
  }
}

// `InstallRequest` is the (idempotent) lexicon read-path bootstrap. The
// platform passes absolute Bundle / filesDir paths; engine opens mmap'd
// readers and the fst prefix index, validates magic bytes + versions, and
// atomically swaps in the new `EngineState`. Reinstall (Android asset
// version bump per audit D-9) reuses this method — same shape, the engine
// is responsible for atomic-on-success swap; old state stays intact if any
// step fails.
//
// Path validation: any NUL byte (`\0`) or non-absolute path is rejected
// with `LexiconError::InvalidPath` / `PathNotAbsolute` via the proto error
// envelope. Engine NEVER panics on user-supplied paths.
message InstallRequest {
  string trie_path             = 1;  // absolute path to dictionary.fst
  string dictionary_bin_path   = 2;  // absolute path to dictionary.bin (TKDB)
  string association_bin_path  = 3;  // absolute path to association.bin (TKWA, bundled)
  uint32 dictionary_version    = 4;  // platform-supplied stamp (Android: dictionary_app_version.txt; iOS: bundle build number)

  // v3.5.8 Phase 6 — absolute path to `syllables.fst` (Phase-2 TL syllable
  // inventory). Optional on the wire: empty string skips loading and
  // `EngineState.syllable_inventory` stays `None`. Phase 7 / 8 platform
  // bundles populate this; Phase 6 only wires the field through so the
  // composing dispatch can call `tl::valid_span_endings` against the
  // installed inventory once the platform pipeline is ready.
  string syllable_inventory_path = 5;
}

// `DictionarySearchRequest` is the Manage Dictionaries search in one call:
// the engine picks the Hanji or romanization lookup, applies the source
// toggles, renders each row's romanization, keeps only the enabled
// sources' badges and puts the user's custom entries first.
message DictionarySearchRequest {
  // What the user typed into the search box. Empty → no rows.
  string query = 1;
  // The settings input mode, spelled as `AppConfig.input_mode`
  // (`tl` / `poj` / `tps` / `english`; anything else reads as TL).
  string input_mode = 2;
  // Absent = every toggle off.
  DictionarySourceToggles toggles = 3;
  // Enable Custom Dictionary. False (or absent) leaves the custom entries out.
  bool custom_dictionary_enabled = 4;
  // The most rows per section: up to `limit` custom entries, then up to
  // `limit` dictionary rows.
  uint32 limit = 5;
}

// `DictionarySearchResponse.rows`: the custom entries (romanization
// order; none for a Hanji query, when Enable Custom Dictionary is off or
// before the platform opens its user data), then the dictionary rows in
// the engine's order (`lexicon::search`). No dictionary rows before the
// dictionary is installed.
message DictionarySearchResponse {
  repeated DictionarySearchRow rows = 1;
}

message DictionarySearchRow {
  oneof id {
    // The dictionary row id.
    int64 system_id = 1;
    // The custom entry's id (`CustomDictionaryEntry.id`).
    string custom_id = 2;
  }
  // The romanization as shown: POJ under `poj`, TL otherwise (TPS shows
  // TL); a custom entry's romanization as the user saved it.
  string roman = 3;
  // What the web dictionaries are asked with: the row's TL, or a custom
  // entry's own romanization.
  string lookup_tl = 4;
  // Absent for a romanization-only entry.
  optional string hanji = 5;
  // The badges: the row's sources the user has on, in source-bit order;
  // `[CUSTOM]` for a custom entry.
  repeated DictionarySourceCode sources = 6;
}

message LexiconResponse {
  reserved 10, 12, 13, 14, 15, 16, 17, 18;
  reserved "process_candidates_result", "search_result", "classify_input_result",
      "assoc_lookup_result", "search_with_sources_result", "search_by_hanji_result",
      "is_hanji_result", "dictionary_filters_result";

  oneof result {
    InstallResponse            install_result              = 11;
    DictionarySearchResponse   dictionary_search_result    = 19;
  }
}

// `InstallResponse` carries diagnostic counts. Platform diagnostic surfaces
// log these to confirm install success.
message InstallResponse {
  uint64 dictionary_record_count   = 1;
  uint64 prefix_index_entry_count  = 2;
}

// `DictionarySourceToggles` is the 12-boolean snapshot of user dictionary
// preferences the engine resolves into its source filter
// (`lexicon::api::dictionary_filter_bitmask`). Field tags map
// directly to the bit positions the engine consumes; reordering tags is
// a wire break.
//
// Mirrors the iOS `EngineSettings` + Android `EngineSettings` boolean
// surface (see `EnabledDictionaries.swift` / `.kt` pre-v3.5.8).
//
// kautian subcollections (binary v3, Phase 3 ENCODE): `kautian_subcollections`
// carries the user's per-subcollection enable state. Contract: every shell
// sends it with the toggles; an absent message reads as the proto default
// (every optional subcollection off, main on).
// `dictionary_filter_bitmask` owns the subtag bit packing so the layout lives in Rust only.
message DictionarySourceToggles {
  bool kautian = 1;  // 教育部臺灣台語常用詞辭典
  bool taigitv = 2;  // 台語新詞辭庫
  bool itaigi  = 3;  // iTaigi 華台對照典
  bool sitbut  = 4;  // 台灣植物名彙
  bool taihoa  = 5;  // 台華線頂對照典
  bool taijit  = 6;  // 台日大辭典
  bool kungge  = 7;  // 台語工藝詞庫
  bool stti    = 8;  // 學科術語辭典
  bool khpoo   = 9;  // 腔口補充資料
  bool variant = 10; // Variant Characters (異用字, filter bit 12)
  bool khiin   = 11; // Conventional Characters (在來字, filter bit 9)
  bool lkk     = 12; // LKK Han-Lo Recommended Characters
  bool dev     = 14; // developer supplement (Supplementary Word List, filter bit 10) — default on, now toggleable
  // kautian subcollection toggles — contract above. Only meaningful when
  // `kautian = true`.
  KautianSubcollectionToggles kautian_subcollections = 13;
}

// `KautianSubcollectionToggles` is the per-subcollection enable state for the
// kautian source (Phase 3). The main subcollection (main entry / headword) is
// NOT a field — it is always on whenever the kautian master toggle is on,
// so `dictionary_filter_bitmask` sets its subtag bit unconditionally. Field tags map to the kautian subtag bit positions:
// accent tag N → subtag bit N (config.yaml `dialect_columns` order), and
// `name_appendix` → subtag bit 11, `alt_reading` → subtag bit 12. Bit layout owner is Rust
// `engine/lexicon/src/dictionary_reader.rs` (`KAUTIAN_SUBTAG_*`); see
// `docs/engine/binary-format.md` §4.5.
message KautianSubcollectionToggles {
  bool accent_lukang    = 1;  // Lukang (Quanzhou-leaning) (subtag bit 1)
  bool accent_sansia    = 2;  // Sansia (Quanzhou-leaning) (subtag bit 2)
  bool accent_taipak    = 3;  // Taipei (Quanzhou-leaning) (subtag bit 3)
  bool accent_gilan     = 4;  // Yilan (Zhangzhou-leaning) (subtag bit 4)
  bool accent_tainan    = 5;  // Tainan (Mixed) (subtag bit 5)
  bool accent_kaohsiung = 6;  // Kaohsiung (Mixed) (subtag bit 6)
  bool accent_kinmen    = 7;  // Kinmen (Quanzhou-leaning) (subtag bit 7)
  bool accent_makung    = 8;  // Makung (Quanzhou-leaning) (subtag bit 8)
  bool accent_sintik    = 9;  // Hsinchu (Quanzhou-leaning) (subtag bit 9)
  bool accent_taichung  = 10; // Taichung (Zhangzhou-leaning) (subtag bit 10)
  bool name_appendix    = 11; // Surname Appendix, 名+姓 (subtag bit 11)
  bool alt_reading      = 12; // Alternative Readings, 又唸作 (subtag bit 12)
}

// `DictionarySourceCode` is the wire-stable mapping for
// `DictionarySearchRow.sources`. Decoupled from platform
// `DictionarySource` enum raw values — Swift uses `String` raw values and
// Kotlin has no stable numeric value beyond `ordinal`. Platforms decode
// via explicit switch/map.
//
// DO NOT renumber: this is wire format. New sources append at the end.
enum DictionarySourceCode {
  DICT_SOURCE_UNSPECIFIED = 0;
  DICT_SOURCE_KAUTIAN     = 1;
  DICT_SOURCE_TAIGITV     = 2;
  DICT_SOURCE_ITAIGI      = 3;
  DICT_SOURCE_SITBUT      = 4;
  DICT_SOURCE_TAIHOA      = 5;
  DICT_SOURCE_TAIJIT      = 6;
  DICT_SOURCE_KUNGGE      = 7;
  DICT_SOURCE_STTI        = 8;
  DICT_SOURCE_KHPOO       = 9;
  DICT_SOURCE_KHIIN       = 10;
  DICT_SOURCE_LKK         = 11;
  DICT_SOURCE_DEV         = 12;  // toggleable (`DictionarySourceToggles.dev`)
  DICT_SOURCE_CUSTOM      = 13;  // always-on (non-toggleable)
}
