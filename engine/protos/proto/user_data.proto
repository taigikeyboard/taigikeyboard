syntax = "proto3";

package taigi.engine;

option java_package = "com.siansiansu.taigikeyboard.engine.proto";
option java_multiple_files = true;

// User-data module — the four SQLite stores the engine owns
// (`.claude/rules/rust-migration-policy.md` §6; plan and status in
// `docs/architecture/user-data-engine-roadmap.md`). The platform decides
// WHERE each file lives and how it journals; everything about WHAT is in
// them (schema, migration, capacity, reset) is the engine's.
//
// Handled only when the engine is built with `dispatch`'s `user-data`
// feature; without it every request answers `FAIL_INVARIANT`.

message UserDataRequest {
  oneof method {
    OpenUserData open = 1;
    ResetUserData reset = 2;
    RecordUsage record_usage = 3;
    ListCustomEntries list_custom_entries = 4;
    SaveCustomEntry save_custom_entry = 5;
    DeleteCustomEntry delete_custom_entry = 6;
    ImportCustomCsv import_custom_csv = 7;
    ExportCustomCsv export_custom_csv = 8;
    ExportBackup export_backup = 9;
    ImportBackup import_backup = 10;
  }
}

message UserDataResponse {
  oneof result {
    UserDataOpened opened = 1;
    UserDataReset reset = 2;
    UsageRecorded usage_recorded = 3;
    CustomEntries custom_entries = 4;
    CustomEntrySaved custom_entry_saved = 5;
    CustomEntryDeleted custom_entry_deleted = 6;
    CustomCsvImported custom_csv_imported = 7;
    CustomCsvExported custom_csv_exported = 8;
    BackupExported backup_exported = 9;
    BackupImported backup_imported = 10;
  }
}

// How the files journal — a platform choice (roadmap U3): WAL on the
// desktop, DELETE on iOS (App Group files shared by the app and its
// keyboard extension, excluded from backup without sidecars).
enum UserDataJournal {
  USER_DATA_JOURNAL_WAL = 0;
  USER_DATA_JOURNAL_DELETE = 1;
}

// Opens the stores for this process, once. Absolute file paths: one
// directory everywhere except Android, whose `user_association.db` lives in
// `filesDir`. Synchronous — every store is open, taken over (roadmap U7) and
// the custom dictionary re-derived and seeded before the answer — so call it
// off the main thread. A repeat with the same paths answers the stores'
// current readiness; different paths are refused.
message OpenUserData {
  string frequency_path = 1;
  string association_path = 2;
  string custom_dictionary_path = 3;
  string learned_phrases_path = 4;
  UserDataJournal journal = 5;
}

// Which stores are ready. A store that is not — a file from a later build,
// a disk error — stays closed and ranks neutrally; the engine logs why.
message UserDataOpened {
  bool frequency_ready = 1;
  bool association_ready = 2;
  bool custom_dictionary_ready = 3;
  bool learned_phrases_ready = 4;
}

// Empties the selected stores, in place (`DELETE`, never a file unlink —
// another process may hold the file). The platforms clear different sets
// today, so the caller names them; an empty selection is refused.
message ResetUserData {
  bool frequency = 1;
  bool association = 2;
  bool custom_dictionary = 3;
  bool learned_phrases = 4;
}

// Rows removed per store (0 for a store not selected).
message UserDataReset {
  int64 frequency_removed = 1;
  int64 association_removed = 2;
  int64 custom_dictionary_removed = 3;
  int64 learned_phrases_removed = 4;
}

// The user committed a candidate or picked a prediction — one frequency
// count for the `(display_text, canonical_tl)` pair, and, when the pick was
// a learned phrase taken whole, its touch-on-use (§50). Sent exactly where
// each platform recorded usage itself before. Queued, best-effort: the
// answer does not wait for the write.
//
// The other learning writes need no op: once the stores are open the
// engine persists what it decides itself — `Effect.phrase_learned` and
// `NextWordEffect.record_association` / `record_compound_associations` —
// and leaves those effects out of the response.
message RecordUsage {
  string display_text = 1;
  string canonical_tl = 2;
  // The picked candidate's Hanji, when it has one (a learned phrase can
  // only be touched by its Hanji); absent for a Hanji-less pick.
  optional string hanji = 3;
  // The desktop's frequency-recording setting, OFF: no count is kept, the
  // learned-phrase touch still is (it is learning data, always on — §50).
  // Negative so an un-wired build records, as the phones always do.
  bool frequency_recording_disabled = 4;
}

message UsageRecorded {}

// ---- The custom-dictionary pages (roadmap P4) ----
//
// Every platform's Custom Dictionary page reads and edits the store through
// these; "delete everything" is `ResetUserData.custom_dictionary`. What the
// user can be told — a full dictionary, an unusable file — comes back as a
// `CustomDictionaryRefusal`; FAIL_* codes stay for I/O the user cannot act on.

enum CustomDictionaryRefusal {
  CUSTOM_DICTIONARY_REFUSAL_NONE = 0;
  // Already `MAX_ENTRIES` (30 000) words; editing an existing one is never
  // refused. For an import: the file itself holds more than that.
  CUSTOM_DICTIONARY_REFUSAL_FULL = 1;
  // An entry needs a romanization.
  CUSTOM_DICTIONARY_REFUSAL_EMPTY_ROMAN = 2;
  // No search key could be derived from the romanization, so the keyboard
  // could never find the word.
  CUSTOM_DICTIONARY_REFUSAL_UNSEARCHABLE = 3;
  // An import file over 5 MB.
  CUSTOM_DICTIONARY_REFUSAL_FILE_TOO_LARGE = 4;
  CUSTOM_DICTIONARY_REFUSAL_NOT_UTF8 = 5;
  // Content, but not one `roman,hanzi` row.
  CUSTOM_DICTIONARY_REFUSAL_NO_USABLE_ROWS = 6;
}

// One stored word. `created_at` / `updated_at` are UTC `yyyy-MM-dd HH:mm:ss`.
message CustomDictionaryEntry {
  string id = 1;
  string roman = 2;
  string hanzi = 3;
  string created_at = 4;
  string updated_at = 5;
}

// A page of the dictionary, newest edit first. `filter` matches romanization
// or Hanji as a substring (case-insensitive ASCII); empty lists everything.
message ListCustomEntries {
  string filter = 1;
  uint32 limit = 2;
  uint32 offset = 3;
}

message CustomEntries {
  repeated CustomDictionaryEntry entries = 1;
  uint32 total = 2;           // every stored word
  uint32 matching_total = 3;  // the words `filter` matches, for paging
}

// Adds a word, or edits the one with `id`.
message SaveCustomEntry {
  optional string id = 1;
  string roman = 2;
  string hanzi = 3;
}

message CustomEntrySaved {
  CustomDictionaryRefusal refusal = 1;
  // The stored row; absent when refused.
  optional CustomDictionaryEntry entry = 2;
}

message DeleteCustomEntry { string id = 1; }

message CustomEntryDeleted { bool removed = 1; }

// A `roman,hanzi` CSV file's bytes, as the platform's file picker read them.
// Rows already stored (same roman and Hanji) are skipped; the import stops
// at the dictionary's cap without failing, so `imported` may be fewer than
// the file's rows even with no refusal.
message ImportCustomCsv { bytes csv = 1; }

message CustomCsvImported {
  CustomDictionaryRefusal refusal = 1;
  uint32 imported = 2;
  uint32 skipped = 3;
}

message ExportCustomCsv {}

// The whole dictionary as `roman,hanzi` lines, for the platform to save.
message CustomCsvExported { bytes csv = 1; }

// ---- The `.taigi` backup (roadmap P4b) ----
//
// Version 2, the JSON iOS and Android already exchange: the custom
// dictionary, frequency counts and learned bigrams — never learned phrases
// (§50). The platform picks the file and shares it; the engine writes and
// reads its bytes.

// `platform` / `app_version` name the writer in the file (`ios`,
// `android`, `macos`, `windows`, `linux`).
message ExportBackup {
  string platform = 1;
  string app_version = 2;
}

message BackupExported { bytes backup = 1; }

// Restores a `.taigi` file's bytes, merging with what is stored: custom
// words already there are skipped and the import stops at the dictionary's
// cap; counts keep the larger of the two; bigram readings are normalized
// to TL. Old and cross-platform backups are read leniently.
message ImportBackup { bytes backup = 1; }

enum BackupRefusal {
  BACKUP_REFUSAL_NONE = 0;
  // Not a `.taigi` file (not JSON of that shape).
  BACKUP_REFUSAL_UNREADABLE = 1;
  // `version` below 1.
  BACKUP_REFUSAL_UNSUPPORTED_VERSION = 2;
}

// Rows merged per store; all 0 when refused.
message BackupImported {
  BackupRefusal refusal = 1;
  uint32 custom_dictionary = 2;
  uint32 frequency = 3;
  uint32 association = 4;
}
