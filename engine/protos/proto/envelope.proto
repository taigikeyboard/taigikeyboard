syntax = "proto3";

package taigi.engine;

import "phonetics.proto";
import "composing.proto";
import "lexicon.proto";
import "nextword.proto";
import "case.proto";

option java_package = "com.siansiansu.taigikeyboard.engine.proto";
option java_multiple_files = true;

// Single FFI entry point envelope. Logical shape mirrors
// references/khiin-rs/khiin/src/engine.rs:57 — see
// docs/engine/rust-core-proto.md §3-§4.

enum ErrorCode {
  OK = 0;
  FAIL_PARSE = 1;
  FAIL_INTERNAL = 2;
  FAIL_IO = 3;
  FAIL_INVARIANT = 4;
}

// Caller identity. Legacy: no engine behavior branches on it any more.
// It existed to select the NextWord compound-split separator and noise-punct
// set per platform; those converged to one platform-neutral contract
// (behavioral-invariants.md §40 INVARIANT_NEXTWORD_LEARNING_DECISION_CONTRACT)
// and nothing else in the engine reads the field.
//
// `nextword` still rejects PLATFORM_UNSPECIFIED with FAIL_INVARIANT, so its
// bridges MUST populate it — but that check predates the convergence and is
// kept only so the convergence changed nothing a platform can observe. Every
// other slice (composing / lexicon / ranking / phonetics) accepts an unset
// field. Removing the check, or reserving the field number, is separate
// cleanup with its own regeneration cost.
enum Platform {
  PLATFORM_UNSPECIFIED = 0;
  PLATFORM_IOS         = 1;
  PLATFORM_ANDROID     = 2;
  PLATFORM_MACOS       = 3;
  PLATFORM_WINDOWS     = 4;
  PLATFORM_LINUX       = 5;
}

// Per-request live snapshot. iOS EngineSettings / Android EngineSettings
// shape — minimal in D9.1, expands per slice. Engine NEVER caches; live-read
// per call per behavioral-invariants.md §11. Platform wrappers MUST pass
// current values per request (e.g. iOS `RustEngineBridge.appConfig(mode:,
// toggles: PojMarkerOptions)` requires the `PojMarkerOptions` parameter, no
// default).
//
// D9.4 added `oo_doubletap_enabled` + `nn_doubletap_enabled` for POJ
// preprocessing (oo→o͘, nn→ⁿ) read by `phonetics::api::normalize_tone` on the
// composing path.
//
// v3.5.5 added `is_translate_swapped` + `platform_id` for the NextWord
// engine (tag 6 `is_association_recording_enabled` retired 2026-09-25 —
// association recording is always on since the toggle left every UI).
// `platform_id` originally branched the compound-split separator and the
// noise-punct set; those converged to one platform-neutral contract (behavioral-invariants.md §40) and it is now
// validated caller identity only.
//
// v3.5.8 added `output_both_scripts`: the engine's Model B continuous
// composing-buffer join (`composing::api::nailed_prefix` /
// `combined_display`) inserts a word-boundary space between nailed
// segments only when the rendered script is roman-ish. `is_translate_swapped`
// alone cannot distinguish "hanji-first" (no space) from "both-scripts"
// (`hit (彼)` — space wanted) since both set `is_translate_swapped = true`;
// the separator predicate needs this second flag (continuous-input-ranking
// §10.2 segmented-spacing contract; Codex pre-impl 2026-05-18).
// How a candidate cell renders the (漢字, 羅馬字) pair. Read by
// exactly two engine sites, both display-tier dedupes: the continuous
// `FetchAtPos` post-literal pass (`composing::dispatch`) and the NextWord
// prediction pass (`nextword::filter`). `UNSPECIFIED` (proto3 default, every
// un-wired build) and any unknown value mean SIDE_BY_SIDE — legacy behaviour;
// normalise through `AppConfig::is_roman_only_display`, never compare the raw
// i32 at a call site. COMBINED (one label `漢字 羅馬字`, hanji
// commits) has NO engine reader — a combined cell is still distinct by
// (hanji, roman); the platforms send `is_translate_swapped = true` for it.
enum CandidateDisplayMode {
  CANDIDATE_DISPLAY_MODE_UNSPECIFIED  = 0;
  CANDIDATE_DISPLAY_MODE_SIDE_BY_SIDE = 1;
  CANDIDATE_DISPLAY_MODE_ROMAN_ONLY   = 2;
  CANDIDATE_DISPLAY_MODE_COMBINED     = 3;
}

// 2026-09-01 added `candidate_display_mode`: 羅馬字 cells hide the hanji, so
// rows that differ only in hanji (同音異字 食/𤆬 tsia̍h) become visible
// duplicates that only the engine can collapse consistently for four
// platforms. Set on the BASE config (every request) — composing AND nextword
// read it; the other request families ignore it. Platforms keep sending the
// derived `is_translate_swapped` / `output_both_scripts` pair (both `false`
// under 羅馬字) so spacing / recording semantics need no new reader.
//
// 2026-09-20 added `hyphenless_roman` (無連字符, USER): the rendered
// romanization drops the inter-syllable `-` and writes the 輕聲 marker `--`
// as `·` U+00B7 (`tâi-uân` → `tâiuân`, `hōo--guá` → `hōo·guá`). Rendering
// only — `phonetics::api::hyphenless_display` is applied to the candidate
// `roman` (`composing::dispatch`), the prediction `text`
// (`nextword::filter`) and the engine-synthesised compound joiner
// (`composing::api::nailed_prefix`); identity fields (`display_text`,
// `canonical_tl`, `tl`) and user-typed text keep their hyphens. The
// platform sends `false` under a TPS layout (the engine sees TPS as
// `"tl"` / `"poj"` and the platform re-splits `roman` on `-` for bopomofo),
// exactly as it folds TPS into `is_translate_swapped`.
//
// 2026-09-22 added `force_lowercase_nasal_marker` (ⁿ大本字 OFF, USER): the
// POJ nasal marker is always `ⁿ` U+207F, never `ᴺ` U+1D3A (Caps Lock
// `SIANN5` → `SIÂⁿ`). Inverted so the proto default keeps PR #102 (the
// marker follows the preceding letter's case). Rendering only
// (`phonetics::case_transform::apply_nasal_marker_case`, §53); identity
// keys already fold both glyphs to `nn`.
message AppConfig {
  reserved 6;
  reserved "is_association_recording_enabled";

  string tone_mode = 1;
  string input_mode = 2;
  bool oo_doubletap_enabled = 3;
  bool nn_doubletap_enabled = 4;
  bool is_translate_swapped = 5;
  Platform platform_id = 7;
  bool output_both_scripts = 8;
  CandidateDisplayMode candidate_display_mode = 9;
  bool hyphenless_roman = 10;
  bool force_lowercase_nasal_marker = 11;
}

message Request {
  // Tag 2 was `CommandType type` — never read by the engine (routing uses the
  // `payload` oneof); removed 2026-09-25.
  reserved 2;
  reserved "type";

  uint32 id = 1;
  AppConfig config_snapshot = 3;
  uint64 generation = 4;
  oneof payload {
    PhoneticsRequest phonetics = 10;
    ComposingRequest composing = 11;
    LexiconRequest lexicon = 12;
    NextWordRequest nextword = 13;
    CaseRequest case_transform = 14;
  }
}

message Response {
  uint32 id = 1;
  ErrorCode error = 2;
  uint64 generation = 3;
  oneof payload {
    PhoneticsResponse phonetics = 10;
    ComposingResponse composing = 11;
    LexiconResponse lexicon = 12;
    NextWordResponse nextword = 13;
    CaseResponse case_transform = 14;
  }
}
