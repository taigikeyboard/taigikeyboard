syntax = "proto3";

package taigi.engine;

import "phonetics.proto";
import "composing.proto";
import "lexicon.proto";
import "nextword.proto";
import "case.proto";

option java_package = "com.siansiansu.taigikeyboard.engine.proto";
option java_multiple_files = true;

// Single FFI entry point envelope. Logical shape mirrors
// references/khiin-rs/khiin/src/engine.rs:57 — see
// docs/engine/rust-core-proto.md §3-§4.

enum CommandType {
  CMD_UNSPECIFIED = 0;
  CMD_PHONETICS = 1;
  CMD_COMPOSING = 2;
  CMD_LEXICON = 3;
  CMD_NEXTWORD = 4;
  CMD_CASE = 5;
}

enum ErrorCode {
  OK = 0;
  FAIL_PARSE = 1;
  FAIL_INTERNAL = 2;
  FAIL_IO = 3;
  FAIL_INVARIANT = 4;
}

// Caller identity. Legacy: no engine behavior branches on it any more.
// It existed to select the NextWord compound-split separator and noise-punct
// set per platform; those converged to one platform-neutral contract
// (behavioral-invariants.md §40 INVARIANT_NEXTWORD_LEARNING_DECISION_CONTRACT)
// and nothing else in the engine reads the field.
//
// `nextword` still rejects PLATFORM_UNSPECIFIED with FAIL_INVARIANT, so its
// bridges MUST populate it — but that check predates the convergence and is
// kept only so the convergence changed nothing a platform can observe. Every
// other slice (composing / lexicon / ranking / phonetics) accepts an unset
// field. Removing the check, or reserving the field number, is separate
// cleanup with its own regeneration cost.
enum Platform {
  PLATFORM_UNSPECIFIED = 0;
  PLATFORM_IOS         = 1;
  PLATFORM_ANDROID     = 2;
  PLATFORM_MACOS       = 3;
}

// Per-request live snapshot. iOS EngineSettings / Android EngineSettings
// shape — minimal in D9.1, expands per slice. Engine NEVER caches; live-read
// per call per behavioral-invariants.md §11. Platform wrappers MUST pass
// current values per request (e.g. iOS `RustEngineBridge.normalizeTone(input,
// toggles: ToneToggles)` requires `ToneToggles` parameter, no default).
//
// D9.4 added `oo_doubletap_enabled` + `nn_doubletap_enabled` for POJ
// preprocessing (oo→o͘, nn→ⁿ) read by `Method::NormalizeTone`.
//
// v3.5.5 added `is_translate_swapped` + `is_association_recording_enabled`
// + `platform_id` for the NextWord engine. `platform_id` originally branched
// the compound-split separator and the noise-punct set; those converged to one
// platform-neutral contract (behavioral-invariants.md §40) and it is now
// validated caller identity only.
//
// v3.5.8 added `output_both_scripts`: the engine's Model B continuous
// composing-buffer join (`composing::api::nailed_prefix` /
// `combined_display`) inserts a word-boundary space between nailed
// segments only when the rendered script is roman-ish. `is_translate_swapped`
// alone cannot distinguish "hanji-first" (no space) from "both-scripts"
// (`hit (彼)` — space wanted) since both set `is_translate_swapped = true`;
// the separator predicate needs this second flag (continuous-input-ranking
// §10.2 segmented-spacing contract; Codex pre-impl 2026-05-18).
message AppConfig {
  string tone_mode = 1;
  string input_mode = 2;
  bool oo_doubletap_enabled = 3;
  bool nn_doubletap_enabled = 4;
  bool is_translate_swapped = 5;
  bool is_association_recording_enabled = 6;
  Platform platform_id = 7;
  bool output_both_scripts = 8;
}

message Request {
  uint32 id = 1;
  CommandType type = 2;
  AppConfig config_snapshot = 3;
  uint64 generation = 4;
  oneof payload {
    PhoneticsRequest phonetics = 10;
    ComposingRequest composing = 11;
    LexiconRequest lexicon = 12;
    NextWordRequest nextword = 13;
    CaseRequest case_transform = 14;
  }
}

message Response {
  uint32 id = 1;
  ErrorCode error = 2;
  uint64 generation = 3;
  oneof payload {
    PhoneticsResponse phonetics = 10;
    ComposingResponse composing = 11;
    LexiconResponse lexicon = 12;
    NextWordResponse nextword = 13;
    CaseResponse case_transform = 14;
  }
}

message Command {
  Request request = 1;
  Response response = 2;
}
