syntax = "proto3";

package taigi.engine;

import "phonetics.proto";
import "composing.proto";
import "lexicon.proto";
import "nextword.proto";
import "case.proto";
import "user_data.proto";

option java_package = "com.siansiansu.taigikeyboard.engine.proto";
option java_multiple_files = true;

// Single FFI entry point envelope. Logical shape mirrors
// references/khiin-rs/khiin/src/engine.rs:57 — see
// docs/engine/rust-core-proto.md §3-§4.

enum ErrorCode {
  OK = 0;
  FAIL_PARSE = 1;
  FAIL_INTERNAL = 2;
  FAIL_IO = 3;
  FAIL_INVARIANT = 4;
}

// Per-request live snapshot. iOS EngineSettings / Android EngineSettings
// shape — minimal in D9.1, expands per slice. Engine NEVER caches; live-read
// per call per behavioral-invariants.md §11. Platform wrappers MUST pass
// current values per request, each from its one builder (iOS / macOS
// `RustEngineBridge.appConfig`, Android `EngineAppConfig.kt` `appConfig`,
// desktop `engine/bridge.rs` `app_config`).
//
// D9.4 added `oo_doubletap_enabled` + `nn_doubletap_enabled` for POJ
// preprocessing (oo→o͘, nn→ⁿ) read by `phonetics::api::normalize_tone` on the
// composing path.
//
// v3.5.5 added `is_hanji_first` for the NextWord engine (tag 6
// `is_association_recording_enabled` retired 2026-09-25 — association
// recording is always on since the toggle left every UI; tag 7
// `platform_id` retired 2026-10-09 — it had branched the compound-split
// separator and the noise-punct set until those converged to one
// platform-neutral contract, behavioral-invariants.md §40; after that it
// only validated caller identity (nextword rejected an unset platform),
// and A1b retires that validation).
//
// v3.5.8 added `output_both_scripts`: the engine's Model B continuous
// composing-buffer join (`composing::api::nailed_prefix` /
// `combined_display`) inserts a word-boundary space between nailed
// segments only when the rendered script is roman-ish. `is_hanji_first`
// alone cannot distinguish "hanji-first" (no space) from "both-scripts"
// (`hit (彼)` — space wanted) since both set `is_hanji_first = true`;
// the separator predicate needs this second flag (continuous-input-ranking
// §10.2 segmented-spacing contract; Codex pre-impl 2026-05-18).
// How a candidate cell renders the (Hanji, romanization) pair. Read by
// exactly two engine sites, both display-tier dedupes: the continuous
// `FetchAtPos` post-literal pass (`composing::requests`) and the NextWord
// prediction pass (`nextword::filter`). `UNSPECIFIED` (proto3 default, every
// un-wired build) and any unknown value mean SIDE_BY_SIDE — legacy behaviour;
// normalise through `AppConfig::is_roman_only_display`, never compare the raw
// i32 at a call site. COMBINED (one label `Hanji romanization`, hanji
// commits) has NO engine reader — a combined cell is still distinct by
// (hanji, roman); the platforms send `is_hanji_first = true` for it.
enum CandidateDisplayMode {
  CANDIDATE_DISPLAY_MODE_UNSPECIFIED  = 0;
  CANDIDATE_DISPLAY_MODE_SIDE_BY_SIDE = 1;
  CANDIDATE_DISPLAY_MODE_ROMAN_ONLY   = 2;
  CANDIDATE_DISPLAY_MODE_COMBINED     = 3;
}

// How the rendered romanization separates syllables (Syllable Separator,
// `behavioral-invariants.md` §49). `UNSPECIFIED` (proto3 default) and any
// unknown value mean HYPHEN — the dictionary form; normalise through
// `AppConfig::rendered_syllable_joiner`, never compare the raw i32.
enum SyllableSeparator {
  SYLLABLE_SEPARATOR_UNSPECIFIED = 0;
  SYLLABLE_SEPARATOR_HYPHEN      = 1;
  SYLLABLE_SEPARATOR_NONE        = 2;
  SYLLABLE_SEPARATOR_SPACE       = 3;
}

// 2026-09-01 added `candidate_display_mode`: Romanization Only cells hide the hanji, so
// rows that differ only in hanji (homophones 食/𤆬 tsia̍h) become visible
// duplicates that only the engine can collapse consistently for four
// platforms. Set on the BASE config (every request) — composing AND nextword
// read it; the other request families ignore it. Platforms keep sending the
// derived `is_hanji_first` (and, on mobile, `output_both_scripts`; the
// desktop sends only the swap) — both `false` under Romanization Only — so
// spacing / recording semantics need no new reader.
//
// 2026-09-20 added `hyphenless_roman` (No Hyphens, USER): the rendered
// romanization drops the inter-syllable `-` and writes the neutral-tone marker `--`
// as `·` U+00B7 (`tâi-uân` → `tâiuân`, `hōo--guá` → `hōo·guá`). Rendering
// only — `phonetics::api::hyphenless_display` is applied to the candidate
// `roman` (`composing::requests`), the prediction `text`
// (`nextword::filter`) and the engine-synthesised compound joiner
// (`composing::api::nailed_prefix`); identity fields (`display_text`,
// `canonical_tl`, `tl`) and user-typed text keep their hyphens. The engine
// applies it only off the TPS layout (`AppConfig::renders_hyphenless`): the
// platform re-splits `roman` on `-` for bopomofo.
//
// 2026-10-06 replaced it with `syllable_separator` (field 14; tag 10
// reserved, USER: "No Hyphens becomes two options: space-separated and
// no-space-separated"): Hyphen keeps the dictionary form, None is the old
// No Hyphens, Space writes each syllable boundary as a space and the marker
// as ` ·` (`tâi uân`, `hōo ·guá`). Same readers, same identity / TPS rules,
// through `AppConfig::rendered_syllable_joiner` and
// `phonetics::api::syllable_joiner_display`.
//
// 2026-09-22 added `force_lowercase_nasal_marker` (ⁿ becomes ᴺ in capitals OFF, USER): the
// POJ nasal marker is always `ⁿ` U+207F, never `ᴺ` U+1D3A (Caps Lock
// `SIANN5` → `SIÂⁿ`). Inverted so the proto default keeps PR #102 (the
// marker follows the preceding letter's case). Rendering only
// (`phonetics::case_transform::apply_nasal_marker_case`, §53); identity
// keys already fold both glyphs to `nn`.
//
// 2026-09-30 (R6) `input_mode` accepts `"tps"` as a real mode, and
// `tps_or_maps_to_er` carries the TPS or→er dialect choice (the same flag
// `TlDisplayToTps` takes as `or_maps_to_er`). Under
// `"tps"` the engine composes with the TL tables and applies the TPS fold
// itself (`AppConfig::renders_hanji_first` / `rendered_syllable_joiner` in
// `engine/protos/src/lib.rs`), so `is_hanji_first` and
// `syllable_separator` are the Candidate-Display-projected stored values
// WITHOUT the TPS fold. The engine ships inside each app, so
// `input_mode = "tps"` is the only TPS wire. Nextword's empty-romanization
// drop and Enter skip read the swap as sent, not folded.
message AppConfig {
  // Tag 1 was `tone_mode` (set by nobody, read by nobody; removed 2026-09-30).
  reserved 1, 6, 7, 10;
  reserved "tone_mode", "is_association_recording_enabled", "platform_id",
      "hyphenless_roman";

  // "tl" | "poj" | "tps" | "english".
  string input_mode = 2;
  bool oo_doubletap_enabled = 3;
  bool nn_doubletap_enabled = 4;
  // Candidate-Display-projected Hanji-first swap, without the TPS fold.
  bool is_hanji_first = 5;
  bool output_both_scripts = 8;
  CandidateDisplayMode candidate_display_mode = 9;
  bool force_lowercase_nasal_marker = 11;
  // TPS or→er dialect switch; read by the TPS commit rendering
  // (`engine/composing/src/commit_text.rs`).
  bool tps_or_maps_to_er = 12;
  // Present = the preedit of a TPS buffer shows the converted Hanji
  // (`HanjiConversion`). Desktop-core sets it
  // (`desktop/crates/taigi-desktop-core/src/engine/bridge.rs`); read by
  // `engine/composing/src/conversion.rs`.
  HanjiConversion hanji_conversion = 13;
  // Syllable Separator as stored, without the TPS fold.
  SyllableSeparator syllable_separator = 14;
}

// Hanji conversion in the preedit
// (`docs/architecture/desktop-tps-hanji-conversion-roadmap.md` H1–H7): while
// the pending buffer is TPS glyphs, the engine keeps the walker's best path
// over the closed readings — closed by a tone mark, or by Space for tones 1
// and 4 — and the preedit shows it, with the glyphs of a reading still being
// typed where it is typed. `MoveCaret` steps over a converted word;
// `FetchAtPos` lists the word before the caret, a
// `CommitContinuous` of it keeps composing, and `CommitAsShown` /
// `CommitAsTyped` write the composition. A walk ranks with the user's learned
// counts when the engine holds the user-data stores.
// `Preedit.raw_input` stays the glyphs. TL / POJ buffers are never converted.
message HanjiConversion {
  // The user's dictionary switches, as `FetchAtPos.toggles`: a key carries no
  // fetch, so the conversion's source filter rides the config. Absent keeps
  // every source on.
  DictionarySourceToggles toggles = 1;
}

message Request {
  // Tag 2 was `CommandType type` — never read by the engine (routing uses the
  // `payload` oneof); removed 2026-09-25.
  reserved 2;
  reserved "type";

  uint32 id = 1;
  AppConfig config_snapshot = 3;
  uint64 generation = 4;
  oneof payload {
    PhoneticsRequest phonetics = 10;
    ComposingRequest composing = 11;
    LexiconRequest lexicon = 12;
    NextWordRequest nextword = 13;
    CaseRequest case_transform = 14;
    UserDataRequest user_data = 15;
  }
}

message Response {
  // Tag 3 echoed `Request.generation`; no platform read it back (removed
  // 2026-10-09 — the e2e trace takes it from the request).
  reserved 3;
  reserved "generation";

  uint32 id = 1;
  ErrorCode error = 2;
  oneof payload {
    PhoneticsResponse phonetics = 10;
    ComposingResponse composing = 11;
    LexiconResponse lexicon = 12;
    NextWordResponse nextword = 13;
    CaseResponse case_transform = 14;
    UserDataResponse user_data = 15;
  }
}
