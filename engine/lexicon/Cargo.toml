[package]
name = "lexicon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
# One test binary per concern (tests/it.rs etc.), not one per tests/*.rs.
autotests = false

[lib]
# No runnable doc examples (doc fences are `text`); skip the rustdoc pass.
doctest = false

[dependencies]
prost = { workspace = true }
fst = { workspace = true }
indexmap = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
once_cell = { workspace = true }
mmap-host = { workspace = true }
phonetics = { workspace = true }
protos = { workspace = true }
ranking = { workspace = true }

[dev-dependencies]
test-support = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "prod"
path = "tests/prod.rs"
