[config]
default_to_workspace = false

[tasks.fmt]
description = "Format all crates"
command = "cargo"
args = ["fmt", "--all"]

[tasks.fmt-check]
description = "Verify formatting"
command = "cargo"
args = ["fmt", "--all", "--", "--check"]

[tasks.clippy]
description = "Run clippy with -D warnings"
command = "cargo"
args = ["clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]

[tasks.test]
description = "Run all workspace tests"
command = "cargo"
args = ["test", "--workspace"]

[tasks.check]
description = "cargo check --workspace --locked"
command = "cargo"
args = ["check", "--workspace", "--locked"]

[tasks.audit]
description = "Run cargo-audit (requires separate install)"
command = "cargo"
args = ["audit"]

[tasks.deny]
description = "Run cargo-deny check (requires separate install)"
command = "cargo"
args = ["deny", "check"]

[tasks.ci]
# Canonical four-command pre-commit gate (fmt-check + check + clippy + test).
# Named `ci` for muscle-memory continuity but runs locally only — this project
# has no GitHub Actions CI for lint/format/test (only security.yml remains).
description = "Local pre-commit gate (rustfmt + check + clippy + test)"
dependencies = ["fmt-check", "check", "clippy", "test"]

# --- D9.2 platform-artifact wrappers ---------------------------------------
# Thin wrappers around the shell scripts. The bare-cargo gate stays canonical
# per `feedback_no_rust_ci.md`; cargo-make remains the optional orchestrator.

[tasks.gen-protos]
description = "Generate platform-side .pb.swift + .java from engine/protos/proto/"
script = ["scripts/gen-platform-protos.sh"]

[tasks.build-swift]
description = "Build release RustTaigi.xcframework (no panic-injector)"
script = ["scripts/build-xcframework.sh"]

[tasks.build-swift-dev]
description = "Build dev RustTaigi.xcframework (with panic-injector for T1)"
script = ["scripts/build-xcframework.sh --dev"]

[tasks.build-droid]
description = "Build release librust_taigi.so for arm64-v8a"
script = ["scripts/build-android-libs.sh"]

[tasks.build-droid-dev]
description = "Build dev librust_taigi.so (with panic-injector for T1)"
script = ["scripts/build-android-libs.sh --dev"]
